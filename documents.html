<!DOCTYPE html>
<!--
  ==========================================================================
  EARLY DISMISSAL — DOCUMENT FOLLOW-UP. A Discipline Committee screen.
  ==========================================================================
  Built 2 August 2026. Published in sajc-discipline-comm/discipline-hub as
  documents.html. A change here is a commit; no redeploy, ever.

  WHY IT IS ITS OWN PAGE AND NOT A SIXTH AREA IN THE HUB. Because index.html
  is 1,700 lines and nothing in it needs to be touched to ship this. When the
  Hub is next revised this becomes an area inside it and this file goes away.
  Until then, nothing that already works is at risk.

  WHAT IT WRITES. One thing: the outcome of one early dismissal, reversed or
  closed by a named person for a stated reason. It never edits what the
  General Office recorded, never changes whether a slip counts, and never
  sends mail.

  WHAT IT IS FOR — three questions nothing else in the stack can answer.
    1. Which early dismissals are still waiting on a form teacher, and how
       long have they waited.
    2. Which ones the machine has given up on, so a person has to chase them.
       That list is where the automated chase deliberately ends.
    3. What was recorded, from whose link, and when &mdash; and the only place
       any of it can be undone.

  WHAT IT MAY NEVER SAY. Every acknowledgement was made by somebody holding
  a link that was emailed to a named teacher. Not by that teacher. Every line
  on this page says "from the link sent to ..." for that reason.
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#27326a; --accent-deep:#1b2450; --accent-tint:#e8eaf3;
  --paper:#f7f5f1; --raised:#fffdfa; --line:#e4ded4;
  --ink:#1b1e2b; --muted:#6e7180;
  --good:#2f6b4f; --good-tint:#e6f0ea;
  --warn:#8a5a12; --warn-tint:#f7edda;
  --bad:#9d372e;  --bad-tint:#f7e8e5;
  --curve:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Public Sans',system-ui,-apple-system,sans-serif;font-size:17px;
  line-height:1.55;letter-spacing:-.005em;color:var(--ink);background:var(--paper);
  height:100vh;overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;font-weight:600}
h1{font-size:33px;line-height:1.16}
h1.big{font-size:44px;margin-bottom:6px;font-variation-settings:'opsz' 90,'SOFT' 30,'WONK' 1}

#view{height:100%;overflow-y:auto}
.screen{padding:44px 40px 40px;animation:rise .42s var(--curve) both}
.screen.still{animation:none}
.screen.centre{min-height:100%;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.wrap{max-width:760px;margin:0 auto;width:100%}
.wrap.wide{max-width:990px}

.date{font-size:19px;font-weight:600;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.date:after{content:'';flex:1;height:1px;background:var(--line)}
.centre .date{justify-content:center}
.centre .date:after{display:none}
.built{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.built.old{color:var(--warn)}
.who{font-size:15.5px;color:var(--muted);margin-bottom:16px}
.lede{font-size:15.5px;color:var(--muted);max-width:60ch;margin-top:12px}
/* On the centred sign-in the wrap is 760px but the lede is capped at 60ch, so
   without auto margins it sits flush left inside a centred column and reads as
   crooked. Same reason .field and .stack carry them. */
.centre .lede{margin-left:auto;margin-right:auto}

.grouplabel{display:flex;align-items:center;gap:14px;margin:30px 0 10px;font-size:11.5px;
  font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.grouplabel:after{content:'';flex:1;height:1px;background:var(--line)}

.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:11px;padding:14px 18px;display:flex;gap:16px;align-items:flex-start}
.row.open{border-left-color:var(--warn)}
.row.handed{border-left-color:var(--bad)}
.row.settled{border-left-color:var(--good)}
.row.quietrow{border-left-color:var(--line);background:#f4f2ee}
.rbody{flex:1 1 auto;min-width:0}
.rname{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:20px;line-height:1.2}
.rname em{font-style:normal;font-family:'Public Sans',sans-serif;font-size:13px;font-weight:400;
  color:var(--muted);margin-left:8px}
.rmeta{font-size:13.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.rsay{font-size:14px;color:var(--ink);margin-top:6px;line-height:1.5}
.rsay.q{color:var(--muted)}
.rside{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}

.tag{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;display:inline-block;color:#000;background:#eeeae3;
  white-space:nowrap}
.tag.quiet{background:#e6e2db;color:var(--muted)}
.tag.ok{background:var(--good-tint);color:var(--good)}
.tag.warn{background:var(--warn-tint);color:var(--warn)}
.tag.bad{background:var(--bad-tint);color:var(--bad)}

button{font:inherit;font-weight:500;font-size:16px;border:0;cursor:pointer;background:var(--accent);
  color:#fff;padding:15px 22px;border-radius:9px;box-shadow:0 2px 8px rgba(39,50,106,.18);
  transition:transform .18s var(--curve),background .18s var(--curve),box-shadow .18s var(--curve)}
button:hover{background:var(--accent-deep);transform:translateY(-1.5px);
  box-shadow:0 6px 16px rgba(39,50,106,.24)}
button:active{transform:translateY(1px)}
button:disabled{background:#cfcabf;box-shadow:none;cursor:default;transform:none}
button.ghost{background:none;color:var(--accent);box-shadow:none;border:1.5px solid var(--line)}
button.ghost:hover{background:var(--accent-tint);color:var(--accent-deep);box-shadow:none}
button.plain{background:none;color:var(--muted);box-shadow:none;font-size:14.5px;padding:6px 0}
button.plain:hover{background:none;color:var(--ink);transform:none;box-shadow:none;
  text-decoration:underline}
button.sm{font-size:14px;padding:9px 15px}

.field{margin-top:22px;max-width:430px}
.centre .field{margin-left:auto;margin-right:auto;text-align:left}
.field label{display:block;font-size:12.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.045em;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{font:inherit;font-size:16px;width:100%;background:var(--raised);
  border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;color:var(--ink)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:80px;resize:vertical}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:28px;max-width:430px}
.centre .stack{margin-left:auto;margin-right:auto;width:100%}
.stack.rowwise{flex-direction:row;max-width:100%;flex-wrap:wrap;align-items:center}
.gap{height:26px}

.note{border-left:3px solid var(--muted);background:#efece6;padding:13px 16px;
  border-radius:0 9px 9px 0;font-size:15px;margin-top:20px}
.note b{font-weight:600}
.note.err{border-color:var(--bad);background:var(--bad-tint);color:var(--bad)}
.note.warn{border-color:var(--warn);background:var(--warn-tint);color:var(--warn)}
.note.ok{border-color:var(--good);background:var(--good-tint);color:#22553f}
.note.q{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep)}
.note .field{margin-top:14px;max-width:100%}
.note .stack{margin-top:14px}

.blank{color:var(--muted);padding:22px 0 10px;font-size:17px}
.hintx{font-size:13.5px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);margin-top:26px;display:flex;gap:14px;
  align-items:baseline;flex-wrap:wrap}
.foot .sp{flex:1}
@media (max-width:640px){
  .screen{padding:28px 20px 34px}
  .row{flex-direction:column;gap:10px}
  .rside{align-items:flex-start;flex-direction:row}
}
</style>
</head>
<body>
<div id="view"><div class="screen"><div class="wrap"><p class="lede">Loading&hellip;</p></div></div></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxm68iLB0wBy-goORwxBAK3ZySAGT4LHV-R4KfB00PGdXL8fu569vrvvUUpzxF8nrhyIw/exec';

var AWAIT   = 'Awaiting';
var RECEIPT = 'Receipt only — nothing owed';
var CLOSED  = 'Closed by committee';

/* Token and name in memory only. Never localStorage — this reply carries
   student names and, through the addressed line, teacher names. */
var S = { token:'', user:'', name:'', busy:false, err:'', first:true,
          data:null, asking:null, askTo:'', askErr:'' };

var view = document.getElementById('view');

function esc(s){ return String(s===null||s===undefined?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function $(id){ return document.getElementById(id); }

/* Text first, then parse — so "could not reach it" and "it answered with
   something that is not a reply" stay different errors. */
function api(p){
  return fetch(GAS_URL,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(p)})
    .then(function(r){ return r.text(); })
    .then(function(t){
      try { return JSON.parse(t); }
      catch(e){
        var err = new Error('The server answered with something that is not a reply.');
        err.notJson = true; throw err;
      }
    });
}

function todayLong(){
  var d = new Date();
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mon = ['January','February','March','April','May','June','July','August',
             'September','October','November','December'];
  return days[d.getDay()] + ', ' + d.getDate() + ' ' + mon[d.getMonth()] + ' ' + d.getFullYear();
}

/* ── render ─────────────────────────────────────────────────────────────── */

function render(){
  var keep = view.scrollTop;
  view.innerHTML = S.token ? mainHtml() : signinHtml();
  view.scrollTop = S.first ? 0 : keep;
  S.first = false;
  wire();
}

function signinHtml(){
  return '<div class="screen centre' + (S.first?'':' still') + '"><div class="wrap">' +
    '<div class="date">' + esc(todayLong()) + '</div>' +
    '<h1 class="big">Early dismissal follow-up</h1>' +
    '<div class="lede">Discipline Committee only. This screen shows what the automatic ' +
      'emails have and have not achieved, and it is the only place an acknowledgement ' +
      'can be undone.</div>' +
    '<div class="gap"></div>' +
    '<div class="field"><label>Your name</label>' +
      '<input id="nm" autocomplete="name" value="' + esc(S.name) + '"></div>' +
    '<div class="field"><label>Committee password</label>' +
      '<input type="password" id="pw" autocomplete="current-password" autocapitalize="off" ' +
      'spellcheck="false"></div>' +
    '<div class="stack"><button id="go"' + (S.busy?' disabled':'') + '>' +
      (S.busy ? 'Logging in&hellip;' : 'Login') + '</button></div>' +
    (S.err ? '<div class="note err">' + esc(S.err) + '</div>' : '') +
  '</div></div>';
}

function mainHtml(){
  var d = S.data;
  if (!d) return '<div class="screen"><div class="wrap"><p class="lede">Loading&hellip;</p></div></div>';

  var rows = d.rows || [];
  var handed   = rows.filter(function(x){ return x.outcome===AWAIT && x.handedOn; });
  var open     = rows.filter(function(x){ return x.outcome===AWAIT && !x.handedOn; });
  var settled  = rows.filter(function(x){ return x.outcome!==AWAIT && x.outcome!==RECEIPT; });
  var receipts = rows.filter(function(x){ return x.outcome===RECEIPT; });

  var h = '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="date">' + esc(todayLong()) +
      ' <span class="built">as at ' + esc(d.serverTime || '') + '</span></div>' +
    '<h1>Early dismissal follow-up</h1>' +
    '<div class="who">Signed in as ' + esc(S.user) + '.</div>';

  if (d.onlyTo){
    h += '<div class="note err"><b>Every message is being redirected to ' + esc(d.onlyTo) +
      '.</b> No form teacher is receiving anything, whatever the switch below says. This is ' +
      'a test setting &mdash; clear <i>Early dismissal email &mdash; send only to</i> in ' +
      '&#9881;&#65039; Config when you have finished testing. A redirect left on looks ' +
      'exactly like a system that is working.</div>';
  }

  h += d.sendingOn
    ? '<div class="note ok"><b>Automatic sending is on.</b> Notices and reminders go out ' +
      'each afternoon. To stop them, set <i>Early dismissal email &mdash; send</i> in ' +
      '&#9881;&#65039; Config to anything other than <i>On</i>. It takes effect at the next run, ' +
      'with no redeploy.</div>'
    : '<div class="note warn"><b>Automatic sending is off.</b> Nothing is being emailed. ' +
      'Slips are still being logged, but no form teacher is being told and nothing below ' +
      'will move. Set <i>Early dismissal email &mdash; send</i> in &#9881;&#65039; Config to ' +
      '<i>On</i> when you are ready.</div>';

  h += '<div class="grouplabel">With the committee &mdash; the machine has stopped</div>';
  h += handed.length
    ? rowsHtml(handed, 'handed')
    : '<div class="blank">Nothing has been given up on. Every open case is still inside ' +
      'its two reminders.</div>';

  h += '<div class="grouplabel">Open &mdash; waiting on a form teacher</div>';
  h += open.length
    ? rowsHtml(open, 'open')
    : '<div class="blank">Nothing is outstanding. Every slip that owed a document has ' +
      'been acknowledged or queried.</div>';

  h += '<div class="grouplabel">Acknowledged, queried and closed</div>';
  h += settled.length
    ? rowsHtml(settled, 'settled')
    : '<div class="blank">Nothing has been acknowledged yet.</div>';

  if (receipts.length){
    h += '<div class="grouplabel">Receipts &mdash; nothing was owed, nothing was chased</div>' +
      '<div class="lede">These were named in a notice so the form teacher\'s record matches ' +
      'ours. They owe nothing, and the row exists only so the same receipt is not sent ' +
      'again tomorrow.</div>' + rowsHtml(receipts, 'quietrow');
  }

  h += '<div class="foot"><span>This screen writes one thing: the outcome of a slip, with ' +
    'who changed it and why. It never edits what the General Office recorded, never changes ' +
    'whether a slip counts, and never sends mail.</span><span class="sp"></span>' +
    '<button class="plain" id="out">Sign out</button></div>';

  return h + '</div></div>';
}

function rowsHtml(list, kind){
  var h = '<div class="rows">';
  list.forEach(function(x){ h += rowHtml(x, kind); });
  return h + '</div>';
}

function rowHtml(x, kind){
  var chased = [];
  if (x.chase1On) chased.push('reminded ' + x.chase1On);
  if (x.chase2On) chased.push('last reminder ' + x.chase2On);

  var meta = [x.cls, 'left early ' + x.date, x.reasonLabel];
  if (x.notifiedOn) meta.push('told ' + x.notifiedOn);
  meta = meta.concat(chased);

  var say = '';
  if (x.outcome === AWAIT && x.handedOn){
    say = 'Told the form teacher on ' + esc(x.notifiedOn) + ', reminded twice, and nothing ' +
          'came back. Handed over on ' + esc(x.handedOn) + ' &mdash; no further email will ' +
          'be sent about it. It is a person\'s job now.';
  } else if (x.outcome === AWAIT){
    say = 'Waiting. ' + (x.chase2On ? 'Both reminders have gone.'
        : x.chase1On ? 'One reminder has gone; one more to come.'
        : 'No reminder yet.');
  } else if (x.outcome === RECEIPT){
    say = 'Nothing was owed. Listed in the notice so the record matches.';
  } else {
    say = 'Recorded from the link sent to ' + esc(x.ackBy || 'somebody') +
          (x.ackOn ? ', ' + esc(x.ackOn) : '') + '. That is what the record says, and all ' +
          'it can say &mdash; a click is not the same as the named teacher.';
  }
  if (x.revBy){
    say += ' Reversed by ' + esc(x.revBy) + ' &mdash; ' + esc(x.revReason);
  }

  var tag = x.outcome === AWAIT
    ? (x.handedOn ? '<span class="tag bad">Given up on</span>' : '<span class="tag warn">Awaiting</span>')
    : x.outcome === RECEIPT ? '<span class="tag quiet">Nothing owed</span>'
    : x.outcome === 'Queried — not owed' ? '<span class="tag quiet">Queried</span>'
    : '<span class="tag ok">' + esc(x.outcome) + '</span>';

  var action = '';
  if (x.outcome === AWAIT){
    action = '<button class="ghost sm" data-close="' + esc(x.entryId) + '">Close it</button>';
  } else if (x.outcome !== RECEIPT){
    action = '<button class="plain" data-open="' + esc(x.entryId) + '">Reverse this</button>';
  }

  var h = '<div class="row ' + kind + '">' +
    '<div class="rbody">' +
      '<div class="rname">' + esc(x.name) + '<em>' + esc(x.notifiedTo || 'not addressed') + '</em></div>' +
      '<div class="rmeta">' + meta.map(esc).join(' &middot; ') + '</div>' +
      '<div class="rsay' + (x.outcome===RECEIPT?' q':'') + '">' + say + '</div>' +
      (S.asking === x.entryId ? askHtml(x) : '') +
    '</div>' +
    '<div class="rside">' + tag + action + '</div>' +
  '</div>';
  return h;
}

function askHtml(x){
  var toClosed = S.askTo === CLOSED;
  return '<div class="note q">' +
    '<b>' + (toClosed
      ? 'Closing this without a form teacher acknowledging it.'
      : 'Putting this back to awaiting.') + '</b> ' +
    (toClosed
      ? 'The record will say the committee closed it, not that a document arrived.'
      : 'It returns to the open list. If sending is on it will be reminded again.') +
    ' Nothing that was recorded is deleted &mdash; the row stays, with who decided and why.' +
    '<div class="field"><label>Why</label>' +
      '<textarea id="rsn" placeholder="Required. Without it the record is indistinguishable ' +
      'from a mistake when somebody reads it back in a year."></textarea></div>' +
    (S.askErr ? '<div class="note err" style="margin-top:12px">' + esc(S.askErr) + '</div>' : '') +
    '<div class="stack rowwise">' +
      '<button class="sm" id="doit"' + (S.busy?' disabled':'') + '>' +
        (S.busy ? 'Saving&hellip;' : (toClosed ? 'Close it' : 'Put it back')) + '</button>' +
      '<button class="plain" id="nope">Not yet</button>' +
    '</div></div>';
}

/* ── wiring ─────────────────────────────────────────────────────────────── */

function wire(){
  if ($('go')) $('go').addEventListener('click', signIn);
  if ($('pw')) $('pw').addEventListener('keydown', function(e){ if (e.key==='Enter') signIn(); });
  if ($('nm')){ if (S.name){ if ($('pw')) $('pw').focus(); } else $('nm').focus(); }
  if ($('out')) $('out').addEventListener('click', function(){
    S.token=''; S.data=null; S.first=true; render();
  });
  each('[data-close]', function(b){
    b.addEventListener('click', function(){
      S.asking = this.getAttribute('data-close'); S.askTo = CLOSED; S.askErr=''; render();
    });
  });
  each('[data-open]', function(b){
    b.addEventListener('click', function(){
      S.asking = this.getAttribute('data-open'); S.askTo = AWAIT; S.askErr=''; render();
    });
  });
  if ($('nope')) $('nope').addEventListener('click', function(){
    S.asking=null; S.askErr=''; render();
  });
  if ($('doit')) $('doit').addEventListener('click', doReverse);
}

function each(sel, fn){
  var n = view.querySelectorAll(sel);
  for (var i=0;i<n.length;i++) fn(n[i]);
}

function signIn(){
  var nm = $('nm') ? $('nm').value.trim() : '';
  var pw = $('pw') ? $('pw').value : '';
  /* Keep the name across a failed attempt. The second thing anybody does
     after mistyping a password is mistype it again, with their name gone. */
  S.name = nm;
  if (!nm){ S.err = 'Type your name. It goes into the record of anything you change.'; return render(); }
  if (!pw){ S.err = 'Type the password.'; return render(); }
  S.busy = true; S.err = ''; render();

  api({action:'hubLogin', password:pw}).then(function(r){
    S.busy = false;
    if (!r || !r.ok || !r.token){
      S.err = (r && r.error) || 'That did not sign you in. Nothing has been changed.';
      return render();
    }
    S.token = r.token; S.user = nm; S.first = true;
    render(); load();
  }).catch(function(){
    S.busy = false;
    S.err = 'Could not reach the server. Nothing was sent &mdash; try again.';
    render();
  });
}

function load(){
  api({action:'hubDocuments', token:S.token}).then(function(r){
    if (!r || !r.ok){
      S.data = { rows:[], sendingOn:false, serverTime:'' };
      render();
      view.querySelector('.wrap').insertAdjacentHTML('beforeend',
        '<div class="note err"><b>The follow-up records could not be read.</b> ' +
        esc((r && r.error) || 'No reason given.') + '</div>');
      return;
    }
    S.data = r; render();
  }).catch(function(){
    S.data = { rows:[], sendingOn:false, serverTime:'' }; render();
  });
}

function doReverse(){
  var reason = $('rsn') ? $('rsn').value.trim() : '';
  if (!reason){
    S.askErr = 'A reason is required. Without one the record is indistinguishable from a ' +
               'mistake when somebody reads it back in a year.';
    return render();
  }
  S.busy = true; S.askErr = ''; render();

  api({action:'hubDocumentReverse', token:S.token, entryId:S.asking,
       by:S.user, reason:reason, to:S.askTo})
    .then(function(r){
      S.busy = false;
      if (!r || !r.ok){
        S.askErr = (r && r.error) || 'That could not be changed. Nothing was saved.';
        return render();
      }
      S.asking = null; render(); load();
    })
    .catch(function(){
      /* A lost reply says nothing about what the server did. Reload and look,
         rather than claiming nothing was saved. */
      S.busy = false; S.asking = null; render();
      load();
      window.setTimeout(function(){
        var w = view.querySelector('.wrap');
        if (w) w.insertAdjacentHTML('afterbegin',
          '<div class="note warn"><b>The answer did not come back.</b> That says nothing ' +
          'about whether it saved, so the list has been reloaded &mdash; check the row ' +
          'below before trying again.</div>');
      }, 400);
    });
}

render();
</script>
</body>
</html>
