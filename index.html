<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SAJC Discipline Committee Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!--
  ============================================================================
  SAJC DISCIPLINE COMMITTEE HUB
  ============================================================================
  SLICE 1 — latecoming follow-up and the daily email.

  The menu shows all six areas with live counts, because seeing that JC1
  Attendance has not moved all week is half of what the menu is for. Only the
  two latecoming areas open; the rest say so plainly rather than pretending.

  WORK-SHAPED, NOT PERSON-SHAPED. There is no Roles tab and there never will
  be. Every area opens for anyone; the name you type at sign-in goes into the
  record, and that is the whole of what the Hub knows about you.

  IT WRITES ONE THING IN THIS SLICE: the follow-up stamp, in a batch, after
  you confirm the email was sent. Copying the email records nothing.

  NOTHING CAN FORCE A REBUILD, so no screen pretends the world updated. A
  stamp strikes the row through immediately and says out loud that the figures
  behind it are from the last snapshot.

  THE TOKEN AND THE TEACHER ADDRESSES ARE HELD IN MEMORY AND NOWHERE ELSE.
  No localStorage, no sessionStorage, no cookie.
  ============================================================================
-->

<style>
:root{
  --accent:#27326a; --accent-deep:#1b2450; --accent-tint:#e8eaf3;
  --paper:#f7f5f1; --raised:#fffdfa; --line:#e4ded4;
  --ink:#1b1e2b; --muted:#6e7180;
  --good:#2f6b4f; --good-tint:#e6f0ea;
  --warn:#8a5a12; --warn-tint:#f7edda;
  --bad:#9d372e;  --bad-tint:#f7e8e5;
  --sev5:#FF8080; --sev4:#FFA862; --sev3:#FFD27A; --sev2:#FFF2A8;
  --wash5:#fdeae8; --wash4:#fdf0e6; --wash3:#fdf6e6; --wash2:#fdfbe8;
  --curve:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,-apple-system,sans-serif;font-size:17px;
     line-height:1.55;letter-spacing:-.005em;color:var(--ink);background:var(--paper);
     height:100vh;overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;font-weight:600}
h1{font-size:33px;line-height:1.16;font-variation-settings:'opsz' 90,'SOFT' 30,'WONK' 1}
h1.big{font-size:44px;margin-bottom:6px}
h2{font-size:24px;margin-bottom:4px}

#view{height:100%;overflow-y:auto}
.screen{padding:44px 40px 40px;animation:rise .42s var(--curve) both}
.screen.still{animation:none}
.screen.centre{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.wrap{max-width:760px;margin:0 auto;width:100%}
.wrap.wide{max-width:990px}

.date{font-size:19px;font-weight:600;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.date:after{content:'';flex:1;height:1px;background:var(--line)}
.centre .date{justify-content:center}
.centre .date:after{display:none}
.built{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.built.old{color:var(--warn)}
.who{font-size:15.5px;color:var(--muted);margin-bottom:16px}
.sub{font-size:21px;color:var(--muted);font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1}
.lede{font-size:15.5px;color:var(--muted);max-width:52ch;margin-top:12px}
.gap{height:26px}
.centre .lede{margin-left:auto;margin-right:auto}
.foot{font-size:12.5px;color:var(--muted);margin-top:26px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.foot .sp{flex:1}

.appbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-size:13.5px;color:var(--muted)}
.appbar a{color:var(--accent);text-decoration:none;cursor:pointer}
.appbar a:hover{text-decoration:underline}

.field{margin-top:22px;max-width:430px}
.centre .field{margin-left:auto;margin-right:auto;text-align:left}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;
             letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.field input,.field textarea{width:100%;font:inherit;font-size:21px;color:var(--ink);background:none;
  border:0;border-bottom:2px solid var(--line);padding:6px 0;outline:none;
  transition:border-color .28s var(--curve)}
.field textarea{font-size:16.5px;resize:vertical;line-height:1.5;border:1.5px solid var(--line);
  border-radius:9px;padding:11px 13px}
.field input:focus,.field textarea:focus{border-bottom-color:var(--accent);border-color:var(--accent)}

.stack{display:flex;flex-direction:column;gap:9px;margin-top:28px;max-width:430px}
.centre .stack{margin-left:auto;margin-right:auto;width:100%}
.stack.rowwise{flex-direction:row;max-width:100%;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:500;font-size:16px;border:0;cursor:pointer;background:var(--accent);
  color:#fff;padding:15px 22px;border-radius:9px;box-shadow:0 2px 8px rgba(39,50,106,.18);
  transition:transform .18s var(--curve),background .18s var(--curve),box-shadow .18s var(--curve)}
button:hover{background:var(--accent-deep);transform:translateY(-1.5px);box-shadow:0 6px 16px rgba(39,50,106,.24)}
button:active{transform:translateY(1px)}
button:disabled{background:#cfcabf;box-shadow:none;cursor:default;transform:none}
button.ghost{background:none;color:var(--accent);box-shadow:none;border:1.5px solid var(--line)}
button.ghost:hover{background:var(--accent-tint);color:var(--accent-deep);box-shadow:none}
button.plain{background:none;color:var(--muted);box-shadow:none;font-size:14.5px;padding:6px 0}
button.plain:hover{background:none;color:var(--ink);transform:none;box-shadow:none;text-decoration:underline}
button.sm{font-size:14px;padding:9px 15px}

.mrows{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.mrow{display:flex;align-items:center;gap:20px;background:var(--raised);border:1px solid var(--line);
  border-left:4px solid var(--line);border-radius:11px;padding:16px 22px;cursor:pointer;
  transition:transform .2s var(--curve),border-color .2s var(--curve)}
.mrow:hover{transform:translateX(2.5px);border-color:#d6cfc2}
.mrow.t5{border-left-color:var(--sev5)} .mrow.t4{border-left-color:var(--sev4)}
.mrow.t3{border-left-color:var(--sev3)} .mrow.t2{border-left-color:var(--sev2)}
.mrow .mt{flex:1;font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:20px;min-width:0}
.mrow .mt em{display:block;font-family:'Public Sans',sans-serif;font-style:normal;font-size:12.5px;
  font-weight:400;color:var(--muted);letter-spacing:.01em;margin-top:2px}
.mnum{flex:0 0 168px;display:flex;align-items:baseline;gap:9px}
.mnum b{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:26px}
.mnum span{font-size:13px;color:var(--muted)}
.mnum.zero b{color:#bdb7ab} .mnum.zero span{color:#a9a498}
.mrow.soon{opacity:.62}
.mrow.soon:hover{transform:none;border-color:var(--line)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-top:10px}
.mtile{background:transparent;border:1px solid var(--line);border-radius:12px;padding:16px 20px 15px;
  cursor:pointer;transition:transform .2s var(--curve),box-shadow .2s var(--curve),border-color .2s var(--curve)}
.mtile:hover{transform:translateY(-2.5px);box-shadow:0 8px 22px rgba(39,50,106,.10);border-color:#d6cfc2}
.mtile h3{font-size:17px;margin-bottom:4px;color:var(--accent)}
.mtile .ts{font-size:13px;color:var(--muted)}

.grouplabel{display:flex;align-items:center;gap:14px;margin:30px 0 10px;font-size:11.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.grouplabel:after{content:'';flex:1;height:1px;background:var(--line)}

.tabs{display:flex;gap:26px;margin:16px 0 4px;border-bottom:1px solid var(--line)}
.tabs a{font-size:15px;color:var(--muted);cursor:pointer;padding:0 0 10px;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .2s var(--curve)}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.rows{margin-top:18px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:15px;background:var(--raised);border:1px solid var(--line);
  border-left:4px solid var(--line);border-radius:11px;padding:14px 18px;cursor:pointer;text-align:left;
  transition:transform .2s var(--curve),border-color .2s var(--curve),opacity .25s var(--curve),background .25s var(--curve)}
.row:hover{transform:translateX(2.5px)}
.row.flat,.row.flat:hover{cursor:default;transform:none}
.row.t5{background:var(--wash5);border-color:#f2ddda;border-left-color:var(--sev5)}
.row.t4{background:var(--wash4);border-color:#f2e4d5;border-left-color:var(--sev4)}
.row.t3{background:var(--wash3);border-color:#f2ead4;border-left-color:var(--sev3)}
.row.t2{background:var(--wash2);border-color:#f0eed6;border-left-color:var(--sev2)}
.row .badge{flex:0 0 27px;height:27px;border-radius:50%;border:1.5px solid rgba(0,0,0,.14);
  background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;color:var(--muted);transition:all .2s var(--curve)}
.row.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.row.sel .badge{background:var(--accent);border-color:var(--accent);color:#fff}
.row .body{flex:1;min-width:0}
.row .p{font-weight:600;font-size:17px}
.row .p small{font-weight:400;color:var(--muted);font-size:15px;margin-left:7px}
/* Class and level on their own line. Three short lines read faster than one
   long one when you are scanning forty rows for a name you half-remember. */
.row .meta{font-size:14px;color:var(--muted);margin-top:1px;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap}
.row .meta .tag{font-size:10.5px;padding:3px 8px}
.row .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.row .s b{color:var(--ink);font-weight:600}
.row.done{opacity:.42;background:#f0eeea;border-color:var(--line);border-left-color:var(--line)}
.row.done .p{text-decoration:line-through}
.stats{display:flex;flex:0 0 auto}
.stat{text-align:center;padding:0 16px;border-left:1px solid rgba(0,0,0,.09)}
.stat:first-child{border-left:0}
.stat .k{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);white-space:nowrap}
.stat .v{font-size:27px;font-weight:600;line-height:1.15;font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1}
.tierslot{flex:0 0 230px;text-align:right}
.rowgo{flex:0 0 auto;display:flex;align-items:center;gap:0;margin-left:6px;padding:8px 6px 8px 2px;
  border-radius:8px;color:#b8b2a6;cursor:pointer;
  transition:color .2s var(--curve),background .2s var(--curve),gap .2s var(--curve)}
.rowgo .lbl{max-width:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600;
  opacity:0;transition:max-width .22s var(--curve),opacity .18s var(--curve)}
.rowgo .chev{font-size:19px;line-height:1;transition:transform .22s var(--curve)}
.row:hover .rowgo{color:var(--accent)}
.row:hover .rowgo .lbl{max-width:52px;opacity:1}
.row:hover .rowgo .chev{transform:translateX(3px)}
.rowgo:hover{background:var(--accent-tint);color:var(--accent-deep) !important}
.rowgo:hover .chev{transform:translateX(5px)}
.rowgo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tierslot .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}

.tag{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;
  border-radius:999px;display:inline-block;color:#000;background:#eeeae3}
.tag.t5{background:var(--sev5)} .tag.t4{background:var(--sev4)}
.tag.t3{background:var(--sev3)} .tag.t2{background:var(--sev2)}
.tag.quiet{background:#e6e2db;color:var(--muted)}
.tag.ok{background:var(--good-tint);color:var(--good)}
.tag.thu{background:var(--accent-tint);color:var(--accent)}

.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;color:#000;
  display:inline-block;white-space:nowrap;background:#eeeae3}
.chip.t5{background:var(--sev5)} .chip.t4{background:var(--sev4)}
.chip.t3{background:var(--sev3)} .chip.t2{background:var(--sev2)}
.chip.none{background:#e6e2db;color:var(--muted)}

.legend{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.legend .lt{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
.legend .li{display:flex;gap:12px;align-items:baseline;font-size:13.5px;padding:3px 0;color:var(--muted)}
.legend .li b{flex:0 0 62px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#000;background:#eeeae3}
.legend .li b.t5{background:var(--sev5)} .legend .li b.t4{background:var(--sev4)}
.legend .li b.t3{background:var(--sev3)} .legend .li b.t2{background:var(--sev2)}
.legend .li span{color:var(--ink)}

.note{border-left:3px solid var(--muted);background:#efece6;padding:13px 16px;border-radius:0 9px 9px 0;
  font-size:15px;margin-top:20px}
.note.err{border-color:var(--bad);background:var(--bad-tint);color:var(--bad)}
.note.warn{border-color:var(--warn);background:var(--warn-tint);color:var(--warn)}
.note.ok{border-color:var(--good);background:var(--good-tint);color:#22553f}
.note.q{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep)}
.note b{font-weight:600}

.mailto{background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:16px 20px;
  margin-top:16px;font-size:14px;line-height:1.65}
.mailto b{color:var(--ink);font-weight:600;display:inline-block;min-width:62px}
.mailto .addr{color:var(--muted);font-size:13.5px;margin-top:6px;padding-top:10px;
  border-top:1px solid var(--line);word-break:break-word}
.mailbox{background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:22px 24px;
  margin-top:12px;font-size:15px;line-height:1.6}
.mailbox p{margin-bottom:12px}

table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;margin-top:14px}
table th{text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);padding:0 10px 7px 10px}
table td{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.05);vertical-align:top}
table td.n{font-variant-numeric:tabular-nums;text-align:right}
/* Fixed columns so the two tables in one message line up with each other,
   and so a tier never breaks across two lines. */
table.etbl{table-layout:fixed}
table.etbl th:nth-child(1),table.etbl td:nth-child(1){width:31%}
table.etbl th:nth-child(2),table.etbl td:nth-child(2){width:10%}
table.etbl th:nth-child(3),table.etbl td:nth-child(3){width:11%}
table.etbl th:nth-child(4),table.etbl td:nth-child(4){width:11%}
table.etbl th.c,table.etbl td.c{width:13%;white-space:nowrap}
table.etbl th.n,table.etbl td.n{white-space:nowrap}
.mailbox h3{margin-top:28px}
tr.t5 td{background:var(--wash5)} tr.t4 td{background:var(--wash4)}
tr.t3 td{background:var(--wash3)} tr.t2 td{background:var(--wash2)}

.opn{color:var(--accent);cursor:pointer;text-decoration:underline}
.opn:hover{color:var(--accent-deep)}

.bigstats{display:flex;gap:54px;margin-top:26px;flex-wrap:wrap}
.bigstats .k{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.bigstats .v{font-size:46px;font-weight:600;line-height:1.1;font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 90,'SOFT' 30,'WONK' 1}

.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-top:12px}
.lcard{background:var(--raised);border:1px solid var(--line);border-top:4px solid var(--line);
  border-radius:12px;padding:16px 20px 15px;position:relative}
.lcard.t5{border-top-color:var(--sev5)} .lcard.t4{border-top-color:var(--sev4)}
.lcard.t3{border-top-color:var(--sev3)} .lcard.t2{border-top-color:var(--sev2)}
.lcard.here{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.lctop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.lcname{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:19px;min-width:0}
.lcname em{display:block;font-family:'Public Sans',sans-serif;font-style:normal;font-size:12px;
  font-weight:400;color:var(--muted);margin-top:3px}
.lcnums{display:flex;gap:28px;margin-top:14px}
.lcnums b{display:block;font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 90,'SOFT' 30,'WONK' 1;font-weight:600;font-size:34px;line-height:1.05}
.lcnums span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.lcact{margin-top:13px;font-size:14px;color:var(--muted);line-height:1.5}
.lchold{margin-top:10px;font-size:12.5px;color:var(--warn);font-weight:600}
.lchere{margin-top:10px;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.12em;color:var(--accent)}

.ghead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:22px 0 8px}
.ghead .gh{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:19px}
.ghead .gh small{font-family:'Public Sans',sans-serif;font-size:12.5px;font-weight:400;color:var(--muted)}
.ghead .gsum{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.ghead .gaside{flex:1 0 100%;font-size:12.5px;color:var(--muted)}
.tsub{font-size:12.5px;color:var(--muted)}
.tsub b{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1;
  font-size:19px;color:var(--ink);margin-left:4px}
.tsub.yr b{color:var(--accent)}

.tdiv{display:flex;align-items:center;gap:12px;margin:16px 0 7px;font-size:11.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tdiv b{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1;
  font-size:17px;letter-spacing:0;color:var(--ink)}
.tdiv:after{content:'';flex:1;height:1px;background:var(--line)}
.tl .tdiv:first-child{margin-top:8px}

.rem{margin-top:6px;padding:7px 11px;border-left:2px solid #d8d2c6;background:#f4f1eb;
  border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink);line-height:1.5}
.rem.none{color:var(--muted);background:none;border-left-style:dashed}
.askrow{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #cdd3e6;font-size:14.5px}

.tl{margin-top:6px}
.tlrow{display:flex;gap:18px;align-items:flex-start;padding:12px 16px;background:var(--raised);
  border:1px solid var(--line);border-radius:9px;margin-bottom:5px}
.tlrow.off{background:#f0eeea;opacity:.72}
.tld{flex:0 0 190px;font-weight:600;font-size:15px}
.tld span{display:block;font-weight:400;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tlb{flex:1;min-width:0;font-size:15px}
.tlb small{color:var(--muted);font-size:13px;margin-left:6px}
.tlb .tag{margin-right:4px}
.tlwhy{font-size:13px;color:var(--muted);margin-top:4px}
.tla{flex:0 0 auto}

table.bracket td{border:0;padding:9px 10px}
table.bracket tr.here td{font-weight:600;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent)}
table.bracket tr.here td:first-child{border-left:2px solid var(--accent)}
table.bracket tr.here td:last-child{border-right:2px solid var(--accent)}

.loading{display:flex;align-items:center;gap:14px;margin-top:14px;color:var(--muted);font-size:14.5px}
.loading b{display:block;color:var(--ink);font-weight:600;font-size:15.5px}
.loading span{display:block;font-size:13.5px}
.hintx{font-size:13px;color:var(--muted)}
.diag{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.09);font-size:13.5px}
.diag .drow{display:flex;gap:16px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap}
.diag .drow > b{flex:0 0 190px;font-weight:600;color:var(--ink);font-size:12px;
  text-transform:uppercase;letter-spacing:.1em}
.diag .drow > div{flex:1;min-width:220px}
.diag i{color:var(--muted);font-style:normal}
.diag .dwhy{color:var(--ink);line-height:1.55}
.dchip{display:inline-block;font-size:12px;font-variant-numeric:tabular-nums;padding:2px 8px;
  border-radius:6px;margin:0 5px 5px 0;background:#efece6;color:var(--muted)}
.dchip.ok{background:var(--good-tint);color:var(--good)}
.dchip.bad{background:var(--bad-tint);color:var(--bad);font-weight:600}
.dchip.warn{background:var(--warn-tint);color:var(--warn);font-weight:600}
.diag .dline{margin-bottom:5px;color:var(--muted)}
.spin{flex:0 0 auto;width:19px;height:19px;border-radius:50%;
  border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{margin-top:12px}
.skel i{display:block;height:56px;border-radius:9px;background:linear-gradient(90deg,#f1efea,#f7f5f1,#f1efea);
  background-size:200% 100%;animation:sh 1.3s var(--curve) infinite;margin-bottom:5px}
.skel i:nth-child(2){animation-delay:.12s;opacity:.75}
.skel i:nth-child(3){animation-delay:.24s;opacity:.5}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-20% 0}}

.blank{color:var(--muted);padding:46px 0 10px;font-size:17px}
.hidden{display:none !important}

@media (max-width:820px){
  .screen{padding:26px 18px 34px}
  .mnum{flex:0 0 120px} .mnum b{font-size:22px}
  .tierslot{flex:0 0 170px}
  .stats{display:none}
}

<body>
<div id="view"></div>

<script>
(function(){
'use strict';

var GAS_URL = 'https://script.google.com/macros/s/AKfycbxm68iLB0wBy-goORwxBAK3ZySAGT4LHV-R4KfB00PGdXL8fu569vrvvUUpzxF8nrhyIw/exec';

/* The other tools in the project. One bookmark instead of four. */
var TOOLS = [
  { t:'Latecoming Scanner',          s:'Gate duty &mdash; photograph the card',
    u:'https://sajc-discipline-comm.github.io/latecoming-scanner/' },
  { t:'Grooming &amp; Attire Check', s:'Check, recheck, and the term list',
    u:'https://sajc-discipline-comm.github.io/grooming-and-attire-check/' },
  { t:'Early Release Form',          s:'General Office &mdash; green slips',
    u:'https://sajc-discipline-comm.github.io/green-slip/' },
  { t:'Latecoming &mdash; Live Data', s:'General Office &mdash; this morning\'s gate scans',
    u:'https://sajc-discipline-comm.github.io/latecoming-live/' }
];

/* How old a snapshot has to be before the stamp turns amber. */
var STALE_MIN = 150;

/* Kim's wording, 2 August. The last sentence is the one that matters: losing
   the privilege means the Thursday 08:40 start no longer applies to them, so
   they are late from 08:10 like any other day. Saying only "the privilege is
   removed" leaves the form teacher to work that out. */
var THU_PARA = 'Separately — the following students have been late on three or more ' +
  'different Thursdays, so the Discipline Master will be removing their Thursday late ' +
  'privilege. Please ensure that they arrive by 8.10AM on Thursdays from now on.';

var TOKEN = null;

var S = {
  view:'signin', user:'', name:'', busy:false, err:'',
  snap:null,            // hubSnapshot's reply, whole
  det:null,             // hubDetention's reply, or null
  teachers:null,        // hubTeachers, IN MEMORY ONLY
  area:'', tab:'follow',
  student:null,         // { id, name, cls, cohort, domain, row } — who is open
  history:null,         // hubHistory's reply for that student
  hLoading:false, hErr:'',
  ask:null,             // { kind:'overturn'|'hold'|'unhold', entryId, reason }
  tLoading:false, tErr:'', diag:false,
  local:{},             // entryId -> 'Overturned', until the next rebuild
  holdLocal:{},         // studentId|domain -> 'Held' | 'Open', likewise
  sel:{},               // entryId -> true
  stamped:{},           // entryId -> {by, when} — optimistic, until the next rebuild
  result:null,
  first:true
};

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s===null||s===undefined?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ── transport ────────────────────────────────────────────────────────── */
function api(action, body){
  if (window.__mockApi) return window.__mockApi(action, body);
  var payload = body || {};
  payload.action = action;
  return fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload), redirect:'follow'
  }).then(function(r){ return r.json(); });
}

/* ── the snapshot, read by NAME ───────────────────────────────────────── */
/* C returns positional rows plus the header list. Building the accessor from
   that list rather than counting positions is what stops a column inserted in
   the middle from silently shifting every screen in the Hub. */
function colIndex(columns){
  var m = {};
  (columns || []).forEach(function(c,i){ m[String(c).trim().toLowerCase()] = i; });
  return m;
}
function cell(row, cols, name){
  var i = cols[String(name).trim().toLowerCase()];
  return (i === undefined) ? '' : row[i];
}

/* One snapshot row, as an object the screens can read. */
function snapRow(r, cols){
  return {
    domain:   String(cell(r,cols,'Domain')||''),
    area:     String(cell(r,cols,'Area')||''),
    cohort:   String(cell(r,cols,'Cohort')||''),
    id:       String(cell(r,cols,'Student ID')||''),
    name:     String(cell(r,cols,'Name')||''),
    cls:      String(cell(r,cols,'Class')||''),
    term:     Number(cell(r,cols,'Term count'))||0,
    year:     Number(cell(r,cols,'Year count'))||0,
    tier:     Number(cell(r,cols,'Tier'))||0,
    action:   String(cell(r,cols,'Action')||''),
    whoActs:  String(cell(r,cols,'Who acts')||''),
    follows:  /^y/i.test(String(cell(r,cols,'DC follows up')||'')),
    sessions: Number(cell(r,cols,'Detention sessions'))||0,
    last:     String(cell(r,cols,'Last offence date')||''),
    entryId:  String(cell(r,cols,'Entry ID')||''),
    state:    String(cell(r,cols,'State')||''),
    heldBy:   String(cell(r,cols,'Held by')||''),
    heldOn:   String(cell(r,cols,'Held since')||''),
    heldWhy:  String(cell(r,cols,'Hold reason')||''),
    atDM:     /^y/i.test(String(cell(r,cols,'At DM boundary')||'')),
    quiet:    Number(cell(r,cols,'Days since last offence')),
    dates:    String(cell(r,cols,'Dates')||'')
  };
}

function allRows(){
  if (!S.snap) return [];
  var cols = colIndex(S.snap.columns);
  return (S.snap.rows||[]).map(function(r){ return snapRow(r, cols); });
}

function isHeld(x){ return /held/i.test(x.state); }
function isStamped(x){ return !!S.stamped[x.entryId]; }

/* ── the six menu areas ───────────────────────────────────────────────── */
/* Domains, not people. 'Thursday privilege' folds into its cohort's
   latecoming worklist — it is one rule and the same person's job, not a
   ladder anybody works through. */
var AREAS = [
  { key:'JC1 Latecoming', title:'JC1 Latecoming', built:true,
    match:function(x){ return x.cohort==='JC1' && (x.domain==='Latecoming' || x.domain==='Thursday privilege'); } },
  { key:'JC2 Latecoming', title:'JC2 Latecoming', built:true,
    match:function(x){ return x.cohort==='JC2' && (x.domain==='Latecoming' || x.domain==='Thursday privilege'); } },
  { key:'JC1 Attendance', title:'JC1 Attendance', built:false,
    match:function(x){ return x.cohort==='JC1' && /^A\(/.test(x.domain); } },
  { key:'JC2 Attendance', title:'JC2 Attendance', built:false,
    match:function(x){ return x.cohort==='JC2' && /^A\(/.test(x.domain); } }
];
function areaOf(key){ for (var i=0;i<AREAS.length;i++) if (AREAS[i].key===key) return AREAS[i]; return null; }

function rowsFor(key){
  var a = areaOf(key); if (!a) return [];
  return allRows().filter(a.match);
}

/* Worklist = the committee's to do. Tiers the ladder says the DC does not
   follow up never appear here — latecoming 1 and 2 are the form teacher's
   alone, recorded and counted and deliberately not ours. */
function worklist(key){
  return rowsFor(key).filter(function(x){ return x.follows && !isHeld(x); })
    .sort(function(a,b){
      if (b.tier !== a.tier) return b.tier - a.tier;
      if (b.term !== a.term) return b.term - a.term;
      return String(a.name).localeCompare(String(b.name));
    });
}
function heldIn(key){ return rowsFor(key).filter(isHeld); }

/* Sessions still to book: what the tier says is owed, less what is already in
   🪑 Detention for that student in that area. */
function bookedFor(id, area){
  if (!S.det || !S.det.rows) return null;
  var c = colIndex(S.det.columns), n = 0;
  S.det.rows.forEach(function(r){
    if (String(cell(r,c,'Student ID')).trim() !== id) return;
    if (String(cell(r,c,'Area')).trim() !== area) return;
    n++;
  });
  return n;
}
function toSchedule(key){
  var n = 0, unknown = false;
  rowsFor(key).forEach(function(x){
    if (!x.sessions) return;
    var b = bookedFor(x.id, x.area);
    if (b === null){ unknown = true; n += x.sessions; }
    else n += Math.max(0, x.sessions - b);
  });
  return { n:n, unknown:unknown };
}

function sevClass(t){ return t>=5?'t5':t===4?'t4':t===3?'t3':t>=1?'t2':''; }

/* ── dates and text ───────────────────────────────────────────────────── */
var MONTHS=['January','February','March','April','May','June','July','August',
            'September','October','November','December'];
var DAYNAME={sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};

/* '29 Jul 2026 (Wed)' → 'Wednesday 29 July'. */
function longish(stamp){
  var m = /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s*\(([A-Za-z]{3})\)/.exec(String(stamp||''));
  if (!m) return String(stamp||'');
  var mi = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']
             .indexOf(m[2].toLowerCase());
  var dow = DAYNAME[m[4].toLowerCase()];
  if (mi < 0 || !dow) return String(stamp);
  return dow + ' ' + Number(m[1]) + ' ' + MONTHS[mi];
}
function todayLong(){
  var d = new Date();
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()] +
         ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
/* '02 Jul 2026 · 09 Jul 2026 · 29 Jul 2026' → '02 Jul · 09 Jul · 29 Jul'.
   The year is the same on every row of the email and the column is the widest
   thing in the table, so it is repetition paid for in wrapped lines. IF THE
   YEARS DIFFER the string is left alone — a date list that straddles a year
   boundary is exactly when the year is the thing you need to see. */
function shortDates(str){
  var s = String(str || '');
  var years = s.match(/\b[A-Za-z]{3}\s+(\d{4})\b/g);
  if (!years || !years.length) return s;
  var first = years[0].slice(-4);
  for (var i = 1; i < years.length; i++) if (years[i].slice(-4) !== first) return s;
  return s.replace(/(\b[A-Za-z]{3})\s+\d{4}\b/g, '$1');
}

function ordinal(n){
  n = Number(n)||0;
  var s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function mins(hhmm){
  var m=/^(\d{1,2}):(\d{2})/.exec(String(hhmm||''));
  return m ? Number(m[1])*60+Number(m[2]) : null;
}

/* How old the snapshot is, in words. Every slow screen carries this because
   nothing on the client can force a rebuild. */
function builtHtml(){
  if (!S.snap) return '';
  var at = String(S.snap.rebuiltAt||'').trim();
  if (!at) return '<span class="built old">Never rebuilt &mdash; run 📸 Rebuild the Snapshot now</span>';
  var m = /(\d{1,2}:\d{2})\s*$/.exec(at);
  var shown = m ? m[1] : at;
  var age = (m && mins(S.snap.serverTime)!==null) ? mins(S.snap.serverTime) - mins(m[1]) : null;
  var old = (age !== null && age > STALE_MIN);
  return '<span class="built' + (old?' old':'') + '">Built ' + esc(shown) +
         (old ? ' &mdash; ' + Math.round(age/60) + 'h ago' : '') + '</span>';
}

/* ── sign in ──────────────────────────────────────────────────────────── */
function signIn(){
  var pw = $('pw') ? $('pw').value : '';
  var nm = $('nm') ? $('nm').value.trim() : '';
  /* Keep the name across a failed attempt. Re-rendering the screen would
     otherwise wipe it, and the second thing anybody does after mistyping a
     password is mistype it again — with their name silently gone. */
  S.name = nm;
  if (!nm){ S.err='Type your name. It goes into the record of every follow-up you make.'; render(); return; }
  if (!pw){ S.err='Type the password.'; render(); return; }
  S.busy = true; S.err = ''; render();   // label change only — see signinHtml

  api('hubLogin', { password: pw }).then(function(res){
    if (!res || !res.ok){ S.busy=false; S.err=(res&&res.error)||'Could not sign in.'; render(); return; }
    TOKEN = res.token; S.user = nm;
    return loadAll().then(function(){
      S.busy = false; S.view = 'menu'; render(true);
    });
  }).catch(function(){
    S.busy = false;
    /* NAME THE ADDRESS THAT FAILED. "Could not reach the server" is true and
       useless: the three real causes need three different actions, and two of
       them are invisible unless the URL is on screen. */
    S.err = 'Could not reach the server at ' + GAS_URL + ' — nothing was sent. ' +
            'Three things cause this: the deployment at that address no longer exists ' +
            '(check Deploy → Manage deployments — a NEW deployment issues a different ' +
            '/exec and leaves this one stranded); the page is being opened straight from ' +
            'your disk rather than from its web address; or the connection is down.';
    render();
  });
}

/* Three reads. The snapshot is the only one the menu cannot do without. */
function loadAll(){
  return api('hubSnapshot', { token: TOKEN }).then(function(res){
    if (!res || !res.ok) throw new Error((res&&res.error) || 'The snapshot could not be read.');
    S.snap = res;
    return api('hubDetention', { token: TOKEN }).then(function(d){
      S.det = (d && d.ok) ? d : null;      // null = "we do not know what is booked"
    }).catch(function(){ S.det = null; });
  });
}

function signOut(){
  TOKEN=null; S.teachers=null;
  S.view='signin'; S.snap=null; S.det=null; S.sel={}; S.stamped={}; S.user='';
  S.err=''; S.first=true; S.result=null; S.name='';
  S.student=null; S.history=null; S.ask=null; S.local={}; S.holdLocal={};
  render(true);
}

/* ── navigation ───────────────────────────────────────────────────────── */
function go(v, extra){
  var moved = (S.view !== v) || !!extra;
  if (extra) for (var k in extra) S[k] = extra[k];
  S.view = v;
  render(moved);
}
window.__hubGo = go;

function openArea(key){
  var a = areaOf(key);
  if (!a) return;
  S.sel = {};
  worklist(key).forEach(function(x){ if (!isStamped(x)) S.sel[x.entryId] = true; });
  go('lc', { area:key, tab:'follow' });
}

/* ── render ───────────────────────────────────────────────────────────── */
function render(moved){
  var v = $('view');
  var keep = v.scrollTop;
  var html = '';
  if (S.view==='signin')      html = signinHtml();
  else if (S.view==='menu')   html = menuHtml();
  else if (S.view==='lc')     html = lcHtml();
  else if (S.view==='email')  html = emailHtml();
  else if (S.view==='sent')   html = sentHtml();
  else if (S.view==='student') html = studentHtml();
  else if (S.view==='soon')   html = soonHtml();
  v.innerHTML = html;
  if (moved){ v.scrollTop = 0; } else { v.scrollTop = keep; }
  wire();
  S.first = false;
}

function screenOpen(cls){
  return '<div class="screen' + (S.first?'':(moveless?'':'')) + (cls?' '+cls:'') + '">';
}
var moveless = false;

function signinHtml(){
  /* THE SIGN-IN SCREEN ANIMATES ONCE. Going busy is a change of button label,
     not a change of screen — replaying the entrance every time the state
     moved made a slow sign-in look like a page reloading itself. */
  return '<div class="screen centre' + (S.first ? '' : ' still') + '"><div class="wrap">' +
    '<div class="date">' + esc(todayLong()) + '</div>' +
    '<h1 class="big">SAJC Discipline Committee Hub</h1>' +
    '<div class="gap"></div>' +
    '<div class="field"><label>Your name</label>' +
      '<input id="nm" autocomplete="name" value="' + esc(S.name || S.user) + '"></div>' +
    '<div class="field"><label>Committee password</label>' +
      '<input type="password" id="pw" autocomplete="current-password" autocapitalize="off" spellcheck="false"></div>' +
    '<div class="stack"><button id="go"' + (S.busy?' disabled':'') + '>' +
      (S.busy ? 'Logging in&hellip;' : 'Login') + '</button></div>' +
    (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') +
  '</div></div>';
}

function menuHtml(){
  function big(v, l, zero){
    return '<div class="mnum' + (v ? '' : ' zero') + '"><b>' + v + '</b><span>' + l + '</span></div>';
  }

  var rows = AREAS.map(function(a){
    var w = worklist(a.key).filter(function(x){ return !isStamped(x); });
    var top = w.length ? w[0].tier : 0;
    var sch = toSchedule(a.key);
    var thu = rowsFor(a.key).filter(function(x){ return x.domain==='Thursday privilege'; }).length;
    return '<div class="mrow ' + sevClass(top) + (a.built?'':' soon') + '" data-area="' + esc(a.key) + '">' +
      '<div class="mt">' + esc(a.title) +
        (a.built ? (thu ? '<em>includes ' + thu + ' Thursday privilege</em>' : '')
                 : '<em>counts are live &mdash; the screen is not built yet</em>') + '</div>' +
      big(w.length, 'to follow up') +
      big(heldIn(a.key).length, 'on hold') +
      big(sch.n, 'detention session' + (sch.n===1?'':'s') + (sch.unknown ? ' owed' : ' to schedule')) +
    '</div>';
  }).join('');

  var det = S.det && S.det.rows ? S.det.rows.length : 0;
  rows += '<div class="mrow soon" data-area="__det"><div class="mt">Detention Sessions' +
    '<em>' + (S.det ? det + ' row' + (det===1?'':'s') + ' in 🪑 Detention &mdash; the screen is not built yet'
                    : 'could not read 🪑 Detention') + '</em></div></div>';

  var dm = allRows().filter(function(x){ return x.atDM && !isHeld(x); }).length;
  var held = allRows().filter(isHeld).length;
  rows += '<div class="mrow soon" data-area="__dm"><div class="mt">Discipline Daily Overview' +
    '<em>counts are live &mdash; the screen is not built yet</em></div>' +
    big(dm, 'to see the DM') + big(held, 'on hold across all areas') + '</div>';

  var tools = '<div class="grouplabel">Open another tool</div><div class="mgrid">' +
    TOOLS.map(function(t){
      return '<div class="mtile" data-url="' + esc(t.u) + '"><h3>' + t.t + '</h3>' +
             '<div class="ts">' + t.s + '</div></div>';
    }).join('') + '</div>';

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="date">' + esc(todayLong()) + ' ' + builtHtml() + '</div>' +
    '<h1>SAJC Discipline Committee Hub</h1>' +
    '<div class="who">Signed in as ' + esc(S.user) + '.</div>' +
    '<div class="mrows">' + rows + '</div>' + tools +
    '<div class="foot"><span>Counts come from the snapshot, which rebuilds hourly. ' +
    'Nothing is locked &mdash; every area opens for anyone.</span>' +
    '<span class="sp"></span><button class="plain" id="out">Sign out</button></div>' +
  '</div></div>';
}

/* ── a latecoming area ────────────────────────────────────────────────── */
function lcHtml(){
  var key = S.area, a = areaOf(key);
  var w = worklist(key), held = heldIn(key);
  var pick = w.filter(function(x){ return S.sel[x.entryId] && !isStamped(x); });

  var body = '';
  if (S.tab === 'follow'){
    if (!w.length){
      body = '<div class="blank">Nobody in ' + esc(a.title) + ' is at a tier the committee follows up. ' +
             'Tiers 1 and 2 are the form teacher\'s alone &mdash; they are recorded and counted, ' +
             'and deliberately never reach this list.</div>';
    } else {
      body = '<div class="rows">' + w.map(lcRow).join('') + '</div>' +
        '<div class="stack rowwise">' +
          '<button id="mail"' + (pick.length?'':' disabled') + '>Write today\'s email &mdash; ' +
            pick.length + ' student' + (pick.length===1?'':'s') + '</button>' +
          '<button class="ghost sm" id="all">Select all</button>' +
          '<button class="plain" id="none">Clear</button>' +
        '</div>' + legendHtml(key);
    }
    if (held.length){
      body += '<div class="grouplabel">On hold &mdash; not in today\'s email</div><div class="rows">' +
        held.map(heldRow).join('') + '</div>' +
        '<div class="note">Offences keep accruing while a hold is on. Only the follow-up stops.</div>';
    }
  } else {
    body = '<div class="note q"><b>The detention screen is not built yet.</b> ' +
      'This area owes <b>' + toSchedule(key).n + '</b> detention session' +
      (toSchedule(key).n===1?'':'s') + ' according to 🪜 Ladders. Scheduling, the notice and ' +
      'attendance are the next slice.</div>';
  }

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="appbar"><a data-go="menu">&larr; All areas</a><span>&middot;</span>' +
      '<span>Signed in as ' + esc(S.user) + '</span></div>' +
    '<div class="date">' + esc(a.title) + ' ' + builtHtml() + '</div>' +
    '<div class="tabs"><a class="' + (S.tab==='follow'?'on':'') + '" data-tab="follow">Follow-up</a>' +
      '<a class="' + (S.tab==='det'?'on':'') + '" data-tab="det">Detention</a></div>' +
    body +
  '</div></div>';
}

function lcRow(x, i){
  var n = i + 1;
  if (isStamped(x)){
    var st = S.stamped[x.entryId];
    return '<div class="row done flat"><div class="badge">' + n + '</div>' +
      '<div class="body"><div class="p">' + esc(x.name) + '</div>' +
      '<div class="meta">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) + '</div>' +
      '<div class="s">CT emailed today by ' + esc(st.by) +
        ' &mdash; drops off this list at the next rebuild</div></div>' +
      statHtml(x) + '<div class="tierslot"><span class="tag ok">Done</span></div>' +
      goHtml(x) + '</div>';
  }
  var cls = sevClass(x.tier);
  var thu = (x.domain === 'Thursday privilege');
  return '<div class="row ' + cls + (S.sel[x.entryId]?' sel':'') + '" data-pick="' + esc(x.entryId) + '">' +
    '<div class="badge">' + (S.sel[x.entryId] ? '&#10003;' : n) + '</div>' +
    '<div class="body"><div class="p">' + esc(x.name) + '</div>' +
    '<div class="meta">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) +
      (thu ? ' <span class="tag thu">Thursday privilege</span>' : '') + '</div>' +
    '<div class="s">' + (thu
        ? esc(x.term) + ' separate Thursdays &mdash; latest <b>' + esc(longish(x.last)) + '</b>'
        : ordinal(x.term) + ' latecoming offence on <b>' + esc(longish(x.last)) + '</b>') +
      '</div></div>' +
    statHtml(x) +
    '<div class="tierslot"><span class="tag ' + (thu ? 'quiet' : cls) + '">' +
      /* A one-rung ladder has no tiers to compare, so a "Tier 1" beside a
         count of 3 Thursdays reads as a contradiction. Name the thing. */
      (thu ? 'Privilege removal' : 'Tier ' + x.tier) + '</span>' +
      '<div class="d">' + esc(x.action) + '</div></div>' +
    goHtml(x) + '</div>';
}

/* THE WAY INTO THE STUDENT. A word sitting inside every row was noise on a
   list you read forty times a morning, so it is a chevron at the edge that
   grows its label on hover.

   It is NOT hover-only. The chevron is always there and always clickable —
   a route that only exists once you happen to point at it does not exist on
   a touchscreen, and this is the only way to reach the student page. Hover
   reveals the WORD, not the target. */
function goHtml(x){
  return '<div class="rowgo opn" data-open="' + esc(x.entryId) + '" title="Open ' + esc(x.name) + '">' +
    '<span class="lbl">Open</span><span class="chev">&rarr;</span></div>';
}

function heldRow(x){
  return '<div class="row flat"><div class="badge">&#9208;</div>' +
    '<div class="body"><div class="p">' + esc(x.name) + '</div>' +
    '<div class="meta">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) + '</div>' +
    '<div class="s">On hold since ' + esc(x.heldOn) + ' by ' + esc(x.heldBy) +
      (x.heldWhy ? ' &mdash; ' + esc(x.heldWhy) : '') +
      '</div></div>' +
    statHtml(x) + '<div class="tierslot"><span class="tag quiet">On hold</span></div>' +
    goHtml(x) + '</div>';
}

function statHtml(x){
  return '<div class="stats">' +
    '<div class="stat"><div class="k">This term</div><div class="v">' + x.term + '</div></div>' +
    '<div class="stat"><div class="k">This year</div><div class="v">' + x.year + '</div></div></div>';
}

/* The ladder, as it reads today, straight from 🪜 Ladders. */
function laddersFor(domain){
  return ((S.snap && S.snap.ladders) || []).filter(function(l){
    return String(l.ladder || l.domain || '').trim() === domain;
  }).sort(function(a,b){ return (Number(a.tier)||0) - (Number(b.tier)||0); });
}
function legendHtml(key){
  var L = laddersFor('Latecoming');
  if (!L.length) return '';
  return '<div class="legend"><div class="lt">What each tier means &mdash; as 🪜 Ladders reads today</div>' +
    L.map(function(l){
      var t = Number(l.tier)||0;
      return '<div class="li"><b class="' + sevClass(t) + '">Tier ' + t + '</b>' +
        '<span>' + esc(l.action || '') + '</span></div>';
    }).join('') + '</div>';
}

/* ── one student ──────────────────────────────────────────────────────── */
/* Opened from any row in a worklist. It exists because the list can only ever
   say WHAT the count is, and the question somebody actually has at the point
   of following up is WHY — which dates, was one of them already excused, and
   is there a reason not to count one of them at all. */
function openStudent(entryId){
  var x = null;
  allRows().forEach(function(r){ if (r.entryId === entryId) x = r; });
  if (!x) return;
  /* THE ROW YOU CLICKED IS NOT THE STUDENT. A student can sit on more than one
     ladder at once, and each ladder counts a DIFFERENT THING — 9 lates this
     term and 3 distinct Thursdays are the same person, correctly, and taking
     the headline figure from whichever row happened to be clicked made the
     student page contradict the list it was opened from. */
  S.student = x; S.history = null; S.hErr = ''; S.ask = null;
  /* Set BEFORE the screen is drawn. Otherwise the first paint has no history
     and no reason given for not having one, and a slow read looks like a
     broken page rather than a page that is working. */
  S.hLoading = true;
  go('student');
  loadHistory(x.id);
}

/* Every snapshot row for this student, worst ladder first. */
function laddersOfStudent(){
  if (!S.student) return [];
  return allRows().filter(function(r){ return r.id === S.student.id; })
    .sort(function(a,b){ return (b.tier - a.tier) || String(a.domain).localeCompare(String(b.domain)); });
}

function loadHistory(id){
  S.hLoading = true;
  api('hubHistory', { token: TOKEN, studentId: id }).then(function(res){
    S.hLoading = false;
    if (!res || !res.ok){ S.hErr = (res && res.error) || 'The history could not be read.'; render(); return; }
    S.history = res; render();
  }).catch(function(){
    S.hLoading = false; S.hErr = 'Could not reach the server.'; render();
  });
}

/* Which statuses count towards a ladder, read from ⚙️ Statuses via
   hubSnapshot rather than assumed here. A(MC) is recorded and does not count;
   so is an Awards or Official early release. Putting them in one undifferentiated
   list of "offences" was wrong twice over — it implied the school held them
   against the student, and it made the totals impossible to trace. */
function statusMeta(code){
  var list = (S.snap && S.snap.statuses) || [];
  for (var i=0;i<list.length;i++){
    var c = String(list[i].code || list[i].status || '').trim();
    if (c && c === String(code||'').trim()) return list[i];
  }
  return null;
}
function statusCounts(code){
  var m = statusMeta(code);
  return m ? !!m.counts : true;      // unknown status: assume it counts, and say so
}
function statusLabel(code){
  var m = statusMeta(code);
  return (m && m.label) ? m.label : String(code||'');
}

function stateOf(r){ return S.local[r.entryId] || String(r.state || ''); }
function isLive(r){ return /counted/i.test(stateOf(r)); }

function heldNow(x){
  var k = x.id + '|' + x.domain;
  if (S.holdLocal[k]) return S.holdLocal[k] === 'Held';
  return isHeld(x);
}

/* EVERYTHING RECORDED IN THE ACADEMIC YEAR, GROUPED BY STATUS.
   One flat list mixed lates with medical certificates and made the totals
   untraceable: the header said 9 and the list below looked like 3. Each status
   now carries its own subtotal, broken down by term, so every figure on this
   screen can be followed to the rows it came from.

   A row whose date will not parse is kept and sorted last rather than dropped —
   hiding a real offence because a cell is malformed is the worse failure. */
var STATUS_ORDER = ['LATE', 'A(WOR)', 'A(VRP)', 'A(VRO)', 'A(PR)', 'A(MC)', 'ED'];
function statusRank(code){
  var i = STATUS_ORDER.indexOf(String(code||'').trim());
  return i < 0 ? STATUS_ORDER.length : i;
}

function groupedHistory(){
  var rows = (S.history && S.history.rows) || [];
  var by = {}, order = [];
  rows.forEach(function(r){
    var k = String(r.status || '—').trim();
    if (!by[k]){ by[k] = []; order.push(k); }
    by[k].push(r);
  });
  order.sort(function(a,b){ return statusRank(a) - statusRank(b) || a.localeCompare(b); });
  return order.map(function(k){
    var list = by[k];
    var terms = {}, year = 0, setAside = 0;
    list.forEach(function(r){
      var live = /counted/i.test(stateOf(r));
      if (!live){ setAside++; return; }
      var n = Number(r.counts) || 0;
      year += n;
      var t = (r.term === '' || r.term === null || r.term === undefined) ? '?' : String(r.term);
      terms[t] = (terms[t] || 0) + n;
    });
    return { code:k, rows:list, terms:terms, year:year, setAside:setAside, counts:statusCounts(k) };
  });
}

function timelineHtml(){
  if (S.hLoading){
    return '<div class="loading"><div class="spin"></div>' +
      '<div><b>Reading the whole academic year&hellip;</b>' +
      '<span>Every offence, every term, including the ones that stopped counting.</span></div></div>' +
      '<div class="skel"><i></i><i></i><i></i></div>';
  }
  if (S.hErr) return '<div class="note err">' + esc(S.hErr) + '</div>';
  if (!S.history) return '';
  var groups = groupedHistory();
  if (!groups.length) return '<div class="blank">Nothing recorded this academic year.</div>';

  return groups.map(function(g){
    var termBits = Object.keys(g.terms).sort().map(function(t){
      return '<span class="tsub">Term ' + esc(t) + ' <b>' + g.terms[t] + '</b></span>';
    }).join('');

    var head = '<div class="ghead"><div class="gh">' + esc(statusLabel(g.code)) +
      (statusLabel(g.code) !== g.code ? ' <small>' + esc(g.code) + '</small>' : '') + '</div>' +
      (g.counts
        ? '<div class="gsum">' + termBits + '<span class="tsub yr">This year <b>' + g.year + '</b></span></div>'
        : '<div class="gsum"><span class="tag quiet">recorded, does not count</span></div>') +
      (g.setAside ? '<div class="gaside">' + g.setAside + ' not counted &mdash; waived or overturned</div>' : '') +
    '</div>';

    /* TERMS ARE SEPARATED, NOT JUST SUBTOTALLED. The ladder is read against a
       term count, so which term a row falls in is the single most consequential
       thing about it after the date. */
    var body = '', lastTerm = null;
    g.rows.forEach(function(r){
      var t = (r.term === '' || r.term === null || r.term === undefined) ? '?' : String(r.term);
      if (t !== lastTerm){
        var n = g.terms[t];
        body += '<div class="tdiv"><span>' + (t === '?' ? 'No term' : 'Term ' + esc(t)) + '</span>' +
          (g.counts && n !== undefined ? '<b>' + n + '</b>' : '') + '</div>';
        lastTerm = t;
      }
      body += rowLineHtml(r);
    });
    return head + '<div class="tl">' + body + '</div>';
  }).join('');
}

function rowLineHtml(r){
  var st = stateOf(r);
  var live = /counted/i.test(st);
  var bad  = !/^\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/.test(String(r.date||''));
  var counts = statusCounts(r.status);

  var tags = '';
  if (Number(r.counts) === 2) tags += '<span class="tag t4">counts twice</span> ';
  if (!live) tags += '<span class="tag quiet">' + esc(st || 'not counted') + '</span> ';
  if (r.followedUp) tags += '<span class="tag ok">followed up</span> ';
  if (bad) tags += '<span class="tag t5">date unreadable</span> ';

  var why = '';
  if (!live && (r.stateChangedBy || r.stateReason)){
    why = '<div class="tlwhy">' + esc(r.stateChangedBy || '') +
          (r.stateReason ? ' &mdash; ' + esc(r.stateReason) : '') + '</div>';
  } else if (r.followedUp){
    why = '<div class="tlwhy">' + esc(r.followedUp) +
          (r.followedUpBy ? ' by ' + esc(r.followedUpBy) : '') +
          (r.actionTaken ? ' &mdash; ' + esc(r.actionTaken) : '') + '</div>';
  }

  /* THE REMARKS COLUMN IS THE WHOLE POINT OF THIS SCREEN. Cockpit's remarks
     are where "Bus was late" and "Parent called, unwell" actually live — the
     evidence somebody needs in front of them to decide whether to excuse an
     offence. Carrying the row without carrying its remark would mean deciding
     blind, and it is the reason the old sheet had reasons jammed into a
     column headed "Remarks CT emailed on". */
  var rem = String(r.remarks || '').trim();

  return '<div class="tlrow' + (live ? '' : ' off') + '">' +
    '<div class="tld">' + esc(r.date || '—') + '<span>' + esc(r.time || '') + '</span></div>' +
    '<div class="tlb">' +
      (r.reason ? '<b>' + esc(r.reason) + '</b> ' : '') +
      (r.source ? '<small>' + esc(r.source) + '</small> ' : '') +
      tags +
      (rem ? '<div class="rem">' + esc(rem) + '</div>' : '') +
      why + '</div>' +
    '<div class="tla">' + (live && counts
      ? '<button class="plain" data-excuse="' + esc(r.entryId) + '">Excuse this one</button>'
      : '') + '</div></div>';
}

/* The ladder, with this student's tier bracketed. */
function ladderTableHtml(x){
  var L = laddersFor(x.domain);

  return '<div class="grouplabel">' + esc(x.domain) + ' &mdash; as 🪜 Ladders reads today</div>' +
    '<table class="bracket ladder"><tbody>' + L.map(function(l){

        '<td style="width:56px" class="n">' + esc(l.atCount !== undefined ? l.atCount : '') + '</td>' +
        '<td>' + esc(l.action || '') + '</td></tr>';
    }).join('') + '</tbody></table>';
}

function askHtml(){
  if (!S.ask) return '';
  var a = S.ask;
  if (a.kind === 'overturn'){
    /* The row being excused, restated with its remark, so the decision is made
       with the evidence on screen rather than from memory of a list. */
    var row = null;
    ((S.history && S.history.rows) || []).forEach(function(r){ if (r.entryId === a.entryId) row = r; });
    var ctx = row
      ? '<div class="askrow"><b>' + esc(row.date || '') + '</b> ' + esc(row.time || '') +
        ' &middot; ' + esc(statusLabel(row.status)) +

        (String(row.remarks || '').trim()

      : '';
    return '<div class="note q">' + ctx + '<b>Excuse this offence?</b> ' +

      'reconciliation observed, overturned is what a person decided. ' +

      '<div class="field"><label>Why &mdash; required</label>' +
        '<textarea id="reason" rows="2" placeholder="e.g. Bus breakdown along Upper Serangoon, confirmed by the CT."></textarea></div>' +
      '<div class="stack rowwise"><button id="doask"' + (S.busy?' disabled':'') + '>' +
        (S.busy?'Recording&hellip;':'Excuse it') + '</button>' +
        '<button class="plain" id="cancelask">Cancel</button></div>' +

  }

    return '<div class="note q"><b>Hold follow-up for ' + esc(S.student.domain) + '?</b> ' +
      'They come off this worklist until you release it. ' +
      '<b>Offences keep accruing while a hold is on</b> &mdash; only the following up stops, ' +
      'so what they come back to is the true figure. It holds this ladder only; ' +

      '<div class="field"><label>Why &mdash; required</label>' +
        '<textarea id="reason" rows="2" placeholder="e.g. Family bereavement. DM aware, revisit after the September break."></textarea></div>' +
      '<div class="stack rowwise"><button id="doask"' + (S.busy?' disabled':'') + '>' +
        (S.busy?'Recording&hellip;':'Put the follow-up on hold') + '</button>' +
        '<button class="plain" id="cancelask">Cancel</button></div>' +
      (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') + '</div>';
  }
  return '<div class="note q"><b>Release the hold on ' + esc(S.student.domain) + '?</b> ' +
    'They return to the worklist at whatever tier they have reached in the meantime. ' +
    'The hold row is kept, closed, with your name on it.' +
    '<div class="stack rowwise"><button id="doask"' + (S.busy?' disabled':'') + '>' +
      (S.busy?'Recording&hellip;':'Release it') + '</button>' +
      '<button class="plain" id="cancelask">Cancel</button></div>' +
    (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') + '</div>';
}

function studentHtml(){
  var x = S.student;
  var mine = laddersOfStudent();
  var over = Object.keys(S.local).length;

  /* WHERE THEY STAND — every ladder they are on, not just the one clicked.
     Each counts a different thing, and the row you arrived from is bracketed
     so the figures on the list you came from are findable here. */
  /* WHERE THEY STAND — one card per ladder. A table forced four numbers of
     four different kinds into aligned columns and made the wrapping action

  var stand = '<div class="grouplabel">Where they stand &mdash; from the snapshot</div>' +
    '<div class="lgrid">' + mine.map(function(r){
      var here = (r.entryId === x.entryId);
      var thu  = (r.domain === 'Thursday privilege');
      return '<div class="lcard ' + sevClass(r.tier) + (here?' here':'') + '">' +
        '<div class="lctop">' +
          '<div class="lcname">' + esc(r.domain) +
            (thu ? '<em>counts distinct Thursdays, not lates</em>' : '') + '</div>' +
          (thu ? '<span class="tag quiet">Privilege removal</span>'
               : '<span class="tag ' + sevClass(r.tier) + '">Tier ' + r.tier + '</span>') +
        '</div>' +
        '<div class="lcnums">' +
          '<div><b>' + r.term + '</b><span>this term</span></div>' +
          '<div><b>' + r.year + '</b><span>this year</span></div>' +
          (r.sessions ? '<div><b>' + r.sessions + '</b><span>detention' +
             (r.sessions===1?'':'s') + ' owed</span></div>' : '') +
        '</div>' +
        '<div class="lcact">' + esc(r.action) + '</div>' +
        (heldNow(r) ? '<div class="lchold">⏸ follow-up on hold</div>' : '') +
      '</div>';
    }).join('') + '</div>' +
    (mine.length > 1
      ? '<div class="note"><b>' + esc(x.name) + ' is on ' + mine.length + ' ladders at once.</b> ' +
        'They count different things, so the numbers are meant to disagree &mdash; ' +
        'a double late adds two to a latecoming total and one to the Thursday counter.</div>'
      : '');

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="appbar"><a data-go="lc">&larr; ' + esc(areaOf(S.area).title) + '</a>' +
      '<span>&middot;</span><a data-go="menu">All areas</a></div>' +
    '<h1>' + esc(x.name) + '</h1>' +
    '<div class="who">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) +
      ' &middot; opened from ' + esc(x.domain) +
      (heldNow(x) ? ' &middot; <b>follow-up on hold</b>' : '') + '</div>' +

    stand +

    (over ? '<div class="note warn"><b>' + over + ' offence' + (over===1?'':'s') +
