}

/* ── the Detention Sessions area ──────────────────────────────────────── */
function detHtml(){
  if (!detOk()){
    return '<div class="screen centre"><div class="wrap">' +
      '<div class="appbar"><a data-go="menu">&larr; All areas</a></div>' +
      '<h1 class="big">🪑 Detention could not be read.</h1>' +
      '<div class="lede">' + esc((S.det && S.det.error) || 'The tab did not come back with the sign-in.') +
      ' An unreadable record and an empty one look identical and mean opposite things, so this ' +
      'screen will not guess which it is.</div>' +
      '<div class="stack"><button id="detretry">Try again</button>' +
      '<button class="plain" data-go="menu">All areas</button></div></div></div>';
  }

  var up = upcoming(), past = pastSessions(), late = overdue();
  var junk = undated();
  var toBook = owedBookings(null);
  var undecided = toBook.filter(function(o){ return o.undecided; });

  /* ONE UNIT, ONE ORDER, ONE JOURNEY.
     Rewritten 12 August 2026. This row read "5 sessions ahead · 10 sittings
     booked in · 89 overdue · 231 imported · 119 owed" — five figures in four
     different units, in no particular sequence, and Kim: "i am now struggling
     to understand the differences in all the nuances."

     Everything below is counted in SITTINGS, in the order a sitting travels:
     owed, then booked, then chased. Wednesdays became a subtitle, because a
     date is not a unit of work. The number of STUDENTS sits beside the number
     of sittings, because those answer different questions and both get asked.

     THE TERM SPLIT IS THE POINT. 119 as one figure reads as a crisis. Split
     into this term and everything before it, it reads as a small piece of work
     and a known backlog — which is what it is. The backlog exists because the
     system logged offences for three months before there was any way to book
     against them, while the old book was doing the booking the whole time. */
  var sitOf = function(l){ return l.reduce(function(n,o){ return n + o.left; }, 0); };
  var stuOf = function(l){ var s={}; l.forEach(function(o){ s[o.x.id]=1; }); return Object.keys(s).length; };

  var nowTerm = String((S.early && S.early.termNo) || '').trim();
  if (!nowTerm){
    /* No early-dismissal reply to ask, so take the highest term the snapshot
       carries. A wrong guess splits the pile in the wrong place; it never
       changes the total, and the total is the figure that must be right. */
    var mx = 0;
    toBook.forEach(function(o){ var t = Number(o.x.termNo) || 0; if (t > mx) mx = t; });
    nowTerm = mx ? String(mx) : '';
  }
  var tNow = toBook.filter(function(o){ return String(o.x.termNo).trim() === nowTerm; });
  var tOld = toBook.filter(function(o){ return String(o.x.termNo).trim() !== nowTerm; });

  /* DISTINCT STUDENTS BOOKED AHEAD, not sittings — a student with two
     Wednesdays is one person to expect and two chairs to fill. */
  var aheadStu = (function(){
    var t = midnight(), s = {};
    detRows().forEach(function(d){
      var w = dparse(effDate(d));
      if (w && w >= t) s[d.sid] = 1;
    });
    return Object.keys(s).length;
  })();

  var nOf = function(n, one, many){ return n + ' ' + (n === 1 ? one : many); };

  var kpi =
    '<div class="kpi">' +
      '<div><b>' + sitOf(toBook) + '</b><span>sittings to book</span>' +
        '<em>' + nOf(sitOf(tNow), 'sitting', 'sittings') + ' this term &middot; ' +
                 nOf(stuOf(tNow), 'student', 'students') + '<br>' +
                 nOf(sitOf(tOld), 'sitting', 'sittings') + ' earlier &middot; ' +
                 nOf(stuOf(tOld), 'student', 'students') + '</em></div>' +
      '<div><b>' + bookedAhead() + '</b><span>sittings booked</span>' +
        '<em>' + nOf(aheadStu, 'student', 'students') + ' across ' +
                 nOf(up.length, 'Wednesday', 'Wednesdays') + '</em></div>' +
      '<div><b>' + late.length + '</b><span>to chase</span>' +
        '<em>' + (late.length ? 'booked, the date passed,<br>nobody marked Attended'
                              : 'nothing was missed') + '</em></div>' +
    '</div>' +
    (historic().length
      ? '<div class="note quiet"><b>' + historic().length + ' sittings imported from the old book.</b> ' +
        'History &mdash; shown on a student\'s record, never counted above and never chased.</div>'
      : '');

  var body = '';
  if (S.dtab === 'past'){
    body = past.length
      ? past.slice().reverse().map(sessionCard).join('')
      : '<div class="blank">No session date in 🪑 Detention has passed yet.</div>';
  } else if (S.dtab === 'owed'){
    body = late.length
      ? '<div class="note warn"><b>These sittings are still owed.</b> The date has passed &mdash; ' +
        'the date it was MOVED to, where one was set &mdash; and nobody marked them Attended. ' +
        'That is derived from the attendance column, not stored, so it carries across a term and ' +
        'across a year without anybody maintaining it: the twenty students carried from 2025 in ' +
        'the old book are exactly this shape.</div>' +
        '<div class="rows">' + late.map(function(d){ return detRowHtml(d, ''); }).join('') + '</div>'
      : '<div class="blank">Nothing is overdue. Every sitting whose date has passed was marked.</div>';
    /* AN UNREADABLE DATE IS NOT AN OVERDUE ONE, AND IT IS NOT NOTHING. These
       rows cannot be placed on the calendar, so they are neither upcoming nor
       past — and dropping them would mean the import quietly lost sittings.
       The old workbook's date column is free text, so this is the expected
       landing place for a real part of it. */
    if (junk.length){
      body += '<div class="grouplabel">Dates that could not be read</div>' +
        '<div class="note warn">' + junk.length + ' row' + (junk.length===1?'':'s') +
        ' carr' + (junk.length===1?'ies':'y') + ' a session date nothing can parse &mdash; almost ' +
        'always an imported line. <b>They are not counted as upcoming or as overdue</b>, because ' +
        'an unreadable date is not evidence of either. Fix the date in 🪑 Detention and they join ' +
        'the rest.</div>' +
        '<div class="rows">' + junk.map(function(d){ return detRowHtml(d, ''); }).join('') + '</div>';
    }
  } else if (S.dtab === 'next'){
    body = up.length
      ? up.map(sessionCard).join('')
      : '<div class="blank">Nothing is booked yet. Go to <b>To book</b> and put somebody ' +
        'into a Wednesday.</div>';
  } else {
    var bookable = toBook.filter(function(o){ return !o.undecided; });
    if (!bookable.length && !undecided.length){
      body = '<div class="blank">Nobody is owed a sitting that has not been booked.</div>';
    }
    if (bookable.length){
      /* THE WEDNESDAYS ON OFFER. Only dates that already have a room, plus the
         next few, because inventing a date nobody has agreed to run is how a
         detention gets booked into a week with no duty teacher. */
      var opts = nextWednesdays(6).map(function(w){
        return '<option value="' + esc(w) + '"' + (S.pickDate===w?' selected':'') + '>' +
               esc(longish(w)) + '</option>';
      }).join('');
      var n = pickedKeys().length;
      body += '<div class="pickbar' + (n ? ' on' : '') + '">' +
          '<div class="pickn">' + (n ? n + ' selected' : 'Tick students to book') + '</div>' +
          '<select id="pickdate">' + opts + '</select>' +
          '<button class="sm" id="pickgo"' + (n ? '' : ' disabled') + '>' +
            'Book ' + (n || '') + ' into this Wednesday</button>' +
          (n ? '<button class="plain sm" id="pickclear">Clear</button>' : '') +
        '</div>' +
        '<div class="grouplabel">Owed but not yet booked</div>' +
        '<div class="rows">' + bookable.map(function(o){
          var key = rowKey(o.x);
          return '<div class="row ' + sevClass(o.x.tier) + (S.pick[key] ? ' picked' : '') +
              '" data-book="' + esc(key) + '">' +
            tickHtml(key) +
            '<div class="body"><div class="p">' + esc(o.x.name) + '</div>' +
            '<div class="meta">' + esc(o.x.cls) + ' &middot; ' + esc(o.x.area) +
              (homeless(o.x) ? ' <span class="tag thu">no cohort &mdash; only visible here</span>' : '') +
            '</div>' +
            '<div class="s">' + lineFor(o.x) + '</div></div>' +
            '<div class="stats"><div class="stat"><div class="k">To book</div>' +
              '<div class="v">' + o.left + '</div></div></div>' +
            '<div class="tierslot"><span class="tag ' + sevClass(o.x.tier) + '">Tier ' + o.x.tier + '</span></div>' +
            '<div class="rowgo opn" title="Book ' + esc(o.x.name) + '">' +
              '<span class="lbl">Book</span><span class="chev">&rarr;</span></div>' +
          '</div>';
        }).join('') + '</div>';
    }
    /* A TIER WHOSE SESSION COUNT NOBODY HAS SET. Not bookable, because the
       answer is not "zero" — it is "nobody has written one down". 🪜 Ladders
       is the rulebook and a blank cell there is a question, not a policy. */
    if (undecided.length){
      body += '<div class="grouplabel">No session count set on the ladder</div>' +
        '<div class="note warn"><b>These tiers have an empty <i>Detention sessions</i> cell in ' +
        '🪜 Ladders.</b> Blank is not zero &mdash; zero is a decision that this tier owes no ' +
        'detention, blank means nobody has written one down. They are not offered for booking, ' +
        'and they will keep appearing here until somebody types a number, including a 0.</div>' +
        '<div class="rows">' + undecided.map(function(o){
          return '<div class="row flat"><div class="badge">?</div>' +
            '<div class="body"><div class="p">' + esc(o.x.name) + '</div>' +
            '<div class="meta">' + esc(o.x.cls) + ' &middot; ' + esc(o.x.area) + '</div>' +
            '<div class="s">' + esc(o.x.domain) + ' tier ' + o.x.tier + ' &mdash; ' + esc(o.x.action) + '</div></div>' +
            '<div class="tierslot"><span class="tag quiet">Not set</span></div></div>';
        }).join('') + '</div>';
    }
  }

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="appbar"><a data-go="menu">&larr; All areas</a><span>&middot;</span>' +
      '<span>Signed in as ' + esc(S.user) + '</span><span>&middot;</span>' +
      /* THE SPREADSHEET IS EDITED BY OTHER PEOPLE AND BY A TIMED TRIGGER, so
         what this screen is holding quietly ages. Until now the only way to
         see a change was to sign out and back in. */
      '<a id="refreshall">' + (S.busy ? 'Reloading…' : '↻ Reload') + '</a>' +
      (S.flash ? '<span>&middot;</span><span class="flash">' + esc(S.flash) + '</span>' : '') +
      /* OFFERED ONLY WHILE IT IS STILL THE THING THAT JUST HAPPENED. Cleared
         by a reload, by leaving the screen, and by signing out. */
      (S.lastBook && S.lastBook.ids.length && !S.busy
        ? '<span>&middot;</span><a id="unbookbatch" style="cursor:pointer;text-decoration:underline">' +
          'Undo &mdash; take those ' + S.lastBook.n + ' back</a>'
        : '') +
      '</div>' +
    (S.err ? '<div class="note warn">' + esc(S.err) + '</div>' : '') +
    '<div class="date">Detention Sessions ' + builtHtml() + '</div>' +
    '<h1>Detention Sessions</h1>' +
    /* PLAIN. The first version explained the data model — "a session is not a
       record somebody owns, it is every row sharing a date" — which is true,
       is the reason the code is shaped the way it is, and is of no use to
       somebody who opened this screen to find out who needs booking. It lives
       in the comments and on the 🪑 Detention tab note, where the people who
       need it will be. Kim, 12 August 2026: "the description is so
       unnecessary." */
    '<div class="lede">Keep track of detention sessions &mdash; who is booked into each afternoon, ' +
      'who still needs scheduling, and who has not served what they owe.</div>' +
    kpi +
    /* THE TABS CARRY THE NUMBERS THAT ARE ABOVE THEM. Until 12 August 2026 the
       row read "sittings to book · sittings booked · to chase" and the tabs
       read "Coming up · Sessions held · Still owed" — the same three things
       under two different names, in a different order, so every glance needed a
       translation step. The tab you click is now the figure you just read. */
    '<div class="tabs">' +
      '<a class="' + (S.dtab==='book'?'on':'') + '" data-dtab="book">To book' +
        (toBook.length ? ' <b>' + sitOf(toBook) + '</b>' : '') + '</a>' +
      '<a class="' + (S.dtab==='next'?'on':'') + '" data-dtab="next">Coming up' +
        (bookedAhead() ? ' <b>' + bookedAhead() + '</b>' : '') + '</a>' +
      '<a class="' + (S.dtab==='past'?'on':'') + '" data-dtab="past">Held</a>' +
      '<a class="' + (S.dtab==='owed'?'on':'') + '" data-dtab="owed">To chase' +
        (late.length ? ' (' + late.length + ')' : '') + '</a>' +
    '</div>' + body +
  '</div></div>';
}

function sessionCard(s){
  var byArea = {};
  s.room.forEach(function(d){ byArea[d.area] = (byArea[d.area]||0) + 1; });
  var areas = Object.keys(byArea).sort().map(function(a){
    return '<span class="tchip">' + esc(a) + ' <b>' + byArea[a] + '</b></span>';
  }).join('');
  var unmarked = s.room.filter(function(d){ return !d.att; }).length;
  var slotNames = Object.keys(s.slots);
  return '<div class="lcard' + (unmarked ? ' t3' : '') + '" style="margin-bottom:10px">' +
    '<div class="lctop"><div class="lcname">' + esc(longish(s.date)) + '</div>' +
      '<span class="tag ' + (unmarked ? 't3' : 'ok') + '">' +
        (unmarked ? unmarked + ' not marked' : 'All marked') + '</span></div>' +
    '<div class="s" style="margin-top:6px">' + s.room.length + ' student' + (s.room.length===1?'':'s') +
      (areas ? ' &mdash; ' + areas : '') + '</div>' +
    /* THE SESSION DATE IS THE JOIN KEY, by design, so two sittings on one date
       are one room. That is right for 2026, where a single slot runs — but the
       retired 1.30–3.30pm slot ran CONCURRENTLY with 3.30–5.30pm before it, so
       an imported date can hold two genuinely separate sittings. Grouped, and
       said out loud, rather than silently merged. */
    (slotNames.length > 1
      ? '<div class="s" style="margin-top:4px"><b>Two slots on this date:</b> ' +
        esc(slotNames.map(function(n){ return n + ' (' + s.slots[n] + ')'; }).join(' · ')) +
        ' &mdash; the 1.30pm slot is retired, so these are historical.</div>'
      : '') +
    /* THE ACTION THE DATE ACTUALLY ALLOWS. A Wednesday still ahead is a room
       to fill; one that has been and gone is a register to mark. Offering both
       on both made the card read as a menu rather than a next step. */
    '<div class="stack rowwise" style="margin-top:14px">' +
      (s.when && s.when > midnight()
        ? '<button class="ghost sm" data-dtab="book">Book students in</button>' +
          '<button class="plain sm" data-sess="' + esc(s.date) + '">Open the session</button>'
        : '<button class="ghost sm" data-sess="' + esc(s.date) + '">' +
          (unmarked ? 'Take attendance' : 'Open the session') + '</button>') +
    '</div>' +
  '</div>';
}

/* ── one session, and taking attendance ───────────────────────────────── */
function sessHtml(){
  var date = S.sess;
  var room = roomFor(date);
  if (!room.length) return detHtml();
  var when = dparse(date);
  var future = when && when > midnight();

  var rows = room.map(function(d){
    var draft = draftFor(d);
    var needsDate = draft.att && draft.att !== ATT_OK;
    var dirty = (draft.att !== (d.att||'')) || (draft.moved !== (d.moved||''));
    var opts = (S.det.attendanceOptions || [ATT_OK]).map(function(o){
      return '<option value="' + esc(o) + '"' + (draft.att===o?' selected':'') + '>' + esc(o) + '</option>';
    }).join('');
    return '<div class="row flat" style="align-items:flex-start">' +
      '<div class="badge">' + (d.att === ATT_OK ? '&#10003;' : '&#9679;') + '</div>' +
      '<div class="body"><div class="p">' + esc(d.name) + '</div>' +
      '<div class="meta">' + esc(d.cls) + ' &middot; ' + esc(d.area) +
        (d.of ? ' &middot; session ' + d.n + ' of ' + d.of : '') +
        (movedInto(d, date) ? ' <span class="tag thu">moved from ' + esc(d.date) + '</span>' : '') +
      '</div>' +
      '<div class="s">' + esc(d.ladder) + (d.tier ? ' tier ' + esc(d.tier) : '') +
        ' &middot; issued by ' + esc(d.by || 'somebody') + '</div>' +
      '<div class="field" style="margin-top:12px;max-width:100%">' +
        '<label>Attendance</label>' +
        '<select data-att="' + esc(d.did) + '" style="font:inherit;font-size:16px;padding:8px 10px;' +
          'border:1.5px solid var(--line);border-radius:9px;background:var(--raised);color:var(--ink)">' +
          '<option value=""' + (draft.att?'':' selected') + '>&mdash; not marked &mdash;</option>' +
          opts + '</select>' +
        (needsDate
          ? '<div style="margin-top:10px"><label>Move it to</label>' +
            '<input type="text" data-moved="' + esc(d.did) + '" value="' + esc(draft.moved) + '" ' +
            'placeholder="e.g. ' + esc(dstamp(nextWeds(2)[1])) + '" ' +
            'style="font-size:16px;border-bottom:2px solid var(--line)"></div>' +
            '<div class="s" style="margin-top:6px">Only <b>Attended</b> closes a session. ' +
            'Everything else leaves it owed, and needs a date to move it to &mdash; otherwise it ' +
            'would quietly stop being owed at all.</div>'
          : '') +
      '</div>' +
      '</div>' +
      /* THE SAVE CONTROL IS ALWAYS RENDERED, disabled until something has
         actually changed. It used to appear only when `dirty`, computed at
         render time — and the reschedule-date field deliberately does not
         re-render on every keystroke, so a row whose ONLY change was the date
         never grew a button to save it. */
      '<div class="tierslot">' +
        '<button class="ghost sm" data-save="' + esc(d.did) + '"' +
          ((dirty && !S.busy) ? '' : ' disabled') + '>' +
          (S.busy ? 'Saving&hellip;' : 'Save this one') + '</button>' +
        (d.att
          ? '<div class="d"><span class="tag ' + (d.att===ATT_OK?'ok':'t4') + '">' + esc(d.att) + '</span>' +
            ' <a data-clear="' + esc(d.did) + '" style="cursor:pointer;text-decoration:underline">clear</a></div>'
          /* REMOVE IS OFFERED ONLY ON AN UNMARKED ROW, and the server enforces
             the same rule rather than trusting this. A marked row is a record
             of something that happened; clearing the mark first is a
             deliberate second act, which is the point.

             ASKED TWICE, WITHOUT A DIALOG. The link arms itself and the second
             click does it — a delete a thumb can reach on a phone must not be
             one a thumb can reach by accident. */
          : '<div class="d"><span class="tag quiet">Not marked</span>' +
            (S.armUnbook === d.did
              ? ' &middot; <a data-unbookgo="' + esc(d.did) + '" style="cursor:pointer;' +
                'text-decoration:underline;color:var(--bad)"><b>Really remove?</b></a>' +
                ' &middot; <a data-unbookno="1" style="cursor:pointer;text-decoration:underline">keep</a>' +
                /* THE FORK, NAMED AT THE MOMENT SOMEBODY IS ABOUT TO TAKE THE
                   WRONG ONE. Remove is the easiest-looking control on this
                   screen, so without this it becomes how people excuse a
                   student — and an excuse recorded as a deleted booking has no
                   reason attached to it and no state. Overturning the offence
                   already refuses without a reason; this points at it. */
                '<div class="s" style="margin-top:8px;max-width:320px">' +
                  'This only un-books the afternoon. ' + esc(String(d.name || '').split(' ')[0] || 'She') +
                  ' still owes the sitting and it will come back on <b>To book</b>. ' +
                  'If she should not have to serve it at all, <b>overturn the offence</b> ' +
                  'on her page instead &mdash; that asks for a reason and records it.' +
                '</div>'
              : ' &middot; <a data-unbook="' + esc(d.did) + '" style="cursor:pointer;' +
                'text-decoration:underline">remove</a>') +
            '</div>') +
      '</div>' +
    '</div>';
  }).join('');

  /* THE ROOM LIST ON PAPER. The person on duty in C201 may not be the person
     who booked it, may not have the Hub open, and may not have a device at
     all — this system already accepts that fifty-eight form teachers check
     grooming off a printed namelist, and a detention room is no different.
     Everything but the register is hidden by the print stylesheet, so the
     button produces a page somebody can carry, not a screenshot of an app. */
  var printBar =
    '<div class="stack rowwise noprint" style="margin:2px 0 18px">' +
      '<button class="plain sm" onclick="window.print()">🖨 Print the room list</button>' +
    '</div>';

  return '<div class="screen' + (S.first?'':' still') + ' printable"><div class="wrap wide">' +
    '<div class="printhead">' + esc(longish(date)) +
      ' &mdash; ' + esc((S.snap && S.snap.config && S.snap.config.detentionRoom) || '') +
      ' &mdash; ' + room.length + ' student' + (room.length===1?'':'s') + '</div>' +
    '<div class="appbar noprint"><a data-go="det">&larr; Detention Sessions</a><span>&middot;</span>' +
      '<span>Signed in as ' + esc(S.user) + '</span></div>' +
    '<div class="date">' + esc(room[0].slot || 'Detention') + '</div>' +
    '<h1 class="noprint">' + esc(longish(date)) + '</h1>' + printBar +
    '<div class="who">' + room.length + ' student' + (room.length===1?'':'s') +
      ' &middot; ' + room.filter(isOwed).length + ' still owed</div>' +
    (future
      ? '<div class="note q"><b>This session has not happened yet.</b> You can mark it, but ' +
        'a room marked in advance is a room nobody checked.</div>'
      : '') +
    '<div class="rows">' + rows + '</div>' +
    (S.err ? '<div class="note err">' + S.err + '</div>' : '') +
    /* A WRITE THAT LANDED AND A RE-READ THAT DID NOT. This was rendered on the
       booking confirmation and nowhere else, so on this screen a successful
       save whose follow-up read failed showed the PRE-SAVE value with no
       explanation and no retry — and since the re-read now gets three
       attempts, reaching that state means a genuinely bad connection, which
       is exactly when somebody will hit it. */
    (S.derr ? '<div class="note warn"><b>The save landed &mdash; this list may be a moment behind.</b> ' +
              S.derr + ' <b>Do not simply save it again</b> without looking; ' +
              'reopen the session first.</div>' : '') +
    '<div class="note"><b>Each row saves on its own.</b> Attendance is written one student at a ' +
    'time, and a save that fails leaves the others exactly as they were. Nothing here is ' +
    'retried &mdash; if a reply goes missing, reopen the session and look before saving again.</div>' +
  '</div></div>';
}

/* THE ONE PLACE A DRAFT IS SEEDED. There were two, and they disagreed: the
   render seeded from the sheet's value, the date-field handler seeded from an
   empty string. So correcting a reschedule date and then touching any other
   row in the room — the normal thing to do in a room of eight — left the first
   row displaying "not marked" for a student the sheet recorded as Absent, with
   the date field gone. Whoever then cleared the unmarked rows would pick
   something, and picking Attended closes a sitting that is still owed AND
   wipes its reschedule date. */
function draftFor(d){
  if (!S.attDraft[d.did]) S.attDraft[d.did] = { att: d.att || '', moved: d.moved || '' };
  return S.attDraft[d.did];
}

function saveAttendance(did){
  var d = null;
  detRows().forEach(function(r){ if (r.did === did) d = r; });
  if (!d) return;
  var draft = S.attDraft[did] || { att:'', moved:'' };
  if (!draft.att){ S.err = 'Choose an attendance value first, or use <b>clear</b>.'; render(); return; }
  var moved = '';
  if (draft.att !== ATT_OK){
    var raw = String(draft.moved||'').trim();
    if (!raw){
      S.err = 'Only <b>Attended</b> closes a session. Anything else needs a date to move it to, ' +
              'or the sitting would quietly stop being owed.';
      render(); return;
    }
    /* NORMALISED BEFORE IT IS SENT, NEVER STORED AS TYPED. The session date is
       the join key — a session is every row sharing that string — so "26 Aug"
       would have created a phantom room by that name, permanently disjoint
       from the real 26 August one and rendered with a different label. */
    moved = canonDate(raw);
    if (!moved){
      S.err = 'That date could not be read. Type it as <b>' + esc(dstamp(nextWeds(2)[1])) +
              '</b> &mdash; the session date is what joins a room together, so it has to be ' +
              'exact. Nothing was saved.';
      render(); return;
    }
  }
  S.busy = true; S.err = ''; render();

  /* NO RETRY. hubAttendance is a write, and it is absent from RETRY_SAFE for
     the same reason every other write is. */
  api('hubAttendance', {
    token: TOKEN, detentionId: did,
    attendance: draft.att,
    rescheduledTo: moved
  }).then(function(res){
    S.busy = false;
    if (!res || !res.ok){ S.err = esc((res && res.error) || 'Nothing was saved.'); render(); return; }
    delete S.attDraft[did];
    refreshDet().then(function(){ render(); });
  }).catch(function(e){
    S.busy = false;
    S.err = reachErr(e, 'save the attendance');
    render();
  });
}

/* THE ONLY RE-READ IN THIS FILE. hubDetention went back into RETRY_SAFE for
   it — it is a read, it changes nothing, and giving up after one attempt on a
   fault that is known to be collision would leave the screen showing a room
   that no longer matches the sheet. */
/* CLEARING A MISKEYED OUTCOME. Without this a wrong value could be changed to
   another wrong value but never removed — client and server both refused the
   empty string, so the only escape from a mistaken "Absent" was to mark it
   Attended, which closes a sitting that is still owed. That is precisely the
   defect the old workbook has, where a waived detention was typed into the
   attendance column and is now indistinguishable from a real one. */
function clearAttendance(did){
  S.busy = true; S.err = ''; render();
  api('hubAttendance', { token: TOKEN, detentionId: did, attendance: '', rescheduledTo: '' })
    .then(function(res){
      S.busy = false;
      if (!res || !res.ok){ S.err = esc((res && res.error) || 'Nothing was cleared.'); render(); return; }
      delete S.attDraft[did];
      refreshDet().then(function(){ render(); });
    }).catch(function(e){
      S.busy = false; S.err = reachErr(e, 'clear the attendance'); render();
    });
}

/* ── TAKING A BOOKING BACK ────────────────────────────────────────────────
   The row is DELETED, not marked cancelled — a booking writes to 🪑 Detention
   and nowhere else, so removing the row puts the world back as it was and the
   debt returns on its own, because what is owed is derived from that tab
   rather than stored. See the note on apiHubUnschedule_ for the trade that
   was made and what it costs.

   NOT RETRIED, for the same reason hubSchedule is not: it is a write, and a
   lost reply is not a lost write. Both of these say so on screen and reload
   rather than trying again. */
function unbookOne(did){
  if (S.busy) return;
  S.busy = true; S.err = ''; S.armUnbook = ''; render();
  api('hubUnschedule', { token: TOKEN, by: S.user, detentionId: did })
    .then(function(res){
      S.busy = false;
      if (!res || !res.ok){ S.err = esc((res && res.error) || 'Nothing was removed.'); render(); return; }
      /* THE BOOKING IS GONE EITHER WAY. Said out loud rather than swallowed,
         because the whole reason the note exists is somebody asking about this
         in six months, and a note nobody knows is missing is worse than none. */
      if (res.noted === false){
        S.derr = 'The booking was removed, but the line in 📝 Record of Changes could not be ' +
                 'written &mdash; check the tab exists.';
      }
      delete S.attDraft[did];
      /* THE SESSION SCREEN CAN EMPTY ITSELF. Removing the last student in the
         room leaves sessHtml with nothing to draw, and it already falls back
         to the detention list when the room is empty — so the re-read has to
         land before anything is rendered, which it does. */
      return refreshDet().then(function(){ render(); });
    })
    .catch(function(e){
      S.busy = false;
      S.err = reachErr(e, 'remove that booking') +
        ' Reopen the session before trying again &mdash; it may already be gone.';
      render();
    });
}

/* THE WHOLE BATCH, while it is still the thing that just happened. Any of
   those forty may have been marked in the meantime by somebody else; those
   are refused individually and named, and the rest still go. */
function unbookBatch(){
  if (S.busy || !S.lastBook || !S.lastBook.ids.length) return;
  var batch = S.lastBook;
  S.busy = true; S.err = ''; render();
  api('hubUnschedule', { token: TOKEN, by: S.user, detentionIds: batch.ids })
    .then(function(res){
      S.busy = false;
      S.lastBook = null;
      if (!res || !res.ok){ S.err = esc((res && res.error) || 'Nothing was removed.'); render(); return; }
      if (res.noted === false){
        S.err = 'Those bookings were removed, but the lines in 📝 Record of Changes could not ' +
                'be written &mdash; check the tab exists.';
      }
      S.flash = res.removed + ' taken back out of ' + longish(batch.when) +
        (res.refused && res.refused.length
          ? ' \u00b7 ' + res.refused.length + ' had already been marked and were left alone'
          : '');
      return loadAll().then(function(){ render(); });
    })
    .catch(function(e){
      S.busy = false; S.lastBook = null;
      S.err = reachErr(e, 'take those bookings back') +
        ' Reload before trying again &mdash; some of them may already be gone.';
      render();
    });
}

function refreshDet(){
  S.derr = '';
  return api('hubDetention', { token: TOKEN }).then(function(res){
    if (res && res.ok) S.det = res;
    else S.derr = esc((res && res.error) || 'The record could not be re-read.');
  }).catch(function(e){
    S.derr = reachErr(e, 're-read 🪑 Detention');
  });
}

function picked(){
  return worklist(S.area).filter(function(x){ return S.sel[rowKey(x)] && !isStamped(x); });
}

/* THE EMAIL IS TWO DIFFERENT SENTENCES, so it is two different blocks.
   A Thursday privilege row counts DISTINCT THURSDAYS, not lates, and its
   action belongs to the DM rather than the form teacher. Putting it in the
   table of lates produced a second row for the same student saying "3" when
   the row above said "5" — in a message going to sixty form teachers. */
/* pickedLates() sat here until 6 August 2026 — the exact mirror of pickedThu()
   below, and never called by anything. Its twin is used, which is what made it
   look load-bearing: a reader finding one naturally assumes both are wired up
   and goes looking for where the non-Thursday branch is handled. Nowhere: the
   callers that want everything use picked() directly. */
function pickedThu(){   return picked().filter(function(x){ return x.domain === 'Thursday privilege'; }); }

/* ONE BLOCK PER LADDER, in the order the area holds them. The email was
   special-cased for latecoming plus a Thursday footnote; an attendance area
   has two ladders with different tiers and different sentences, and merging
   them into one table would repeat the mistake the Thursday block was split
   out to fix. */
function emailGroups(){
  var rows = picked(), by = {}, order = [];
  rows.forEach(function(x){
    if (!by[x.domain]){ by[x.domain] = []; order.push(x.domain); }
    by[x.domain].push(x);
  });
  order.sort(function(a,b){
    if (a === 'Thursday privilege') return 1;
    if (b === 'Thursday privilege') return -1;
    return a.localeCompare(b);
  });
  return order.map(function(d){
    var list = by[d];
    var lo = Math.min.apply(null, list.map(function(x){ return x.term; }));
    var hi = Math.max.apply(null, list.map(function(x){ return x.term; }));
    return { domain:d, rows:list, lo:lo, hi:hi, thu:(d === 'Thursday privilege') };
  });
}

/* The sentence above each table. Occasions for a count, not "offences" —
   an absence with a parent's letter is not an offence and the email should
   not call it one. */
function introFor(g){
  if (g.thu) return THU_PARA;
  var range = (g.lo === g.hi) ? ('on ' + g.lo + ' occasions') : ('on ' + g.lo + ' to ' + g.hi + ' occasions');
  if (g.domain === 'Latecoming')
    return 'The following students have been late ' + range + ' this term. Please follow up accordingly.';
  return 'The following students have been recorded as ' + domainLabel(g.domain) + ' &mdash; ' +
         g.domain + ' &mdash; ' + range + ' this term. Please follow up accordingly.';
}

function recipients(){
  var out = [], seen = {}, absent = [], noIds = [], unresolved = [], noClass = [];
  if (!S.teachers) return { list:[], absent:[], noIds:[], unresolved:[], noClass:[], ready:false };
  picked().forEach(function(x){
    var k = String(x.cls||'').trim().toUpperCase();      // C returns UPPERCASE keys
    /* A student with no class is not a class with no teachers. Reporting it as
       "no teachers listed for ''" was how a blank cell in the Log turned into
       an accusation about the Master. */
    if (!k){ if (noClass.indexOf(x.name)<0) noClass.push(x.name); return; }
    var t = S.teachers.byClass ? S.teachers.byClass[k] : undefined;
    /* THREE DIFFERENT FAULTS, THREE DIFFERENT SENTENCES. C is careful to
       return the key with an empty array when a class exists but has nobody,
       precisely so these can be told apart — collapsing them back into one
       "no teachers listed" threw that away and sent somebody looking in the
       wrong tab. */
    if (t === undefined){ if (absent.indexOf(k)<0) absent.push(k); return; }   // not in Class Allocations
    if (!t.length){
      var u = S.teachers.unresolvedByClass && S.teachers.unresolvedByClass[k];
      if (u && u.length){ if (unresolved.indexOf(k)<0) unresolved.push(k); }   // IDs there, none Active
      else if (noIds.indexOf(k)<0) noIds.push(k);                              // the class is there, the IDs are not
      return;
    }
    t.forEach(function(p){
      var e = String(p.email||'').trim().toLowerCase();
      if (!e || seen[e]) return;
      seen[e] = 1; out.push(p);
    });
  });
  return { list:out, absent:absent, noIds:noIds, unresolved:unresolved, noClass:noClass, ready:true };
}

/* WHAT THE MASTER ACTUALLY SENT BACK, on demand. "No teachers listed for
   26S04" says a fact without saying which side of the join is wrong: the
   class the Hub asked for, or the classes the Master holds. This shows both
   lists side by side so the mismatch is visible rather than deduced. */
function diagHtml(){
  if (!S.diag) return '<div class="stack rowwise" style="margin-top:10px">' +
    '<button class="plain" id="showdiag">Why? Show what the Master sent back</button></div>';

  var need = {}, blank = [];
  picked().forEach(function(x){
    var k = String(x.cls||'').trim().toUpperCase();
    if (k) need[k] = 1; else blank.push(x.name);
  });
  var needList = Object.keys(need).sort();
  var by = (S.teachers && S.teachers.byClass) || {};
  var have = Object.keys(by).sort();
  var withT = have.filter(function(c){ return by[c] && by[c].length; });
  var emptyT = have.filter(function(c){ return !by[c] || !by[c].length; });

  function state(c){
    if (by[c] === undefined) return 'bad';
    return (by[c] && by[c].length) ? 'ok' : 'warn';
  }

  /* WHICH CLASSES HAVE TEACHERS AND WHICH DO NOT is the single most useful
     line here: if every class with teachers is one intake year and every
     class without is the other, the fault is one tab, not fifteen rows. */
  /* Round 4's counts, when the deployment has them. Three numbers that say
     which of three conversations to have — far better than anything the Hub
     can infer from an empty map. */
  var c = S.teachers && S.teachers.counts;
  var src = S.teachers && S.teachers.source;
  var notes = (S.teachers && S.teachers.notes) || [];

  var why;
  if (c && !c.teachersActive){
    why = 'The Teachers tab was read and yielded <b>no Active rows at all</b> ' +
          '(' + c.classes + ' classes found). The <b>Status</b> column must read exactly ' +
          '<b>Active</b> — that is the whole filter.';
  } else if (c && c.teachersActive && !c.withTeachers){
    why = 'The teacher list is fine &mdash; <b>' + c.teachersActive + ' Active teachers</b> &mdash; ' +
          'and <b>' + c.classes + ' classes</b> were found, but <b>not one of them has a teacher</b>. ' +
          'That is one fault, not ' + c.classes + '. It is the <b>CT 1 / CT 2 / CTA 1 / CTA 2</b> ' +
          'columns of Class Allocations.';
  } else if (c && !c.classes){
    why = 'Class Allocations was found but is <b>empty</b> &mdash; no rows yielding a class code.';
  } else if (!have.length){
    /* Confirmed against readClassTeachers_ on 2 August: it filters on NOTHING.
       No year, no cohort, no status on the class row. It opens a tab named
       exactly 'Class Allocations', reads the class code from column B, and
       returns what it finds. An empty map therefore means it never found the
       tab — and a tab it cannot find is skipped in silence. */
    why = 'The reply carried <b>no classes at all</b>, and the Master itself opened fine. ' +
          'The tracker looks for a tab named <b>exactly “Class Allocations”</b> and reads the ' +
          'class code from <b>column B</b>. If the tab is named anything else &mdash; an emoji ' +
          'prefix, a trailing space, “Class Allocation” singular &mdash; it is skipped without ' +
          'an error. <b>Check the tab name letter for letter</b>, and that “Teachers” is spelled ' +
          'exactly that too.';
  } else if (!withT.length){
    why = 'The Master returned <b>' + have.length + ' classes and not one of them has a teacher</b>. ' +
          'That is not fifteen bad rows &mdash; it is one thing wrong once. Check the <b>CT 1 / CT 2 / ' +
          'CTA 1 / CTA 2</b> column headings in Class Allocations, and that the cells hold <b>Teacher IDs</b> ' +
          '(T-0042) rather than names.';
  } else if (needList.filter(function(c){ return by[c] === undefined; }).length){
    why = 'The Master holds ' + have.length + ' classes but not these ones. Check that the class code in ' +
          'Class Allocations matches the code on the Log row exactly &mdash; a trailing space or a ' +
          'different prefix is enough.';
  } else if (needList.filter(function(c){ return state(c) === 'warn'; }).length){
    why = '<b>' + withT.length + ' of the Master\'s ' + have.length + ' classes do have teachers</b>, ' +
          'so the tab and the columns are being read correctly &mdash; these particular classes have ' +
          'empty CT cells. If the ones that work are all one intake year and the ones that do not are ' +
          'the other, only one intake has been filled in.';
  } else {
    why = 'Every class in this email has teachers. If addresses are still missing, those Teacher IDs ' +
          'have no <b>Active</b> row in the Teachers tab.';
  }

  return '<div class="diag">' +
    '<div class="drow"><b>Classes in today\'s email</b><div>' +
      needList.map(function(c){
        return '<span class="dchip ' + state(c) + '">' + esc(c) + '</span>';
      }).join('') + (blank.length ? '<span class="dchip bad">no class recorded ×' + blank.length + '</span>' : '') +
    '</div></div>' +
    '<div class="drow"><b>The Master returned</b><div>' +
      (have.length
        ? '<div class="dline"><span class="dchip ok">' + withT.length + '</span> with teachers' +
          (withT.length ? ' &mdash; ' + esc(withT.slice(0,10).join(', ')) +
             (withT.length>10 ? ' +' + (withT.length-10) + ' more' : '') : '') + '</div>' +
          '<div class="dline"><span class="dchip warn">' + emptyT.length + '</span> with none' +
          (emptyT.length ? ' &mdash; ' + esc(emptyT.slice(0,10).join(', ')) +
             (emptyT.length>10 ? ' +' + (emptyT.length-10) + ' more' : '') : '') + '</div>'
        : '<i>no classes at all</i>') +
    '</div></div>' +
    (c ? '<div class="drow"><b>What the server counted</b><div>' +
      '<span class="dchip ' + (c.classes ? 'ok' : 'bad') + '">' + c.classes + '</span> classes &nbsp; ' +
      '<span class="dchip ' + (c.withTeachers ? 'ok' : 'warn') + '">' + c.withTeachers + '</span> with a teacher &nbsp; ' +
      '<span class="dchip ' + (c.teachersActive ? 'ok' : 'bad') + '">' + c.teachersActive + '</span> Active teachers' +
      (src ? '<div class="dline">Read from <b>' + esc(src.classAllocations || '?') + '</b> and <b>' +
             esc(src.teachers || '?') + '</b></div>' : '') +
    '</div></div>' : '') +
    (notes.length ? '<div class="drow"><b>The server also noted</b><div>' +
      notes.map(function(n){ return '<div class="dline">' + esc(n) + '</div>'; }).join('') +
    '</div></div>' : '') +
    '<div class="drow"><b>What that means</b><div class="dwhy">' + why + '</div></div>' +
    '<div class="stack rowwise" style="margin-top:10px">' +
      '<button class="plain" id="hidediag">Hide</button></div>' +
  '</div>';
}

function subjectLine(){
  var ds = emailGroups().filter(function(g){ return !g.thu; }).map(function(g){ return g.domain; });
  var what = ds.length ? ds.join(' and ') : 'Thursday privilege';
  return what + ' follow-up — ' + areaOf(S.area).title + ' — ' + todayLong();
}

function plain(html){ return String(html).replace(/<[^>]+>/g,'').replace(/&mdash;/g,'—')
  .replace(/&middot;/g,'·').replace(/&amp;/g,'&').replace(/&times;/g,'×'); }

function emailBody(){
  var lines = ['Dear Form Teachers,', ''];
  emailGroups().forEach(function(g){
    if (g.thu) lines.push('THURSDAY PRIVILEGE');
    else lines.push(g.domain.toUpperCase() + ' — ' + domainLabel(g.domain).toUpperCase());
    lines.push(plain(introFor(g)) + (g.thu ? ' This is counted in Thursdays, not in lates.' : ''));
    lines.push('');
    g.rows.forEach(function(x){
      if (g.thu){
        lines.push(x.name + '  |  ' + x.cls + '  |  ' + x.term + ' separate Thursdays' +
                   '  |  Thursday privilege removed');
        lines.push('    Thursdays: ' + (shortDates(x.dates) || '—'));
      } else {
        lines.push(x.name + '  |  ' + x.cls + '  |  ' + x.term + ' this term (' + x.year + ' this year)' +
                   '  |  Tier ' + x.tier);
        lines.push('    Dates: ' + (shortDates(x.dates) || '—'));
        /* THE EMAIL SAYS THE NUMBER TOO. This is the sentence a form teacher
           reads and acts on, so losing the sitting count here would be the
           most expensive place to lose it. */
        lines.push('    ' + actionOf(x.action, x.owed === null ? x.sessions : x.owed));
      }
      lines.push('');
    });
  });
  lines.push('Thank you,');
  lines.push(S.user);
  lines.push('Discipline Committee');
  return lines.join('\n');
}

function emailHtml(){
  var all = picked();
  var r = recipients();
  var subject = subjectLine();

  var warn = '';
  if (S.tLoading){
    warn = '<div class="loading"><div class="spin"></div><div>' +
      '<b>Reading the class teachers&hellip;</b>' +
      '<span>From the Master Database, so the email can be addressed.</span></div></div>';
  }
  else if (S.tErr){
    /* The server's own sentence, then what to do about it. Never a silent
       fall-back to an empty list. */
    warn = '<div class="note err"><b>The class teachers could not be read.</b> ' +
      esc(S.tErr) + '<div class="stack rowwise" style="margin-top:12px">' +
      '<button class="ghost sm" id="retryteach">Try again</button>' +
      '<span class="hintx">You can still copy the message and address it by hand.</span>' +
      '</div></div>';
  }
  else if (!r.ready){ warn = ''; }
  else {
    if (r.noClass.length)
      warn += '<div class="note err"><b>' + esc(r.noClass.join(', ')) +
              (r.noClass.length===1 ? ' has' : ' have') + ' no class on the Log row</b>, so there is ' +
              /* Singular "them" either way, deliberately — the Log row has no
                 gender and inventing one would be worse than a plural-looking
                 pronoun. This was a ternary choosing between 'them' and
                 'them' until 4 August 2026. */
              'nobody to address about them. ' +
              'That is a gap in the record rather than a gap in the Master.</div>';
    if (r.absent.length)
      warn += '<div class="note warn"><b>' + esc(r.absent.join(', ')) +
              (r.absent.length===1 ? ' is' : ' are') + ' not in the Master Database\'s ' +
              'Class Allocations at all.</b> Either the class is missing from that tab, or its ' +
              'code there does not match the code on the Log row &mdash; a trailing space is enough.' +
              diagHtml() + '</div>';
    if (r.noIds.length)
      warn += '<div class="note warn"><b>' + esc(r.noIds.join(', ')) +
              (r.noIds.length===1 ? ' is' : ' are') + ' in Class Allocations, but with ' +
              '<u>no Teacher IDs</u> against ' + (r.noIds.length===1?'it':'them') + '.</b> ' +
              'The Master opened and returned the ' + (r.noIds.length===1?'class':'classes') +
              ' &mdash; columns <b>F to I</b> of Class Allocations are empty on those rows. ' +
              'Run <b>📋 Attendance → 🔍 Check for problems</b>, which counts the class teachers ' +
              'it can see.' + diagHtml() + '</div>';
    if (r.unresolved.length)
      warn += '<div class="note err"><b>' + esc(r.unresolved.join(', ')) +
              ' has teachers assigned who are not Active in the Master.</b> ' +
              'That is a data error somebody should fix &mdash; it is not a class without form teachers.</div>';
  }

  var addr = r.list.map(function(p){ return p.email; }).join('; ');

  /* ONE TABLE SHAPE FOR EVERY BLOCK. Student, Class, a right-aligned count,
     a chip, then the dates — so a message carrying two ladders reads as one
     message rather than two things stapled together. */
  var groups = emailGroups();
  var body = groups.map(function(g, i){
    var head = (groups.length > 1 || g.thu)
      ? '<h3' + (i ? '' : ' class="first"') + '>' + esc(g.thu ? 'Thursday privilege' : g.domain) + '</h3>'
      : '';
    var intro = '<p>' + introFor(g) + (g.thu ? ' <b>This is counted in Thursdays, not in lates.</b>' : '') + '</p>';

    var head2 = g.thu
      ? '<th class="n">Thursdays</th><th class="c">Outcome</th>'
      : '<th class="n">This term</th><th class="n">This year</th><th class="c">Tier</th>';

    var tbl = '<table class="etbl' + (g.thu ? ' thu' : '') + '"><thead><tr>' +
      '<th>Student</th><th>Class</th>' + head2 + '<th>Dates</th></tr></thead><tbody>' +
      g.rows.map(function(x){
        var mid = g.thu
          ? '<td class="n">' + x.term + '</td>' +
            '<td class="c"><span class="chip none">Privilege removed</span></td>'
          : '<td class="n">' + x.term + '</td><td class="n">' + x.year + '</td>' +
            '<td class="c"><span class="chip ' + sevClass(x.tier) + '">Tier ' + x.tier + '</span></td>';
        return '<tr class="' + (g.thu ? '' : sevClass(x.tier)) + '">' +
          '<td>' + esc(x.name) + '</td><td>' + esc(x.cls) + '</td>' + mid +
          '<td>' + esc(shortDates(x.dates) || '—') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      (g.thu ? '' : legendFor(g.domain));

    return head + intro + tbl;
  }).join('');

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="appbar"><a data-go="lc">&larr; ' + esc(areaOf(S.area).title) + '</a></div>' +
    '<h1>Today\'s email</h1>' +
    '<div class="who">' + groups.map(function(g){
        return g.rows.length + ' ' + (g.thu ? 'Thursday privilege' : g.domain);
      }).join(', ') + ' &middot; ' +
      r.list.length + ' recipient' + (r.list.length===1?'':'s') + '.</div>' +
    warn +
    '<div class="mailto"><div><b>To</b> ' + esc(r.list.map(function(p){
        return (p.honorific? p.honorific+' ':'') + p.name; }).join(', ') || '—') + '</div>' +
      '<div><b>Subject</b> ' + esc(subject) + '</div>' +
      '<div class="addr">' + esc(addr || 'no addresses') + '</div></div>' +
    '<div class="stack rowwise">' +
      '<button id="copyaddr" class="ghost sm">Copy the addresses</button>' +
      '<button id="copybody" class="ghost sm">Copy the message</button>' +
      '<button id="outlook">Open Outlook and copy the message</button>' +
    '</div>' +
    '<div class="mailbox"><p>Dear Form Teachers,</p>' + body + '</div>' +
    '<div class="note q"><b>Copying records nothing.</b> The follow-up is only written down when ' +
      'you confirm below that the email has actually gone.</div>' +
    '<div class="stack rowwise">' +
      '<button id="record"' + (S.busy?' disabled':'') + '>' +
        (S.busy ? 'Recording&hellip;' : 'Yes, I have sent it &mdash; record all ' + all.length) + '</button>' +
      '<button class="plain" data-go="lc">Not yet</button>' +
    '</div>' +
    (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') +
  '</div></div>';
}

/* ── the write ────────────────────────────────────────────────────────── */
function record(){
  var rows = picked();
  if (!rows.length) return;
  S.busy = true; S.err=''; render();

  /* actionTaken is always sent, and it is the tier's own wording — so the
     record says what was asked of the form teacher, not merely that somebody
     was emailed. One batch, one sentence, because one email covers them all. */
  var action = 'Daily follow-up email to form teachers — ' + areaOf(S.area).title;

  api('hubStamp', {
    token: TOKEN,
    entryIds: rows.map(function(x){ return x.entryId; }),
    by: S.user,
    actionTaken: action
  }).then(function(res){
    S.busy = false;
    if (!res || !res.ok){ S.err = (res && res.error) || 'Nothing was recorded.'; render(); return; }
    /* OPTIMISTIC. The snapshot will not know about this until it next
       rebuilds, so the screen carries the change itself and says so. */
    rows.forEach(function(x){ S.stamped[x.entryId] = { by:S.user }; });
    S.sel = {};
    S.result = { stamped: Number(res.stamped)||0, already: Number(res.alreadyDone)||0, total: rows.length };
    go('sent');
  }).catch(function(){
    S.busy = false; S.err = 'Could not reach the server. Nothing was recorded — try again.'; render();
  });
}

/* The two other writes this screen owns. Both record A DECISION SOMEBODY TOOK,
   never an edit to what happened. */
function doAsk(){
  var a = S.ask, r = $('reason') ? $('reason').value.trim() : '';
  if (a.kind !== 'unhold' && !r){
    S.err = 'A reason is required. Without one the record is indistinguishable from a mistake ' +
            'when somebody reads it back in a year.';
    render(); return;
  }
  S.busy = true; S.err = ''; render();

  var call, body = { token: TOKEN, by: S.user };
  if (a.kind === 'overturn'){ call='hubOverturn'; body.entryId = a.entryId; body.reason = r; }
  else { call = (a.kind==='hold') ? 'hubHold' : 'hubUnhold';
         body.studentId = S.student.id; body.domain = S.student.domain;
         if (r) body.reason = r; }

  api(call, body).then(function(res){
    S.busy = false;
    if (!res || !res.ok){ S.err = (res && res.error) || 'Nothing was recorded.'; render(); return; }
    if (a.kind === 'overturn') S.local[a.entryId] = 'Overturned';
    else S.holdLocal[S.student.id + '|' + S.student.domain] = (a.kind==='hold') ? 'Held' : 'Open';
    S.ask = null; render();
  }).catch(function(){
    S.busy = false; S.err = 'Could not reach the server. Nothing was recorded — try again.'; render();
  });
}

function sentHtml(){
  var r = S.result || { stamped:0, already:0, total:0 };
  var head = r.stamped + ' recorded.';
  var extra = '';
  if (r.already){
    /* NOT an error. Somebody else got there first, which is a real thing that
       happens when two people work the same list, and the screen should say
       which rather than swallowing it. */
    extra = '<div class="note warn"><b>' + r.already + ' of them ' + (r.already===1?'was':'were') +
      ' already followed up</b> before you sent this &mdash; somebody else had stamped ' +
      (r.already===1?'it':'them') + '. Nothing was overwritten, and ' +
      (r.already===1?'that student is':'those students are') + ' still in your email.</div>';
  }
  return '<div class="screen centre"><div class="wrap">' +
    '<div class="date">' + esc(todayLong()) + '</div>' +
    '<h1 class="big">' + esc(head) + '</h1>' +
    '<div class="lede">Written on the offence that reached the tier &mdash; ' +
      'the date, your name, and what the tier asked for. ' +
      'The counts on the previous screen are still from the last snapshot; ' +
      'they catch up at the next snapshot rebuild.</div>' + extra +
    '<div class="stack">' +
      '<button data-go="lc">Back to ' + esc(areaOf(S.area).title) + '</button>' +
      '<button class="ghost" data-go="menu">All areas</button>' +
    '</div>' +
  '</div></div>';
}

/* A read still in flight, on a screen somebody has already opened. It reuses
   the existing loading vocabulary rather than inventing a third one. */
function readingHtml(what){
  return '<div class="screen centre"><div class="wrap">' +
    '<div class="loading"><div class="spin"></div>' +
      '<div><b>Reading ' + esc(what) + '&hellip;</b>' +
      '<span>This one is read live rather than from the snapshot, so it takes a moment.</span>' +
    '</div></div>' +
    '<div class="stack"><button class="plain" data-go="menu">Back to all areas</button></div>' +
  '</div></div>';
}

function soonHtml(){
  return '<div class="screen centre"><div class="wrap">' +
    '<h1 class="big">Not built yet.</h1>' +
    '<div class="lede">The counts on the menu are real &mdash; they come from the same snapshot as ' +
      'everything else, so you can see whether this area is moving. The screen itself is a later ' +
      'slice. Latecoming follow-up shipped first because it is the one replacing something ' +
      'somebody is doing by hand every week.</div>' +
    '<div class="stack"><button data-go="menu">Back to all areas</button></div>' +
  '</div></div>';
}

/* ── clipboard and Outlook ────────────────────────────────────────────── */
function copy(text, btn){
  var done = function(){ if (btn){ var t=btn.textContent; btn.textContent='Copied';
      setTimeout(function(){ btn.textContent=t; }, 1400); } };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

/* ONE BUTTON, TWO THINGS. Outlook opens with the recipients and the subject
   filled in; the body goes on the clipboard, because a mailto: long enough to
   carry a table is not reliable anywhere. Click, Ctrl+V, send. */
function openOutlook(){
  var r = recipients();
  var subject = subjectLine();
  copy(emailBody(), $('outlook'));
  var to = r.list.map(function(p){ return p.email; }).join(';');
  var url = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject);
  window.__hubMailto = url;
  /* An anchor rather than location.href: a mailto: assignment can leave the
     page in a half-navigated state in some builds, and an anchor click is
     what every mail-handler expects. */
  var a = document.createElement('a');
  a.href = url; a.style.display = 'none';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ── wiring ───────────────────────────────────────────────────────────── */
function wire(){
  var v = $('view');

  if ($('go')) $('go').addEventListener('click', signIn);
  if ($('pw')) $('pw').addEventListener('keydown', function(e){ if (e.key==='Enter') signIn(); });
  /* THE STATE LIVES ON THE ELEMENTS, NOT IN S. A reveal that survived a
     re-render would mean a password left visible on a staffroom screen after
     a failed attempt redrew the page — so it deliberately resets to hidden
     every time this screen is drawn. */
  /* Draw Google's button whenever the sign-in screen exists. It has to happen
     in wire() rather than once at startup, because render() replaces the div
     it draws into every time the screen is redrawn. */
  if ($('gbtn')) paintGoogle();

  if ($('peek')) $('peek').addEventListener('click', function(){
    var f = $('pw'); if (!f) return;
    var showing = f.type === 'text';
    f.type = showing ? 'password' : 'text';
    this.classList.toggle('showing', !showing);
    this.setAttribute('aria-label', showing ? 'Show the password' : 'Hide the password');
    this.setAttribute('title', showing ? 'Show the password' : 'Hide the password');
    f.focus();
  });
  if ($('nm')) { if (S.name) { if ($('pw')) $('pw').focus(); } else $('nm').focus(); }
  if ($('out')) $('out').addEventListener('click', signOut);

  if ($('mail')) $('mail').addEventListener('click', function(){
    go('email');
    if (!S.teachers) loadTeachers();
  });
  if ($('all')) $('all').addEventListener('click', function(){
    worklist(S.area).forEach(function(x){ if (!isStamped(x)) S.sel[rowKey(x)]=true; }); render();
  });
  if ($('none')) $('none').addEventListener('click', function(){ S.sel={}; render(); });
  if ($('record')) $('record').addEventListener('click', record);
  if ($('hold')) $('hold').addEventListener('click', function(){
    S.ask = { kind: heldNow(S.student) ? 'unhold' : 'hold' }; S.err=''; render();
  });
  if ($('doask')) $('doask').addEventListener('click', doAsk);
  if ($('eretry')) $('eretry').addEventListener('click', function(){
    S.pending.early = true; render();
    loadEarly().then(function(){ S.pending.early = false; render(true); });
  });
  if ($('gretry')) $('gretry').addEventListener('click', function(){
    S.pending.groom = true; render();
    loadGrooming().then(function(){ S.pending.groom = false; render(true); });
  });
  if ($('cancelask')) $('cancelask').addEventListener('click', function(){ S.ask=null; S.err=''; render(); });
  if ($('dobook')) $('dobook').addEventListener('click', bookSessions);
  if ($('detretry')) $('detretry').addEventListener('click', function(){
    S.busy = true; render();
    refreshDet().then(function(){ S.busy = false; render(true); });
  });
  /* THE SELECTS AND THE DATE FIELDS ON THE ATTENDANCE SCREEN. They write into
     S.attDraft rather than straight to the server, so a half-made decision —
     "Absent" chosen, no reschedule date typed yet — cannot reach the sheet.
     A change event redraws, because choosing anything other than Attended has
     to make the date field appear. */
  Array.prototype.forEach.call(v.querySelectorAll('[data-att]'), function(el){
    el.addEventListener('change', function(){
      var id = el.getAttribute('data-att');
      if (!S.attDraft[id]) S.attDraft[id] = { att:'', moved:'' };
      S.attDraft[id].att = el.value;
      if (el.value === ATT_OK) S.attDraft[id].moved = '';
      S.err = ''; render();
    });
  });
  Array.prototype.forEach.call(v.querySelectorAll('[data-moved]'), function(el){
    /* INPUT, NOT CHANGE, and no render — a redraw on every keystroke would
       take the caret with it. The draft is kept in step; the screen is not
       rebuilt until something else asks for it. The draft is SEEDED, not
       replaced: writing { att:'' } here is what made a marked row read as
       unmarked after any unrelated redraw. */
    el.addEventListener('input', function(){
      var id = el.getAttribute('data-moved');
      if (!S.attDraft[id]) S.attDraft[id] = { att:'', moved:'' };
      S.attDraft[id].moved = el.value;
      var btn = v.querySelector('[data-save="' + id + '"]');
      if (btn) btn.disabled = !!S.busy;
    });
  });
  if ($('reason')) $('reason').focus();
  if ($('copyaddr')) $('copyaddr').addEventListener('click', function(){
    copy(recipients().list.map(function(p){ return p.email; }).join('; '), this); });
  if ($('copybody')) $('copybody').addEventListener('click', function(){ copy(emailBody(), this); });
  if ($('retryteach')) $('retryteach').addEventListener('click', loadTeachers);
  if ($('showdiag')) $('showdiag').addEventListener('click', function(){ S.diag = true; render(); });
  if ($('hidediag')) $('hidediag').addEventListener('click', function(){ S.diag = false; render(); });
  if ($('outlook')) $('outlook').addEventListener('click', openOutlook);

  v.onclick = function(e){
    var t = e.target;
    var nav = t.closest && t.closest('[data-go]');
    if (nav){ go(nav.getAttribute('data-go')); return; }

    var tab = t.closest && t.closest('[data-tab]');
    if (tab){ S.tab = tab.getAttribute('data-tab'); render(); return; }

    var tool = t.closest && t.closest('[data-url]');
    if (tool){
      var u = tool.getAttribute('data-url');
      if (u) window.open(u, '_blank', 'noopener');
      return;
    }

    /* BEFORE [data-open], and it has to be. A .rowgo carrying data-eopen has
       no data-open on it, so the order is not strictly load-bearing today —
       but the two mean different things (a student ID versus a snapshot entry
       ID) and putting the more specific one first is what stops a future row
       that carries both from silently taking the wrong path. */
    var eopn = t.closest && t.closest('[data-eopen]');
    if (eopn){ e.stopPropagation(); openStudentFromEarly(eopn.getAttribute('data-eopen')); return; }

    /* THE WHOLE ROW IS THE BUTTON, which is what makes the target the width
       of the page rather than the width of the arrow. Toggled on the element
       rather than in S on purpose: a fold that survived a re-render would
       spring open again every time a figure refreshed underneath it. */
    var fld = t.closest && t.closest('[data-fold]');
    if (fld){
      var box = $(fld.getAttribute('data-fold'));
      if (box) box.classList.toggle('open');
      return;
    }

    var opn = t.closest && t.closest('[data-open]');
    if (opn){ e.stopPropagation(); openStudent(opn.getAttribute('data-open')); return; }

    var exc = t.closest && t.closest('[data-excuse]');
    if (exc){ S.ask = { kind:'overturn', entryId: exc.getAttribute('data-excuse') }; S.err=''; render(); return; }

    var pick = t.closest && t.closest('[data-pick]');
    if (pick){
      var id = pick.getAttribute('data-pick');
      /* IN PLACE — the row she just clicked must not make the page move. */
      if (S.sel[id]) delete S.sel[id]; else S.sel[id] = true;
      pick.classList.toggle('sel', !!S.sel[id]);
      var b = pick.querySelector('.badge');
      var n = Array.prototype.indexOf.call(pick.parentNode.children, pick) + 1;
      if (b) b.innerHTML = S.sel[id] ? '&#10003;' : String(n);
      var mail = $('mail');
      if (mail){
        var c = picked().length;
        mail.disabled = !c;
        mail.innerHTML = 'Write today\'s email &mdash; ' + c + ' student' + (c===1?'':'s');
      }
      return;
    }

    var etab = t.closest && t.closest('[data-etab]');
    if (etab){ S.etab = etab.getAttribute('data-etab'); render(); return; }

    var gtab = t.closest && t.closest('[data-gtab]');
    if (gtab){ S.gtab = gtab.getAttribute('data-gtab'); render(); return; }

    /* DETENTION, ALL FOUR ENTRY POINTS — before [data-area], because a booking
       row inside the Detention Sessions screen sits in a list and must not be
       read as a menu row. */
    var dtab = t.closest && t.closest('[data-dtab]');
    if (dtab){ S.dtab = dtab.getAttribute('data-dtab'); render(); return; }

    /* A TICK TOGGLES AND NOTHING ELSE. Checked before the row's own handler,
       because the tick sits inside the row and the row opens a student — so
       without this, ticking somebody would navigate away from the list you are
       ticking. */
    var tick = t.closest && t.closest('[data-tick]');
    if (tick){
      var tk = tick.getAttribute('data-tick');
      if (S.pick[tk]) delete S.pick[tk]; else S.pick[tk] = 1;
      render(); return;
    }
    if (t.id === 'pickclear'){ clearPicks(); render(); return; }
    if (t.id === 'pickgo'){ bookPicked(); return; }
    if (t.id === 'refreshall'){ refreshAll(); return; }

    var save = t.closest && t.closest('[data-save]');
    if (save){ e.stopPropagation(); saveAttendance(save.getAttribute('data-save')); return; }

    var clr = t.closest && t.closest('[data-clear]');
    if (clr){ e.stopPropagation(); clearAttendance(clr.getAttribute('data-clear')); return; }

    /* ARM, CONFIRM, CANCEL — three links, checked before the row's own
       handler, because they sit inside a row that opens a student. */
    var unb = t.closest && t.closest('[data-unbook]');
    if (unb){ e.stopPropagation(); S.armUnbook = unb.getAttribute('data-unbook'); S.err=''; render(); return; }
    var unbNo = t.closest && t.closest('[data-unbookno]');
    if (unbNo){ e.stopPropagation(); S.armUnbook = ''; render(); return; }
    var unbGo = t.closest && t.closest('[data-unbookgo]');
    if (unbGo){ e.stopPropagation(); unbookOne(unbGo.getAttribute('data-unbookgo')); return; }
    if (t.id === 'unbookbatch'){ unbookBatch(); return; }

    var sess = t.closest && t.closest('[data-sess]');
    if (sess){ S.attDraft = {}; S.err=''; go('sess', { sess: sess.getAttribute('data-sess') }); return; }

    var book = t.closest && t.closest('[data-book]');
    if (book){ e.stopPropagation(); openBooking(book.getAttribute('data-book')); return; }

    /* A DATE TILE ON THE BOOKING SCREEN. Toggled in S rather than on the
       element, unlike the worklist's [data-pick] — the chosen count appears in
       four places on that screen, including the button's own label, so a
       redraw is the honest way to keep them in step. The list is a dozen rows,
       not four hundred, so the redraw costs nothing. */
    var dt = t.closest && t.closest('[data-date]');
    if (dt){
      var key2 = dt.getAttribute('data-date');
      if (S.pickDates[key2]) delete S.pickDates[key2]; else S.pickDates[key2] = true;
      S.err = ''; render(); return;
    }

    var area = t.closest && t.closest('[data-area]');
    if (area){
      var key = area.getAttribute('data-area');
      if (key === '__early'){ go('early'); return; }
      if (key === '__groom'){ ensureGrooming(); go('groom'); return; }
      if (key === '__det'){ S.dtab = 'next'; go('det'); return; }
      var a = areaOf(key);
      if (a && a.built) openArea(key); else go('soon');
      return;
    }
  };
}

/* Teacher addresses arrive only when an email is being written, and are held
   in memory for the session. Never localStorage — the same rule as the token.

   A FAILURE HERE MUST NOT LOOK LIKE A SCHOOL WITH NO FORM TEACHERS. The first
   build degraded a failed read into an empty map, which the screen then
   reported as "no teachers listed for 26S04" — blaming the class for the
   server's problem, and giving nobody anything to act on. */
function loadTeachers(){
  S.tLoading = true; S.tErr = ''; render();
  return api('hubTeachers', { token: TOKEN }).then(function(res){
    S.tLoading = false;
    if (res && res.ok){
      S.teachers = { byClass: res.byClass || {}, unresolvedByClass: res.unresolvedByClass || {},
                     /* Round 4. Absent on an older deployment — everything below
                        degrades to the counts the Hub can work out for itself. */
                     counts: res.counts || null, source: res.source || null,
                     notes: res.notes || [] };
      S.tErr = '';
    } else {
      S.teachers = null;
      S.tErr = (res && res.error) || 'The class teachers could not be read.';
    }
    render();
  }).catch(function(e){
    S.tLoading = false; S.teachers = null;
    S.tErr = reachErr(e, 'read the class teachers');
    render();
  });
}

/* Exposed for the automated checks only. */
window.__hub = S;
window.__hubRender = render;
window.__hubWorklist = worklist;
window.__hubRecipients = recipients;
window.__hubEmailBody = emailBody;
window.__hubPickedThu = pickedThu;
window.__hubOpenStudent = openStudent;

/* ── RESUME, IF THE LAST SESSION IS STILL GOOD ───────────────────────────
   Tried before anything is drawn, so a returning user sees the menu rather
   than the sign-in screen and then the menu. If the token has expired, or the
   server has restarted, or the access list has changed, hubAll fails and the
   sign-in screen appears exactly as it always did — the stored session is an
   optimisation, never an authority. The SERVER still decides. */
(function resume(){
  var s = recallSession();
  if (!s){ render(true); return; }
  TOKEN = s.token; S.user = s.user; S.email = s.email;
  S.view = 'menu'; S.busy = true;
  render(true);
  loadAll().then(function(){
    S.busy = false; render(true);
  }).catch(function(){
    /* Not an error worth showing. The session simply aged out, and the honest
       response is the sign-in screen, not an explanation of why. */
    forgetSession();
    TOKEN = null; S.user = ''; S.email = ''; S.snap = null; S.det = null;
    S.busy = false; S.view = 'signin'; S.err = '';
    render(true);
  });
})();

})();
