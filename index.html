<!--
  ============================================================================
  SAJC DISCIPLINE COMMITTEE HUB
  ============================================================================
  SLICE 1 — latecoming follow-up and the daily email.

  The menu shows all six areas with live counts, because seeing that JC1
  Attendance has not moved all week is half of what the menu is for. Only the
  two latecoming areas open; the rest say so plainly rather than pretending.

  WORK-SHAPED, NOT PERSON-SHAPED. There is no Roles tab and there never will
  be. Every area opens for anyone; the name you type at sign-in goes into the
  record, and that is the whole of what the Hub knows about you.

  IT WRITES ONE THING IN THIS SLICE: the follow-up stamp, in a batch, after
  you confirm the email was sent. Copying the email records nothing.

  NOTHING CAN FORCE A REBUILD, so no screen pretends the world updated. A
  stamp strikes the row through immediately and says out loud that the figures
  behind it are from the last snapshot.

  THE TOKEN AND THE TEACHER ADDRESSES ARE HELD IN MEMORY AND NOWHERE ELSE.
  No localStorage, no sessionStorage, no cookie.
  ============================================================================
-->

<style>
:root{
  --accent:#27326a; --accent-deep:#1b2450; --accent-tint:#e8eaf3;
  --paper:#f7f5f1; --raised:#fffdfa; --line:#e4ded4;
  --ink:#1b1e2b; --muted:#6e7180;
  --good:#2f6b4f; --good-tint:#e6f0ea;
  --warn:#8a5a12; --warn-tint:#f7edda;
  --bad:#9d372e;  --bad-tint:#f7e8e5;
  --sev5:#FF8080; --sev4:#FFA862; --sev3:#FFD27A; --sev2:#FFF2A8;
  --wash5:#fdeae8; --wash4:#fdf0e6; --wash3:#fdf6e6; --wash2:#fdfbe8;
  --curve:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,-apple-system,sans-serif;font-size:17px;
     line-height:1.55;letter-spacing:-.005em;color:var(--ink);background:var(--paper);
     height:100vh;overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;font-weight:600}
h1{font-size:33px;line-height:1.16;font-variation-settings:'opsz' 90,'SOFT' 30,'WONK' 1}
h1.big{font-size:44px;margin-bottom:6px}
h2{font-size:24px;margin-bottom:4px}

#view{height:100%;overflow-y:auto}
.screen{padding:44px 40px 40px;animation:rise .42s var(--curve) both}
.screen.still{animation:none}
.screen.centre{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.wrap{max-width:760px;margin:0 auto;width:100%}
.wrap.wide{max-width:990px}

.date{font-size:19px;font-weight:600;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.date:after{content:'';flex:1;height:1px;background:var(--line)}
.centre .date{justify-content:center}
.centre .date:after{display:none}
.built{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.built.old{color:var(--warn)}
.who{font-size:15.5px;color:var(--muted);margin-bottom:16px}
.sub{font-size:21px;color:var(--muted);font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1}
.lede{font-size:15.5px;color:var(--muted);max-width:52ch;margin-top:12px}
.gap{height:26px}
.centre .lede{margin-left:auto;margin-right:auto}
.foot{font-size:12.5px;color:var(--muted);margin-top:26px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.foot .sp{flex:1}

.appbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-size:13.5px;color:var(--muted)}
.appbar a{color:var(--accent);text-decoration:none;cursor:pointer}
.appbar a:hover{text-decoration:underline}

.field{margin-top:22px;max-width:430px}
.centre .field{margin-left:auto;margin-right:auto;text-align:left}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;
             letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.field input,.field textarea{width:100%;font:inherit;font-size:21px;color:var(--ink);background:none;
  border:0;border-bottom:2px solid var(--line);padding:6px 0;outline:none;
  transition:border-color .28s var(--curve)}
.field textarea{font-size:16.5px;resize:vertical;line-height:1.5;border:1.5px solid var(--line);
  border-radius:9px;padding:11px 13px}
/* THE PASSWORD REVEAL, as on the two phone pages. A committee password typed
   on a laptop in a staffroom is mistyped as often as one typed on a phone, and
   the second thing anybody does after a failed sign-in is type it wrong again.
   The eye is a BUTTON, not a checkbox, and it is type="button" — inside a form
   a bare <button> submits, which would have signed you in mid-peek. */
/* THE RESET IS THE POINT OF THIS BLOCK, and it is why the eye had a box.
   This page styles the bare <button> ELEMENT — background, padding, 9px
   corners and a drop shadow — so every button gets a pill unless it opts out.
   `.peek` set border and background but not box-shadow, border-radius,
   padding or the hover transform, so the shadow and the corners survived and
   the icon sat in a little raised box. The green slip and gate pages put that
   styling on a .btn CLASS instead, which is why the identical markup looked
   right there and wrong here. Everything the element rule sets is undone here
   explicitly rather than by hoping specificity sorts it out. */
.field.pw{position:relative}
.field.pw input{padding-right:44px}
.peek{position:absolute;right:0;bottom:5px;padding:7px 2px;
  border:0;background:none;box-shadow:none;border-radius:0;
  color:var(--muted);cursor:pointer;font:inherit;
  transition:color .2s ease}
.peek:hover{background:none;box-shadow:none;transform:none;color:var(--accent)}
.peek:active{transform:none}
.peek svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.peek .slash{opacity:0;transition:opacity .2s ease}
.peek.showing .slash{opacity:1}
.peek:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}

/* Google's button, and a rule saying the password below it is the fallback. */
.gwrap{margin-top:26px;max-width:430px}
.centre .gwrap{margin-left:auto;margin-right:auto}
.gor{display:flex;align-items:center;gap:14px;margin:22px 0 2px;
  font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.gor:before,.gor:after{content:'';flex:1;height:1px;background:var(--line)}


/* ═══ THE STUDENT PAGE, REBUILT 3 AUGUST 2026 ══════════════════════════
   The year used to be one flat list grouped by status: every record, every
   term, in one column down the page. It served the EVIDENCE — the remarks you
   need in front of you to excuse an offence — and buried the SHAPE, which is
   what somebody opening a student page is actually looking for. Sixty rows is
   a page nobody reads to the bottom, and the bottom is the oldest records,
   which is what a pattern is made of.

   Split into three. A chart for when. A compact block for what. The list,
   folded, for the evidence. Nothing was removed. */

/* Section headings were 11.5px uppercase muted — the same weight as a form
   label — on a page with five sections, leaving nothing to navigate by. */
.ghdr{display:flex;align-items:center;gap:16px;margin:38px 0 12px;
  font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:22px;letter-spacing:-.017em;color:var(--ink)}
.ghdr:after{content:'';flex:1;height:1px;background:var(--line)}

/* ── THE YEAR, STACKED BY CATEGORY ──────────────────────────────────────
   SEVEN SERIES CANNOT SIT SIDE BY SIDE — twelve months by seven is eighty-four
   marks about three pixels wide. Stacked, the column height is the month's
   total and each segment is its category, which is the composition-over-time
   question this section exists to answer.

   THE MONTHS SPREAD ACROSS THE FULL WIDTH; THE BARS STAY CAPPED AT 24px.
   Widening a bar to fill its band is where a chart becomes a block diagram.
   What stretches is the spacing. The extra room goes into height, where it
   buys resolution — a difference of one record has to be visible. */
.yr{margin:16px 0 6px}
.yrplot{display:flex;align-items:flex-end;gap:10px;height:210px}
.yrcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%}
.yrn{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;
  font-variant-numeric:tabular-nums}
.yrn.zero{color:transparent}
.yrstack{width:100%;max-width:24px;display:flex;flex-direction:column;justify-content:flex-end}
.yrseg{width:100%;min-height:3px}
.yrseg.top{border-radius:4px 4px 0 0}
.yrseg.gap{margin-bottom:2px}          /* the surface showing through, not a border */
.yrnil{width:100%;max-width:24px;height:3px;background:rgba(27,30,43,.07)}
.yraxis{display:flex;gap:10px;margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
.yrm{flex:1;text-align:center;font-size:11.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
.yrm.on{color:var(--ink);font-weight:600}
.leg{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap;margin:4px 0 12px;
  font-size:13px;color:var(--ink)}
.leg span{display:inline-flex;align-items:center;gap:8px}
.leg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}

/* ── BY CATEGORY ────────────────────────────────────────────────────────
   The same two-line bar the grooming screens use, so the Hub draws a magnitude
   one way rather than three. Each bar wears its category's colour, matching
   the segment above it. */
.tyrow{margin-bottom:18px}
.tytop{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:6px}
.tyname{font-size:15.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.tyname i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.tyn{font-size:15px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tyn span{color:var(--muted);font-weight:400;margin-left:8px}
.tytrack{height:14px;background:rgba(27,30,43,.06);border-radius:0 4px 4px 0}
.tyfill{height:14px;border-radius:0 4px 4px 0}
.tyterms{display:flex;gap:0;flex-wrap:wrap;margin-top:7px}

/* A MIDDLE DOT BETWEEN THE LABEL AND ITS NUMBER, and a hairline between one
   chip and the next. "Term 1 5" ran two tokens together with nothing to say
   where one ended; the dot separates them without adding a third weight, and
   the rule stops "5 Term 2" reading as a phrase of its own.
   THE NUMBER STAYS IN THE BODY FACE — it was set in Fraunces, a display face,
   which runs several points larger at the same nominal size. */
.tchip{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 15px;
  border-left:1px solid var(--line)}
.tchip:first-child{padding-left:0;border-left:0}
.tchip:last-child{padding-right:0}
.tchip i{font-style:normal;color:#b8b2a6;margin:0 7px}
.tchip b{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}

/* ── GROOMING ───────────────────────────────────────────────────────────
   ONE HUE, NOT AN EIGHTH CATEGORICAL SLOT. Grooming has its own eight
   categories; painting them from the same set would put fifteen hues on one
   page, five past the point where adjacent colours stop being tellable apart.
   It is a different system with a different meaning, so it reads as one. */
.gsec{margin-top:6px}
.gfig{display:flex;gap:34px;flex-wrap:wrap;margin:4px 0 16px}
.gfig div{min-width:88px}
.gfig b{display:block;font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;font-weight:600;font-size:34px;line-height:1}
.gfig span{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.gm{display:flex;gap:10px;align-items:flex-end;height:112px;margin-bottom:2px}
.gmc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.gmb{width:100%;max-width:24px;background:#27326a;border-radius:4px 4px 0 0;min-height:3px}
.gmb.nil{background:rgba(27,30,43,.07);height:3px;border-radius:0}
.gmn{font-size:11.5px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}
.gmn.zero{color:transparent}

/* ── THE FOLDS ──────────────────────────────────────────────────────────
   THE ARROW IS 26px AND THE ROW IS TALLER. It was a 15px grey chevron, about
   the size of a full stop at arm's length — and it is the only control on the
   page that reveals anything. The person who cannot see it is the person least
   likely to go hunting for it. The whole row is the button, so the target is
   the width of the page rather than the width of the arrow. */
.fold{border:1px solid var(--line);border-radius:10px;background:var(--raised);
  margin-bottom:8px;overflow:hidden}
.foldh{display:flex;align-items:center;gap:16px;padding:17px 18px;cursor:pointer;
  user-select:none;background:none;border:0;width:100%;text-align:left;font:inherit;color:var(--ink)}
.foldh:hover{background:var(--accent-tint)}
.foldh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.foldh .fchev{font-size:26px;line-height:1;width:20px;text-align:center;color:var(--accent);
  transition:transform .2s var(--curve)}
.foldh:hover .fchev{color:var(--accent-deep)}
.fold.open .foldh .fchev{transform:rotate(90deg)}
.foldh .fdot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.foldh .fname{flex:1;font-size:16.5px;font-weight:600}
.foldh .fname em{font-style:normal;font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.foldh .fsum{display:flex;gap:0;white-space:nowrap}
.foldb{display:none;padding:2px 14px 14px}
.fold.open .foldb{display:block}
.foldb .tlrow{background:var(--paper)}
@media (max-width:640px){
  .yrplot{height:150px} .gm{height:84px} .ghdr{font-size:19px}
  .foldh .fsum{display:none}
}


/* ── charts ─────────────────────────────────────────────────────────────
   A ranked bar and a row of headline figures. The bar is 14px — capped well
   under the 24px ceiling so the band's leftover stays as air — square where it
   leaves the baseline and rounded 4px at the data end, which is the only end
   the reader measures. The track behind it is one step off the surface and
   carries no data; it exists so a short bar still has a length to be short
   against. No border on the fill: ink that is not data. */
.kpi{display:flex;gap:38px;flex-wrap:wrap;margin:22px 0 4px;padding-bottom:20px;
  border-bottom:1px solid var(--line)}
.kpi div{min-width:92px}
.kpi b{display:block;font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;font-weight:600;
  font-size:41px;line-height:1;letter-spacing:-.02em}
.kpi span{display:block;font-size:12px;color:var(--muted);margin-top:7px;letter-spacing:.02em}
.viz{margin:16px 0 26px}
.vrow{margin-bottom:17px}
.vtop{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:6px}
.vname{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.vval{font-size:15px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.vpct{color:var(--muted);font-weight:400;margin-left:8px}
.vtrack{height:14px;background:rgba(27,30,43,.06);border-radius:0 4px 4px 0}
.vfill{height:14px;background:#27326a;border-radius:0 4px 4px 0}
.vsub{font-size:12.5px;color:var(--muted);margin-top:5px}
@media (max-width:640px){ .kpi{gap:26px} .kpi b{font-size:34px} }
.field input:focus,.field textarea:focus{border-bottom-color:var(--accent);border-color:var(--accent)}

.stack{display:flex;flex-direction:column;gap:9px;margin-top:28px;max-width:430px}
.centre .stack{margin-left:auto;margin-right:auto;width:100%}
.stack.rowwise{flex-direction:row;max-width:100%;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:500;font-size:16px;border:0;cursor:pointer;background:var(--accent);
  color:#fff;padding:15px 22px;border-radius:9px;box-shadow:0 2px 8px rgba(39,50,106,.18);
  transition:transform .18s var(--curve),background .18s var(--curve),box-shadow .18s var(--curve)}
button:hover{background:var(--accent-deep);transform:translateY(-1.5px);box-shadow:0 6px 16px rgba(39,50,106,.24)}
button:active{transform:translateY(1px)}
button:disabled{background:#cfcabf;box-shadow:none;cursor:default;transform:none}
button.ghost{background:none;color:var(--accent);box-shadow:none;border:1.5px solid var(--line)}
button.ghost:hover{background:var(--accent-tint);color:var(--accent-deep);box-shadow:none}
button.plain{background:none;color:var(--muted);box-shadow:none;font-size:14.5px;padding:6px 0}
button.plain:hover{background:none;color:var(--ink);transform:none;box-shadow:none;text-decoration:underline}
button.sm{font-size:14px;padding:9px 15px}

.mrows{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.mrow{display:flex;align-items:center;gap:20px;background:var(--raised);border:1px solid var(--line);
  border-left:4px solid var(--line);border-radius:11px;padding:16px 22px;cursor:pointer;
  transition:transform .2s var(--curve),border-color .2s var(--curve)}
.mrow:hover{transform:translateX(2.5px);border-color:#d6cfc2}
.mrow.t5{border-left-color:var(--sev5)} .mrow.t4{border-left-color:var(--sev4)}
.mrow.t3{border-left-color:var(--sev3)} .mrow.t2{border-left-color:var(--sev2)}
.mrow .mt{flex:1;font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 60,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:20px;min-width:0}
.mrow .mt em{display:block;font-family:'Public Sans',sans-serif;font-style:normal;font-size:12.5px;
  font-weight:400;color:var(--muted);letter-spacing:.01em;margin-top:2px}
.mnum{flex:0 0 168px;display:flex;align-items:baseline;gap:9px}
.mnum b{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 40,'SOFT' 30,'WONK' 1;
  font-weight:600;font-size:26px}
.mnum span{font-size:13px;color:var(--muted)}
.mnum.zero b{color:#bdb7ab} .mnum.zero span{color:#a9a498}
.mrow.soon{opacity:.62}
.mrow.soon:hover{transform:none;border-color:var(--line)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-top:10px}
.mtile{background:transparent;border:1px solid var(--line);border-radius:12px;padding:16px 20px 15px;
  cursor:pointer;transition:transform .2s var(--curve),box-shadow .2s var(--curve),border-color .2s var(--curve)}
.mtile:hover{transform:translateY(-2.5px);box-shadow:0 8px 22px rgba(39,50,106,.10);border-color:#d6cfc2}
.mtile h3{font-size:17px;margin-bottom:4px;color:var(--accent)}
.mtile .ts{font-size:13px;color:var(--muted)}

.grouplabel{display:flex;align-items:center;gap:14px;margin:30px 0 10px;font-size:11.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.grouplabel:after{content:'';flex:1;height:1px;background:var(--line)}

.tabs{display:flex;gap:26px;margin:16px 0 4px;border-bottom:1px solid var(--line)}
.tabs a{font-size:15px;color:var(--muted);cursor:pointer;padding:0 0 10px;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .2s var(--curve)}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.rows{margin-top:18px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:15px;background:var(--raised);border:1px solid var(--line);
  border-left:4px solid var(--line);border-radius:11px;padding:14px 18px;cursor:pointer;text-align:left;
  transition:transform .2s var(--curve),border-color .2s var(--curve),opacity .25s var(--curve),background .25s var(--curve)}
.row:hover{transform:translateX(2.5px)}
.row.flat,.row.flat:hover{cursor:default;transform:none}
.row.t5{background:var(--wash5);border-color:#f2ddda;border-left-color:var(--sev5)}
.row.t4{background:var(--wash4);border-color:#f2e4d5;border-left-color:var(--sev4)}
.row.t3{background:var(--wash3);border-color:#f2ead4;border-left-color:var(--sev3)}
.row.t2{background:var(--wash2);border-color:#f0eed6;border-left-color:var(--sev2)}
.row .badge{flex:0 0 27px;height:27px;border-radius:50%;border:1.5px solid rgba(0,0,0,.14);
  background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;color:var(--muted);transition:all .2s var(--curve)}
.row.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.row.sel .badge{background:var(--accent);border-color:var(--accent);color:#fff}
.row .body{flex:1;min-width:0}
.row .p{font-weight:600;font-size:17px}
.row .p small{font-weight:400;color:var(--muted);font-size:15px;margin-left:7px}
/* Class and level on their own line. Three short lines read faster than one
   long one when you are scanning forty rows for a name you half-remember. */
.row .meta{font-size:14px;color:var(--muted);margin-top:1px;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap}

        err.status = r.status;
        err.snippet = String(txt || '').replace(/<[^>]*>/g, ' ')
                        .replace(/\s+/g, ' ').trim().slice(0, 240);
        throw err;
      }
    });
  });
}

/* ── WHY THERE IS A RETRY AT ALL ──────────────────────────────────────────
   /exec does not answer directly. It returns a 302 to a one-time address on
   script.googleusercontent.com, and the browser follows it to fetch the body.
   In a browser signed into several Google accounts that second hop
   INTERMITTENTLY 404s, and what comes back is Google Drive's own "Page not
   found" page instead of our JSON.

   THE PROOF, 4 August 2026: the failing attempt showed `#drive-logo` and
   `googlelogo_color` in the body — Drive's not-found page — while the
   Executions log showed the same doPost COMPLETED in 1.578 seconds. The script
   ran, did its work and returned. The reply was lost on the way back.

   This is the same fault recorded on 2 August, when an /exec link in an email
   failed with "unable to open file" on a phone signed into two accounts and
   worked in incognito on the same device. It was known to affect links. It
   turns out to affect this fetch too — rarely, and only when several Google
   sessions are live, which is exactly the state that testing a sign-in screen
   with four different accounts produces.

   Google sign-in did not cause this and removing it would not fix it. It
   merely made the browser hold more Google sessions, which made a rare fault
   frequent enough to find.

   A fresh POST gets a fresh redirect target, so retrying clears it. This
   paragraph said "one retry. One, not three" until 4 August 2026, and the
   reasoning behind that — hammering a server that may be struggling is not a
   diagnosis — was sound while the fault was unexplained. It stopped applying
   the moment the fault WAS explained. The cause is collision between requests,
   not a struggling server, and the answer to collision is to back off and try
   again rather than to give up after one go. RETRY_SAFE grants three, with a
   growing jittered wait; the comment above it records why. */
function api(action, body){
  if (window.__mockApi) return window.__mockApi(action, body);
  var payload = body || {};
  payload.action = action;
  var left = RETRY_SAFE[action] || 0;

  function attempt(){
    return apiOnce(action, payload).catch(function(e){
      if (!e || !e.badReply || left <= 0) throw e;
      /* GROWING, AND JITTERED — changed 4 August 2026 once the cause was known.
         A FIXED delay is the wrong shape when the fault is collision: two
         clients that collide, both wait exactly 700ms, and collide again. The
         wait now doubles each time and carries a random spread, which is what
         pulls two unlucky clients apart instead of keeping them in step. */
      var wait = 500 * Math.pow(2, 3 - left) + Math.floor(Math.random() * 400);
      left--;
      return new Promise(function(res){ setTimeout(res, wait); }).then(attempt);
    });
  }
  return attempt();
}

/* One sentence for a failed call, saying which of the two things happened.
   `what` names the thing being attempted, e.g. 'complete the sign-in'. */
function reachErr(e, what){
  if (e && e.badReply){
    return 'The server received the request to ' + what + ' and the reply came back ' +
           'unreadable &mdash; twice, if this was something safe to send again. ' +
           'That is usually Google losing the reply rather than anything being wrong with ' +
           'your connection or your account. IT MAY HAVE WORKED: check before trying again, ' +
           'and if this keeps happening, closing other Google accounts in this browser is ' +
           'the thing most likely to help. ' +
           (e.snippet ? '<br><br>Google said: <i>' + esc(e.snippet) + '</i>' : '');
  }
  return 'Could not reach the server at ' + GAS_URL + ' to ' + what + '. Nothing was sent. ' +
         'Either the connection is down, or the deployment at that address no longer exists.';
}

/* ── the snapshot, read by NAME ───────────────────────────────────────── */
/* C returns positional rows plus the header list. Building the accessor from
   that list rather than counting positions is what stops a column inserted in
   the middle from silently shifting every screen in the Hub. */
function colIndex(columns){
  var m = {};
  (columns || []).forEach(function(c,i){ m[String(c).trim().toLowerCase()] = i; });
  return m;
}
function cell(row, cols, name){
  var i = cols[String(name).trim().toLowerCase()];
  return (i === undefined) ? '' : row[i];
}

/* One snapshot row, as an object the screens can read. */
function snapRow(r, cols){
  return {
    domain:   String(cell(r,cols,'Domain')||''),
    area:     String(cell(r,cols,'Area')||''),
    cohort:   String(cell(r,cols,'Cohort')||''),
    id:       String(cell(r,cols,'Student ID')||''),
    name:     String(cell(r,cols,'Name')||''),
    cls:      String(cell(r,cols,'Class')||''),
    term:     Number(cell(r,cols,'Term count'))||0,
    year:     Number(cell(r,cols,'Year count'))||0,
    tier:     Number(cell(r,cols,'Tier'))||0,
    action:   String(cell(r,cols,'Action')||''),
    whoActs:  String(cell(r,cols,'Who acts')||''),
    follows:  /^y/i.test(String(cell(r,cols,'DC follows up')||'')),
    sessions: Number(cell(r,cols,'Detention sessions'))||0,
    last:     String(cell(r,cols,'Last offence date')||''),
    entryId:  String(cell(r,cols,'Entry ID')||''),
    state:    String(cell(r,cols,'State')||''),
    heldBy:   String(cell(r,cols,'Held by')||''),
    heldOn:   String(cell(r,cols,'Held since')||''),
    heldWhy:  String(cell(r,cols,'Hold reason')||''),
    atDM:     /^y/i.test(String(cell(r,cols,'At DM boundary')||'')),
    quiet:    Number(cell(r,cols,'Days since last offence')),
    dates:    String(cell(r,cols,'Dates')||'')
  };
}

function allRows(){
  if (!S.snap) return [];
  var cols = colIndex(S.snap.columns);
  return (S.snap.rows||[]).map(function(r){ return snapRow(r, cols); });
}

function isHeld(x){ return /held/i.test(x.state); }
function isStamped(x){ return !!S.stamped[x.entryId]; }

/* ── the four worklist areas ──────────────────────────────────────────── */
/* NOT "the six menu areas", which is what this said until 4 August 2026. The
   menu shows six rows, but only these four are worklists built from the
   snapshot; Early dismissals and Grooming are live reads with their own
   loaders and no entry here. Counting one thing and naming another is how a
   reader ends up looking for two array entries that were never meant to
   exist. */
/* Domains, not people. 'Thursday privilege' folds into its cohort's
   latecoming worklist — it is one rule and the same person's job, not a
   ladder anybody works through. */
var AREAS = [
  { key:'JC1 Latecoming', title:'JC1 Latecoming', built:true,
    match:function(x){ return x.cohort==='JC1' && (x.domain==='Latecoming' || x.domain==='Thursday privilege'); } },
  { key:'JC2 Latecoming', title:'JC2 Latecoming', built:true,
    match:function(x){ return x.cohort==='JC2' && (x.domain==='Latecoming' || x.domain==='Thursday privilege'); } },
  { key:'JC1 Attendance', title:'JC1 Attendance', built:true,
    match:function(x){ return x.cohort==='JC1' && /^A\(/.test(x.domain); } },
  { key:'JC2 Attendance', title:'JC2 Attendance', built:true,
    match:function(x){ return x.cohort==='JC2' && /^A\(/.test(x.domain); } }
];
function areaOf(key){ for (var i=0;i<AREAS.length;i++) if (AREAS[i].key===key) return AREAS[i]; return null; }

function rowsFor(key){
  var a = areaOf(key); if (!a) return [];
  return allRows().filter(a.match);
}

/* Worklist = the committee's to do. Tiers the ladder says the DC does not
   follow up never appear here — latecoming 1 and 2 are the form teacher's
   alone, recorded and counted and deliberately not ours. */
function worklist(key){
  return rowsFor(key).filter(function(x){ return x.follows && !isHeld(x); })
    .sort(function(a,b){
      if (b.tier !== a.tier) return b.tier - a.tier;
      if (b.term !== a.term) return b.term - a.term;
      return String(a.name).localeCompare(String(b.name));
    });
}
function heldIn(key){ return rowsFor(key).filter(isHeld); }

/* Sessions still to book: what the tier says is owed, less what is already in
   🪑 Detention for that student in that area. */
function bookedFor(id, area){
  if (!S.det || !S.det.rows) return null;
  var c = colIndex(S.det.columns), n = 0;
  S.det.rows.forEach(function(r){
    if (String(cell(r,c,'Student ID')).trim() !== id) return;
    if (String(cell(r,c,'Area')).trim() !== area) return;
    n++;
  });
  return n;
}
function toSchedule(key){
  var n = 0, unknown = false;
  rowsFor(key).forEach(function(x){
    if (!x.sessions) return;
    var b = bookedFor(x.id, x.area);
    if (b === null){ unknown = true; n += x.sessions; }
    else n += Math.max(0, x.sessions - b);
  });
  return { n:n, unknown:unknown };
}

function sevClass(t){ return t>=5?'t5':t===4?'t4':t===3?'t3':t>=1?'t2':''; }

/* WHAT A DOMAIN IS CALLED IN A SENTENCE. ⚙️ Statuses carries the label, so
   'A(WOR)' can become 'absence without a valid reason' in an email to sixty
   form teachers without a word of it living in this file. Thursday privilege
   is not a status, so it is named here and nowhere else. */
function domainLabel(domain){
  if (domain === 'Thursday privilege') return 'Thursday privilege';
  var list = (S.snap && S.snap.statuses) || [];
  for (var i=0;i<list.length;i++){
    if (String(list[i].ladder||'').trim() === domain && list[i].label) return list[i].label;
    if (String(list[i].code||'').trim() === domain && list[i].label) return list[i].label;
  }
  return domain;
}

/* Which ladders an area actually contains, worst first — an attendance area
   holds two, and a latecoming area holds two as well once somebody reaches
   the Thursday counter. Read from the rows, never assumed. */
function domainsIn(key){
  var seen = {}, order = [];
  rowsFor(key).forEach(function(x){ if (!seen[x.domain]){ seen[x.domain]=1; order.push(x.domain); } });
  return order.sort(function(a,b){
    if (a === 'Thursday privilege') return 1;      // always last: it is a footnote
    if (b === 'Thursday privilege') return -1;
    return a.localeCompare(b);
  });
}

/* ── dates and text ───────────────────────────────────────────────────── */
/* MONTH_LONG, NOT MONTHS. Until 4 August 2026 this was called MONTHS, and so
   was the SHORT list further down the same script — 'Jan', 'Feb', 'Mar' — used
   for the year chart's twelve columns. Two `var MONTHS` in one scope is not an
   error in JavaScript; the second simply wins at load. So longish() and
   todayLong() below, both written to print a full month name, had been
   printing 'Wednesday 29 Jul' and '4 Aug 2026' instead. Silently, since both
   lists are twelve strings long and both index the same way. */
var MONTH_LONG=['January','February','March','April','May','June','July','August',
                'September','October','November','December'];
var DAYNAME={sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};

/* '29 Jul 2026 (Wed)' → 'Wednesday 29 July'. */
function longish(stamp){
  var m = /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s*\(([A-Za-z]{3})\)/.exec(String(stamp||''));
  if (!m) return String(stamp||'');
  var mi = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']
             .indexOf(m[2].toLowerCase());
  var dow = DAYNAME[m[4].toLowerCase()];
  if (mi < 0 || !dow) return String(stamp);
  return dow + ' ' + Number(m[1]) + ' ' + MONTH_LONG[mi];
}
function todayLong(){
  var d = new Date();
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()] +
         ', ' + d.getDate() + ' ' + MONTH_LONG[d.getMonth()] + ' ' + d.getFullYear();
}
/* '02 Jul 2026 · 09 Jul 2026 · 29 Jul 2026' → '02 Jul · 09 Jul · 29 Jul'.
   The year is the same on every row of the email and the column is the widest
   thing in the table, so it is repetition paid for in wrapped lines. IF THE
   YEARS DIFFER the string is left alone — a date list that straddles a year
   boundary is exactly when the year is the thing you need to see. */
function shortDates(str){
  var s = String(str || '');
  var years = s.match(/\b[A-Za-z]{3}\s+(\d{4})\b/g);
  if (!years || !years.length) return s;
  var first = years[0].slice(-4);
  for (var i = 1; i < years.length; i++) if (years[i].slice(-4) !== first) return s;
  return s.replace(/(\b[A-Za-z]{3})\s+\d{4}\b/g, '$1');
}

function ordinal(n){
  n = Number(n)||0;
  var s=['th','st','nd','rd'], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function mins(hhmm){
  var m=/^(\d{1,2}):(\d{2})/.exec(String(hhmm||''));
  return m ? Number(m[1])*60+Number(m[2]) : null;
}

/* How old the snapshot is, in words. Every slow screen carries this because
   nothing on the client can force a rebuild. */
function builtHtml(){
  if (!S.snap) return '';
  var at = String(S.snap.rebuiltAt||'').trim();
  if (!at) return '<span class="built old">Never rebuilt &mdash; run 📸 Rebuild the Snapshot now</span>';
  var m = /(\d{1,2}:\d{2})\s*$/.exec(at);
  var shown = m ? m[1] : at;
  var age = (m && mins(S.snap.serverTime)!==null) ? mins(S.snap.serverTime) - mins(m[1]) : null;
  var old = (age !== null && age > STALE_MIN);
  return '<span class="built' + (old?' old':'') + '">Built ' + esc(shown) +
         (old ? ' &mdash; ' + Math.round(age/60) + 'h ago' : '') + '</span>';
}

/* ── sign in ──────────────────────────────────────────────────────────── */
/* ── GOOGLE SIGN-IN ────────────────────────────────────────────────────────
   Rendered fresh every time the sign-in screen is drawn, because the div it
   draws into is destroyed and recreated by every render.

   IT IS GUARDED THREE WAYS and every guard has a reason. No client ID means
   the feature was never set up, so the button is not drawn at all and the
   password stands alone. No `google` object means the library did not load —
   a slow network, a blocked CDN, an MOE device policy — and the page must not
   throw, it must quietly leave the password working. And a render that fires
   twice must not stack two buttons, hence the emptying first. */
function paintGoogle(){
  if (!GOOGLE_CLIENT_ID) return;
  var host = $('gbtn');
  if (!host) return;
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id){
    /* Try again shortly: `async defer` means the library often arrives after
       the first paint. Give up quietly after a few seconds — by then it is not
       coming, and the password below is the answer. */
    if (paintGoogle.tries === undefined) paintGoogle.tries = 0;
    if (paintGoogle.tries++ < 12) setTimeout(paintGoogle, 400);
    else host.innerHTML = '<div class="hintx">Google sign-in could not load. ' +
                          'Use the committee password below.</div>';
    return;
  }
  paintGoogle.tries = 0;
  host.innerHTML = '';
  /* BEFORE initialize(), not after. Google personalises the button — "Sign in
     as Kim" — from whichever account it decided on last, and on a shared or
     multi-account machine that card is worse than useless: it names an account
     while signing you in as a different one, which is precisely the confusion
     that made a real refusal look like a bug. Turning auto-select off up front
     means the button always reads "Sign in with Google" and always asks. */
  try { google.accounts.id.disableAutoSelect(); } catch(e){}
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
    /* No auto-select and no one-tap prompt. On a shared staffroom laptop,
       being signed in automatically as whoever used it last is precisely the
       wrong behaviour for a screen holding every student's record. */
    auto_select: false,
    cancel_on_tap_outside: true
  });
  /* text:'signin_with' is what makes it read "Sign in with Google" rather
     than "Sign in as —". Together with disableAutoSelect() above and never
     passing a login_hint, Google has nothing to personalise the BUTTON from.
     What this cannot control is Google's own account-chooser POPUP, which
     lists the accounts the browser is signed into and puts the most recent
     first — that window belongs to Google and no site can restyle or reorder
     it, which is the point of it. */
  google.accounts.id.renderButton(host, {
    theme: 'outline', size: 'large', width: 320,
    text: 'signin_with', shape: 'rectangular',
    type: 'standard', logo_alignment: 'left'
  });
}

/* Google hands back a signed token. It is sent to the server ONCE and
   exchanged for this project's own token; nothing else on the page ever sees
   it again, and it is deliberately not stored anywhere. */
/* WHICH ACCOUNT DID GOOGLE ACTUALLY HAND US? Read straight out of the token's
   middle segment, which is plain base64 JSON.

   ⚠ THIS IS NOT VERIFICATION AND MUST NEVER BE TREATED AS ANY. Anybody can
   write anything into a JWT payload; only the server's check of the signature
   means a thing. This is used for ONE purpose — telling the person on screen
   which account they were actually signed in as — and that is exactly the
   question that is impossible to answer otherwise, because Google's own bubble
   keeps showing whichever account it picked last. */
function peekEmail(jwt){
  try {
    var mid = String(jwt).split('.')[1];
    var pad = mid.replace(/-/g, '+').replace(/_/g, '/');
    while (pad.length % 4) pad += '=';
    return String(JSON.parse(atob(pad)).email || '');
  } catch (e) { return ''; }
}

/* After ANY failed sign-in, tell Google to stop auto-selecting. Without this
   the next attempt silently reuses the SAME account — so somebody who thinks
   they are picking their school account gets handed the personal one again,
   sees the same refusal, and has no way of knowing why. It is the single most
   confusing failure this screen can produce. */
function forgetGoogleChoice(){
  try { if (typeof google !== 'undefined' && google.accounts && google.accounts.id)
          google.accounts.id.disableAutoSelect(); } catch(e){}
}

function onGoogleCredential(resp){
  if (!resp || !resp.credential){ S.gerr = 'That sign-in did not complete. Try again.'; render(); return; }
  var saw = peekEmail(resp.credential);
  S.gerr = ''; S.busy = true; render();
  api('hubGoogleLogin', { credential: resp.credential }).then(function(res){
    if (!res || !res.ok){
      S.busy = false;
      /* Shown under the Google button, not in the password field's error slot.
         A message about the wrong Google account sitting beside a password box
         reads as "your password is wrong", which sends somebody hunting for
         the wrong problem. */
      /* ESCAPED HERE. The server's sentence contains the email address it was
         given, which came from a token this page did not write — so it is the
         one string in this box that must not be trusted as markup. */
      S.gerr = esc((res && res.error) || 'Could not sign in.');
      forgetGoogleChoice();
      if (saw) S.gerr += '<br><br>Google signed you in as <b>' + esc(saw) + '</b>. ' +
        'If that is not the account you meant, the chooser will appear next time &mdash; ' +
        'Google had been reusing your last choice without asking.';
      render();
      return;
    }
    TOKEN = res.token;
    /* THE NAME COMES FROM THE ACCESS TAB, not from anything typed here. */
    S.user = res.name || res.email;
    S.email = res.email || '';        // the VERIFIED address, for the header
    return loadAll().then(function(){
      S.busy = false; S.view = 'menu'; render(true);
    });
  }).catch(function(e){
    S.busy = false;
    /* ── PHONES, 4 AUGUST 2026 ───────────────────────────────────────────
       Google sign-in on this page fails reliably on a phone and works
       reliably on a laptop — including in incognito on both, which rules out
       the multi-account fault that explained the earlier desktop failures.
       The Executions log shows doPost COMPLETED each time, so the request
       arrives and the script runs; the reply is lost on the way back, and
       three attempts do not clear it.
       The cause is not established. What IS established is that the password
       below works on the same phone, so the useful thing this screen can do is
       say so plainly rather than offer a generic error and a shrug. */
    var onPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    S.gerr = 'Signing in with Google worked' + (saw ? ', as <b>' + esc(saw) + '</b>' : '') +
             ' &mdash; what follows is the Hub\'s own server. ' +
             reachErr(e, 'complete the sign-in') +
             (onPhone
               ? '<br><br><b>On a phone, this is a known fault and retrying will not help.</b> ' +
                 'Use the committee password below &mdash; it works on this device. ' +
                 'Google sign-in is reliable on a laptop.'
               : '');
    forgetGoogleChoice();
    render();
  });
}

function signIn(){
  var pw = $('pw') ? $('pw').value : '';
  var nm = $('nm') ? $('nm').value.trim() : '';
  /* Keep the name across a failed attempt. Re-rendering the screen would
     otherwise wipe it, and the second thing anybody does after mistyping a
     password is mistype it again — with their name silently gone. */
  S.name = nm;
  if (!nm){ S.err='Type your name. It goes into the record of every follow-up you make.'; render(); return; }
  if (!pw){ S.err='Type the password.'; render(); return; }
  S.busy = true; S.err = ''; render();   // label change only — see signinHtml

  api('hubLogin', { password: pw }).then(function(res){
    if (!res || !res.ok){ S.busy=false; S.err=(res&&res.error)||'Could not sign in.'; render(); return; }
    TOKEN = res.token; S.user = nm;
    return loadAll().then(function(){
      S.busy = false; S.view = 'menu'; render(true);
    });
  }).catch(function(e){
    S.busy = false;
    /* THIS CATCH ALSO SWALLOWS loadAll()'s THROW. loadAll deliberately throws
       when the snapshot comes back ok:false — a server that answered clearly
       and said no. Reporting that as an unreachable server is the same lie
       this whole block exists to stop telling, so a plain Error with a message
       is shown as itself. */
    if (e && !e.badReply && e.message && e.message !== 'Failed to fetch'){
      S.err = esc(e.message);
    } else {
      S.err = reachErr(e, 'sign in') +
        (e && e.badReply ? '' :
          ' Three things cause this: the deployment at that address no longer exists ' +
          '(check Deploy → Manage deployments — a NEW deployment issues a different ' +
          '/exec and leaves this one stranded); the page is being opened straight from ' +
          'your disk rather than from its web address; or the connection is down.');
    }
    render();
  });
}

/* ── WHY SIGNING IN USED TO TAKE SO LONG, AND WHAT WAS DONE ────────────────
   Four reads ran ONE AFTER ANOTHER and the menu waited for the last of them.
   Each is a separate round trip to Apps Script, each takes a second or three
   on its own, and two of the four are heavy: hubEarly walks the whole 📋 Log
   and hubGrooming opens a SECOND SPREADSHEET. Adding those two on 3 August
   roughly doubled a wait that was already too long — the cost was invisible
   in the code, because a chain of .then() looks the same whether the calls
   are quick or slow.

   THEN 4 AUGUST CHANGED THE ANSWER AGAIN, and this paragraph is the second
   version of it. Firing three reads at once was the right shape while the
   constraint was thought to be TIME. It was not: concurrent requests to this
   deployment break each other's redirect ticket, so three simultaneous reads
   were three chances to lose one. The fix went the other way — snapshot,
   detention and early dismissal are now ONE request, `hubAll`, which the
   server assembles and returns whole. Grooming, the slowest because it opens
   a second spreadsheet, is not fetched at sign-in at all; it waits until you
   open the area. A sign-in is two requests rather than five.

   WHAT SURVIVED FROM THE FIRST VERSION: each part of hubAll's reply is still
   judged on its own, so a broken detention tab costs you that row and not the
   menu. And a row that has not arrived still says "reading", never "could not
   be read" — those are opposite facts and null cannot tell them apart, which
   is what S.pending is for. It now tracks only the two reads that can still
   be outstanding after sign-in: early dismissals when you refresh that area,
   and grooming until you first open it. */
function loadAll(){
  return api('hubAll', { token: TOKEN }).then(function(res){
    if (!res || !res.ok) throw new Error((res && res.error) || 'The snapshot could not be read.');
    S.snap = res.snapshot;
    /* Each part is judged on its own, exactly as when they were three separate
       calls — a broken detention tab must not cost you the menu. */
    S.det   = (res.detention && res.detention.ok) ? res.detention : null;
    S.early = (res.early && res.early.ok) ? res.early : null;
    /* No `det` key: detention arrives with this same reply, so there is never
       a moment where it is outstanding. It was initialised here and reset on
       sign-out but never set true and never read — a leftover from when
       detention was its own call. Removed 4 August 2026. */
    S.pending = { early:false, groom:false };
  });
}

/* ── GROOMING IS FETCHED WHEN YOU OPEN IT, NOT AT SIGN-IN ─────────────────
   It opens a second spreadsheet, which makes it the slowest read in the
   system, and it fills one menu row that most sign-ins never look at. Moving
   it off the sign-in path makes signing in faster AND removes a whole class of
   failure from it.

   The cost, stated plainly: the menu's grooming row now shows "not read yet"
   until you open the area once. That is a fair trade for a sign-in that works
   — and it is honest, which "0" would not have been. */
function ensureGrooming(){
  if (S.groom || S.pending.groom) return Promise.resolve();
  S.pending.groom = true;
  return loadGrooming().then(function(){
    S.pending.groom = false;
    if (TOKEN && S.view !== 'signin') render();
  });
}


/* THESE TWO ARE LIVE, AND THAT IS THE WHOLE DIFFERENCE. Every other count on
   the menu comes from 📸 Snapshot, which the trigger rebuilds every ten minutes
   and which stamps its own age. hubEarly reads 📋 Log directly and hubGrooming
   reads the Grooming Tracker's own Log directly, so neither answer has an age
   to print — each is simply now. Do not give either area a builtHtml() stamp:
   it would be claiming a staleness the data does not have.

   NEITHER IS ALLOWED TO BREAK THE MENU. Both resolve rather than reject, and
   both leave null behind on failure, because the snapshot is the only read this
   Hub genuinely cannot open without. A grooming spreadsheet that will not open
   should cost you the grooming screen and nothing else. */
function loadEarly(){
  return api('hubEarly', { token: TOKEN }).then(function(r){
    S.early = (r && r.ok) ? r : null;
  }).catch(function(){ S.early = null; });
}

function loadGrooming(){
  S.groomTried = true;
  return api('hubGrooming', { token: TOKEN }).then(function(r){
    /* ok:true with connected:false is KEPT, not discarded. It carries the
       sentence explaining that the tracker has not been connected, and that
       sentence is the entire value of the reply. */
    S.groom = (r && (r.ok || r.connected !== undefined)) ? r : null;
  }).catch(function(){ S.groom = null; });
}



function signOut(){
  TOKEN=null; S.teachers=null;
  S.view='signin'; S.snap=null; S.det=null; S.sel={}; S.stamped={}; S.user=''; S.email='';
  S.early=null; S.groom=null; S.etab='term'; S.gtab='students'; S.from='';
  S.pending={ early:false, groom:false }; S.gerr='';
  /* Tell Google to forget the automatic-selection preference too. Without
     this, signing out of the Hub and signing back in silently reuses the same
     account — which on a shared laptop is the opposite of signing out. */
  try { if (typeof google !== 'undefined' && google.accounts && google.accounts.id)
          google.accounts.id.disableAutoSelect(); } catch(e){}
  S.gstu=null; S.gLoading=false; S.groomTried=false;
  S.err=''; S.first=true; S.result=null; S.name='';
  S.student=null; S.history=null; S.ask=null; S.local={}; S.holdLocal={};
  render(true);
}

/* ── navigation ───────────────────────────────────────────────────────── */
function go(v, extra){
  var moved = (S.view !== v) || !!extra;
  if (extra) for (var k in extra) S[k] = extra[k];
  S.view = v;
  render(moved);
}
window.__hubGo = go;

function openArea(key){
  var a = areaOf(key);
  if (!a) return;
  S.sel = {};
  worklist(key).forEach(function(x){ if (!isStamped(x)) S.sel[x.entryId] = true; });
  go('lc', { area:key, tab:'follow' });
}

/* ── render ───────────────────────────────────────────────────────────── */
function render(moved){
  var v = $('view');
  var keep = v.scrollTop;
  var html = '';
  if (S.view==='signin')      html = signinHtml();
  else if (S.view==='menu')   html = menuHtml();
  else if (S.view==='lc')     html = lcHtml();
  else if (S.view==='email')  html = emailHtml();
  else if (S.view==='sent')   html = sentHtml();
  else if (S.view==='student') html = studentHtml();
  else if (S.view==='early')  html = earlyHtml();
  else if (S.view==='groom')  html = groomHtml();
  else if (S.view==='soon')   html = soonHtml();
  v.innerHTML = html;
  if (moved){ v.scrollTop = 0; } else { v.scrollTop = keep; }
  wire();
  S.first = false;
}

/* screenOpen() and its `moveless` flag were removed on 4 August 2026. Nothing
   called it; render() builds every screen inline. Both branches of its ternary
   returned the empty string, and `moveless` was declared after the function
   that read it and never set true — so it had no effect even if something had
   called it. */

function signinHtml(){
  /* THE SIGN-IN SCREEN ANIMATES ONCE. Going busy is a change of button label,
     not a change of screen — replaying the entrance every time the state
     moved made a slow sign-in look like a page reloading itself. */
  return '<div class="screen centre' + (S.first ? '' : ' still') + '"><div class="wrap">' +
    '<div class="date">' + esc(todayLong()) + '</div>' +
    '<h1 class="big">SAJC Discipline Committee Hub</h1>' +
    '<div class="gap"></div>' +
    /* ── GOOGLE FIRST, PASSWORD BENEATH ───────────────────────────────
       Both are shown while the change beds in. The password is the fallback
       for the week after switching over, so that a problem with Google
       sign-in is an inconvenience rather than a committee locked out of its
       own system on a Tuesday. Once a week has passed with nobody needing
       it, the password half comes out — and the un-throttled login that
       comes with it goes too, which is the actual prize.

       THE BUTTON IS DRAWN BY GOOGLE, into the empty div below. It is not
       styled here and should not be: a sign-in button that does not look
       like Google's own is the shape of every phishing page ever built, and
       staff are trained to distrust it. */
    (GOOGLE_CLIENT_ID
      ? '<div class="gwrap">' +
          '<div id="gbtn"></div>' +
          /* NOT esc()'d, and that is deliberate — this one string is BUILT as
             HTML, with every dynamic part (the email Google returned, the
             snippet from the server) escaped at the point it goes in. Escaping
             the whole thing here printed "&mdash;" and "<b>" on screen as
             literal text, which Kim rightly read as the page being broken. */
          (S.gerr ? '<div class="note err">' + S.gerr + '</div>' : '') +
          '<div class="gor"><span>or use the committee password</span></div>' +
        '</div>'
      : '') +
    /* THE NAME AND PASSWORD NOW SIT BELOW GOOGLE, in that order, because that
       is the order somebody uses them in. The name field between the heading
       and the Google button implied it was needed for both; it is needed only
       for the password path, and a field you must skip past to reach the thing
       you actually wanted is a field in the way. */
    '<div class="field"><label>Your name</label>' +
      '<input id="nm" autocomplete="name" value="' + esc(S.name || S.user) + '">' +
      (GOOGLE_CLIENT_ID ? '<div class="hintx">Only for the password sign-in below &mdash; ' +
        'a Google sign-in takes your name from the access list.</div>' : '') + '</div>' +
    '<div class="field pw"><label>Committee password</label>' +
      '<input type="password" id="pw" autocomplete="current-password" autocapitalize="off" spellcheck="false">' +
      '<button type="button" class="peek" id="peek" aria-label="Show the password" title="Show the password">' +
        '<svg viewBox="0 0 24 24">' +
          '<path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/>' +
          '<circle cx="12" cy="12" r="3.2"/>' +
          '<path class="slash" d="M3.5 3.5l17 17"/>' +
        '</svg>' +
      '</button></div>' +
    '<div class="stack"><button id="go"' + (S.busy?' disabled':'') + '>' +
      (S.busy ? 'Logging in&hellip;' : 'Login') + '</button></div>' +
    (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') +
  '</div></div>';
}

function menuHtml(){
  /* Took a third `zero` argument until 4 August 2026 and never read it — the
     zero styling comes from `v` itself. */
  function big(v, l){
    return '<div class="mnum' + (v ? '' : ' zero') + '"><b>' + v + '</b><span>' + l + '</span></div>';
  }

  var rows = AREAS.map(function(a){
    var w = worklist(a.key).filter(function(x){ return !isStamped(x); });
    var top = w.length ? w[0].tier : 0;
    var sch = toSchedule(a.key);
    var thu = rowsFor(a.key).filter(function(x){ return x.domain==='Thursday privilege'; }).length;
    return '<div class="mrow ' + sevClass(top) + (a.built?'':' soon') + '" data-area="' + esc(a.key) + '">' +
      '<div class="mt">' + esc(a.title) +
        (a.built ? (thu ? '<em>includes ' + thu + ' Thursday privilege</em>' : '')
                 : '<em>counts are live &mdash; the screen is not built yet</em>') + '</div>' +
      big(w.length, 'to follow up') +
      big(heldIn(a.key).length, 'on hold') +
      big(sch.n, 'detention session' + (sch.n===1?'':'s') + (sch.unknown ? ' owed' : ' to schedule')) +
    '</div>';
  }).join('');

  /* EARLY DISMISSALS. NOT a snapshot area — see loadEarly. The two numbers are
     deliberately not summed: the first is students who have crossed a line and
     the second is everybody who has left early at all, and a single total would

  if (S.pending.early){
    rows += '<div class="mrow" data-area="__early"><div class="mt">Early dismissals' +

  } else {

      big(eFlag, 'over the threshold') +
      big(eAll, 'students this year') +

  }

  /* GROOMING AND ATTIRE. A read across into the other spreadsheet, so it has

  if (S.pending.groom){
    rows += '<div class="mrow" data-area="__groom"><div class="mt">Grooming and attire' +
      '<em>reading the grooming tracker&hellip;</em></div></div>';
  } else if (S.groom === null && !S.groomTried){
    /* NOT READ YET is a third state, and it is not a failure. Grooming moved
       off the sign-in path on 4 August so that a slow second spreadsheet could
       not cost you the whole menu. Saying "0" here would be a lie; saying
       "could not be read" would be a different one. */
    rows += '<div class="mrow" data-area="__groom"><div class="mt">Grooming and attire' +
      '<em>open to read the grooming tracker</em></div></div>';
  } else if (!S.groom){
    rows += '<div class="mrow" data-area="__groom"><div class="mt">Grooming and attire' +
      '<em>the grooming tracker could not be read &mdash; open it for the reason</em></div></div>';
  } else if (!S.groom.connected){
    rows += '<div class="mrow" data-area="__groom"><div class="mt">Grooming and attire' +
      '<em>not connected yet &mdash; open it to see what to paste where</em></div></div>';
  } else {
    var gFlag = (S.groom.students || []).filter(function(x){ return x.overTerm; }).length;
    rows += '<div class="mrow' + (gFlag ? ' t3' : '') + '" data-area="__groom">' +
      '<div class="mt">Grooming and attire' +
        '<em>repeat offenders, by class and by category</em></div>' +
      big(gFlag, 'over the threshold') +
      big(S.groom.openTotal || 0, 'not yet fixed') +

  }


  var det = S.det && S.det.rows ? S.det.rows.length : 0;
  rows += '<div class="mrow soon" data-area="__det"><div class="mt">Detention Sessions' +
    '<em>' + (S.det ? det + ' row' + (det===1?'':'s') + ' in 🪑 Detention &mdash; the screen is not built yet'
                    : 'could not read 🪑 Detention') + '</em></div></div>';

  var dm = allRows().filter(function(x){ return x.atDM && !isHeld(x); }).length;
  var held = allRows().filter(isHeld).length;
  rows += '<div class="mrow soon" data-area="__dm"><div class="mt">Discipline Daily Overview' +
    '<em>counts are live &mdash; the screen is not built yet</em></div>' +
    big(dm, 'to see the DM') + big(held, 'on hold across all areas') + '</div>';

  var tools = '<div class="grouplabel">Open another tool</div><div class="mgrid">' +
    TOOLS.map(function(t){
      return '<div class="mtile" data-url="' + esc(t.u) + '"><h3>' + t.t + '</h3>' +
             '<div class="ts">' + t.s + '</div></div>';
    }).join('') + '</div>';

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="date">' + esc(todayLong()) + ' ' + builtHtml() + '</div>' +
    '<h1>SAJC Discipline Committee Hub</h1>' +
    /* THE EMAIL, NOT JUST THE NAME. On a machine signed into more than one
       Google account the question that actually matters is WHICH account is
       driving this screen — and a first name cannot answer it. Where there is
       no email, the password path was used, and saying so is honest: the
       system knows somebody knew the password and nothing more. */
    '<div class="who">Signed in as ' + esc(S.user) +
      (S.email ? ' &middot; <b>' + esc(S.email) + '</b>' :
                 ' &middot; <i>committee password</i>') + '</div>' +
    '<div class="mrows">' + rows + '</div>' + tools +
    /* NO INTERVAL IN THIS SENTENCE, DELIBERATELY. It said "rebuilds hourly"
       until 4 August 2026, when the trigger had run every ten minutes for as
       long as it had existed. Naming a number here means a Config change has
       to remember to come and edit a string in a different file, and it will
       not — that is how the wrong number got here. The snapshot stamps its own
       age on the rows above; that stamp is always true, and this line points
       at it instead. It also still named "early dismissal follow-up", an area
       shelved on 3 August, and did not mention grooming, which is also live. */
    '<div class="foot"><span>Counts come from the snapshot, which is rebuilt on a timer &mdash; ' +
    'each area says how old its figures are. Early dismissals and grooming are read live. ' +
    'Nothing is locked &mdash; every area opens for anyone.</span>' +
    '<span class="sp"></span><button class="plain" id="out">Sign out</button></div>' +
  '</div></div>';
}
