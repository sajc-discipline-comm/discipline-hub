    (S.ask ? askHtml() :
      '<div class="stack rowwise">' +
        '<button class="ghost" id="hold">' +
          (heldNow(x) ? 'Release the hold on ' + esc(x.domain) : 'Hold follow-up for ' + esc(x.domain)) +
        '</button>' +
      '</div>') +

    '<div class="grouplabel">Everything recorded in ' +
      (S.history ? esc(S.history.academicYear) : 'the academic year') +
      ', by type</div>' +
    '<div class="note">This is the whole academic year, not this term &mdash; the term ' +
      'subtotals under each heading are what the figures above are built from. ' +
      'Statuses the school does not hold against a student, such as a medical certificate, ' +
      'are listed for context and marked as not counting.</div>' +
    timelineHtml() +
    ladderTableHtml(x) +
    '<div class="foot"><span>Excusing an offence never edits what was recorded. The row stays; ' +
      'its state changes, with who decided and why.</span></div>' +
  '</div></div>';
}

/* ── the daily email ──────────────────────────────────────────────────── */
function picked(){
  return worklist(S.area).filter(function(x){ return S.sel[x.entryId] && !isStamped(x); });
}

/* THE EMAIL IS TWO DIFFERENT SENTENCES, so it is two different blocks.
   A Thursday privilege row counts DISTINCT THURSDAYS, not lates, and its
   action belongs to the DM rather than the form teacher. Putting it in the
   table of lates produced a second row for the same student saying "3" when
   the row above said "5" — in a message going to sixty form teachers. */
function pickedLates(){ return picked().filter(function(x){ return x.domain !== 'Thursday privilege'; }); }
function pickedThu(){   return picked().filter(function(x){ return x.domain === 'Thursday privilege'; }); }

function recipients(){
  var out = [], seen = {}, absent = [], noIds = [], unresolved = [], noClass = [];
  if (!S.teachers) return { list:[], absent:[], noIds:[], unresolved:[], noClass:[], ready:false };
  picked().forEach(function(x){
    var k = String(x.cls||'').trim().toUpperCase();      // C returns UPPERCASE keys
    /* A student with no class is not a class with no teachers. Reporting it as
       "no teachers listed for ''" was how a blank cell in the Log turned into
       an accusation about the Master. */
    if (!k){ if (noClass.indexOf(x.name)<0) noClass.push(x.name); return; }
    var t = S.teachers.byClass ? S.teachers.byClass[k] : undefined;
    /* THREE DIFFERENT FAULTS, THREE DIFFERENT SENTENCES. C is careful to
       return the key with an empty array when a class exists but has nobody,
       precisely so these can be told apart — collapsing them back into one
       "no teachers listed" threw that away and sent somebody looking in the
       wrong tab. */
    if (t === undefined){ if (absent.indexOf(k)<0) absent.push(k); return; }   // not in Class Allocations
    if (!t.length){
      var u = S.teachers.unresolvedByClass && S.teachers.unresolvedByClass[k];
      if (u && u.length){ if (unresolved.indexOf(k)<0) unresolved.push(k); }   // IDs there, none Active
      else if (noIds.indexOf(k)<0) noIds.push(k);                              // the class is there, the IDs are not
      return;
    }
    t.forEach(function(p){
      var e = String(p.email||'').trim().toLowerCase();
      if (!e || seen[e]) return;
      seen[e] = 1; out.push(p);
    });
  });
  return { list:out, absent:absent, noIds:noIds, unresolved:unresolved, noClass:noClass, ready:true };
}

/* WHAT THE MASTER ACTUALLY SENT BACK, on demand. "No teachers listed for
   26S04" says a fact without saying which side of the join is wrong: the
   class the Hub asked for, or the classes the Master holds. This shows both
   lists side by side so the mismatch is visible rather than deduced. */
function diagHtml(){
  if (!S.diag) return '<div class="stack rowwise" style="margin-top:10px">' +
    '<button class="plain" id="showdiag">Why? Show what the Master sent back</button></div>';

  var need = {}, blank = [];
  picked().forEach(function(x){
    var k = String(x.cls||'').trim().toUpperCase();
    if (k) need[k] = 1; else blank.push(x.name);
  });
  var needList = Object.keys(need).sort();
  var by = (S.teachers && S.teachers.byClass) || {};
  var have = Object.keys(by).sort();
  var withT = have.filter(function(c){ return by[c] && by[c].length; });
  var emptyT = have.filter(function(c){ return !by[c] || !by[c].length; });

  function state(c){
    if (by[c] === undefined) return 'bad';
    return (by[c] && by[c].length) ? 'ok' : 'warn';
  }

  /* WHICH CLASSES HAVE TEACHERS AND WHICH DO NOT is the single most useful
     line here: if every class with teachers is one intake year and every
     class without is the other, the fault is one tab, not fifteen rows. */
  /* Round 4's counts, when the deployment has them. Three numbers that say
     which of three conversations to have — far better than anything the Hub
     can infer from an empty map. */
  var c = S.teachers && S.teachers.counts;
  var src = S.teachers && S.teachers.source;
  var notes = (S.teachers && S.teachers.notes) || [];

  var why;
  if (c && !c.teachersActive){
    why = 'The Teachers tab was read and yielded <b>no Active rows at all</b> ' +
          '(' + c.classes + ' classes found). The <b>Status</b> column must read exactly ' +
          '<b>Active</b> — that is the whole filter.';
  } else if (c && c.teachersActive && !c.withTeachers){
    why = 'The teacher list is fine &mdash; <b>' + c.teachersActive + ' Active teachers</b> &mdash; ' +
          'and <b>' + c.classes + ' classes</b> were found, but <b>not one of them has a teacher</b>. ' +
          'That is one fault, not ' + c.classes + '. It is the <b>CT 1 / CT 2 / CTA 1 / CTA 2</b> ' +
          'columns of Class Allocations.';
  } else if (c && !c.classes){
    why = 'Class Allocations was found but is <b>empty</b> &mdash; no rows yielding a class code.';
  } else if (!have.length){
    /* Confirmed against readClassTeachers_ on 2 August: it filters on NOTHING.
       No year, no cohort, no status on the class row. It opens a tab named
       exactly 'Class Allocations', reads the class code from column B, and
       returns what it finds. An empty map therefore means it never found the
       tab — and a tab it cannot find is skipped in silence. */
    why = 'The reply carried <b>no classes at all</b>, and the Master itself opened fine. ' +
          'The tracker looks for a tab named <b>exactly “Class Allocations”</b> and reads the ' +
          'class code from <b>column B</b>. If the tab is named anything else &mdash; an emoji ' +
          'prefix, a trailing space, “Class Allocation” singular &mdash; it is skipped without ' +
          'an error. <b>Check the tab name letter for letter</b>, and that “Teachers” is spelled ' +
          'exactly that too.';
  } else if (!withT.length){
    why = 'The Master returned <b>' + have.length + ' classes and not one of them has a teacher</b>. ' +
          'That is not fifteen bad rows &mdash; it is one thing wrong once. Check the <b>CT 1 / CT 2 / ' +
          'CTA 1 / CTA 2</b> column headings in Class Allocations, and that the cells hold <b>Teacher IDs</b> ' +
          '(T-0042) rather than names.';
  } else if (needList.filter(function(c){ return by[c] === undefined; }).length){
    why = 'The Master holds ' + have.length + ' classes but not these ones. Check that the class code in ' +
          'Class Allocations matches the code on the Log row exactly &mdash; a trailing space or a ' +
          'different prefix is enough.';
  } else if (needList.filter(function(c){ return state(c) === 'warn'; }).length){
    why = '<b>' + withT.length + ' of the Master\'s ' + have.length + ' classes do have teachers</b>, ' +
          'so the tab and the columns are being read correctly &mdash; these particular classes have ' +
          'empty CT cells. If the ones that work are all one intake year and the ones that do not are ' +
          'the other, only one intake has been filled in.';
  } else {
    why = 'Every class in this email has teachers. If addresses are still missing, those Teacher IDs ' +
          'have no <b>Active</b> row in the Teachers tab.';
  }

  return '<div class="diag">' +
    '<div class="drow"><b>Classes in today\'s email</b><div>' +
      needList.map(function(c){
        return '<span class="dchip ' + state(c) + '">' + esc(c) + '</span>';
      }).join('') + (blank.length ? '<span class="dchip bad">no class recorded ×' + blank.length + '</span>' : '') +
    '</div></div>' +
    '<div class="drow"><b>The Master returned</b><div>' +
      (have.length
        ? '<div class="dline"><span class="dchip ok">' + withT.length + '</span> with teachers' +
          (withT.length ? ' &mdash; ' + esc(withT.slice(0,10).join(', ')) +
             (withT.length>10 ? ' +' + (withT.length-10) + ' more' : '') : '') + '</div>' +
          '<div class="dline"><span class="dchip warn">' + emptyT.length + '</span> with none' +
          (emptyT.length ? ' &mdash; ' + esc(emptyT.slice(0,10).join(', ')) +
             (emptyT.length>10 ? ' +' + (emptyT.length-10) + ' more' : '') : '') + '</div>'
        : '<i>no classes at all</i>') +
    '</div></div>' +
    (c ? '<div class="drow"><b>What the server counted</b><div>' +
      '<span class="dchip ' + (c.classes ? 'ok' : 'bad') + '">' + c.classes + '</span> classes &nbsp; ' +
      '<span class="dchip ' + (c.withTeachers ? 'ok' : 'warn') + '">' + c.withTeachers + '</span> with a teacher &nbsp; ' +
      '<span class="dchip ' + (c.teachersActive ? 'ok' : 'bad') + '">' + c.teachersActive + '</span> Active teachers' +
      (src ? '<div class="dline">Read from <b>' + esc(src.classAllocations || '?') + '</b> and <b>' +
             esc(src.teachers || '?') + '</b></div>' : '') +
    '</div></div>' : '') +
    (notes.length ? '<div class="drow"><b>The server also noted</b><div>' +
      notes.map(function(n){ return '<div class="dline">' + esc(n) + '</div>'; }).join('') +
    '</div></div>' : '') +
    '<div class="drow"><b>What that means</b><div class="dwhy">' + why + '</div></div>' +
    '<div class="stack rowwise" style="margin-top:10px">' +
      '<button class="plain" id="hidediag">Hide</button></div>' +
  '</div>';
}

function emailBody(){
  var rows = pickedLates(), thu = pickedThu();
  var lines = ['Dear Form Teachers,', ''];

  if (rows.length){
    var lo = Math.min.apply(null, rows.map(function(x){ return x.term; }));
    var hi = Math.max.apply(null, rows.map(function(x){ return x.term; }));
    lines.push('The following students have been late ' +
      (lo === hi ? 'on ' + lo + ' occasions' : 'on ' + lo + ' to ' + hi + ' occasions') +
      ' this term. Please follow up accordingly.');
    lines.push('');
    rows.forEach(function(x){
      lines.push(x.name + '  |  ' + x.cls + '  |  ' + x.term + ' this term (' + x.year + ' this year)' +
                 '  |  Tier ' + x.tier);
      lines.push('    Dates: ' + (shortDates(x.dates) || '—'));
      lines.push('    ' + x.action);
      lines.push('');
    });
  }

  if (thu.length){
    lines.push('THURSDAY PRIVILEGE');
    lines.push(THU_PARA + ' This is counted in Thursdays, not in lates.');
    lines.push('');
    thu.forEach(function(x){
      lines.push(x.name + '  |  ' + x.cls + '  |  ' + x.term + ' separate Thursdays' +
                 '  |  Thursday privilege removed');
      lines.push('    Thursdays: ' + (shortDates(x.dates) || '—'));
    });
    lines.push('');
  }

  lines.push('Thank you,');
  lines.push(S.user);
  lines.push('Discipline Committee');
  return lines.join('\n');
}

function emailHtml(){
  var rows = pickedLates(), thu = pickedThu(), all = picked();
  var r = recipients();
  var subject = 'Latecoming follow-up — ' + areaOf(S.area).title + ' — ' + todayLong();

  var warn = '';
  if (S.tLoading){
    warn = '<div class="loading"><div class="spin"></div><div>' +
      '<b>Reading the class teachers&hellip;</b>' +
      '<span>From the Master Database, so the email can be addressed.</span></div></div>';
  }
  else if (S.tErr){
    /* The server's own sentence, then what to do about it. Never a silent
       fall-back to an empty list. */
    warn = '<div class="note err"><b>The class teachers could not be read.</b> ' +
      esc(S.tErr) + '<div class="stack rowwise" style="margin-top:12px">' +
      '<button class="ghost sm" id="retryteach">Try again</button>' +
      '<span class="hintx">You can still copy the message and address it by hand.</span>' +
      '</div></div>';
  }
  else if (!r.ready){ warn = ''; }
  else {
    if (r.noClass.length)
      warn += '<div class="note err"><b>' + esc(r.noClass.join(', ')) +
              (r.noClass.length===1 ? ' has' : ' have') + ' no class on the Log row</b>, so there is ' +
              'nobody to address about ' + (r.noClass.length===1?'them':'them') + '. ' +
              'That is a gap in the record rather than a gap in the Master.</div>';
    if (r.absent.length)
      warn += '<div class="note warn"><b>' + esc(r.absent.join(', ')) +
              (r.absent.length===1 ? ' is' : ' are') + ' not in the Master Database\'s ' +
              'Class Allocations at all.</b> Either the class is missing from that tab, or its ' +
              'code there does not match the code on the Log row &mdash; a trailing space is enough.' +
              diagHtml() + '</div>';
    if (r.noIds.length)
      warn += '<div class="note warn"><b>' + esc(r.noIds.join(', ')) +
              (r.noIds.length===1 ? ' is' : ' are') + ' in Class Allocations, but with ' +
              '<u>no Teacher IDs</u> against ' + (r.noIds.length===1?'it':'them') + '.</b> ' +
              'The Master opened and returned the ' + (r.noIds.length===1?'class':'classes') +
              ' &mdash; columns <b>F to I</b> of Class Allocations are empty on those rows. ' +
              'Run <b>📋 Attendance → 🔍 Check for problems</b>, which counts the class teachers ' +
              'it can see.' + diagHtml() + '</div>';
    if (r.unresolved.length)
      warn += '<div class="note err"><b>' + esc(r.unresolved.join(', ')) +
              ' has teachers assigned who are not Active in the Master.</b> ' +
              'That is a data error somebody should fix &mdash; it is not a class without form teachers.</div>';
  }

  var addr = r.list.map(function(p){ return p.email; }).join('; ');

  /* ONE TABLE SHAPE FOR BOTH BLOCKS. Student, Class, a right-aligned count,
     a chip, then the dates — so the two halves of the message read as one
     message rather than two things stapled together. */
  var table = rows.length
    ? '<p>The following students have been late this term. Please follow up accordingly.</p>' +
      '<table class="etbl"><thead><tr><th>Student</th><th>Class</th><th class="n">This term</th>' +
      '<th class="n">This year</th><th class="c">Tier</th><th>Dates</th></tr></thead><tbody>' +
      rows.map(function(x){
        return '<tr class="' + sevClass(x.tier) + '"><td>' + esc(x.name) + '</td><td>' + esc(x.cls) + '</td>' +
          '<td class="n">' + x.term + '</td><td class="n">' + x.year + '</td>' +
          '<td class="c"><span class="chip ' + sevClass(x.tier) + '">Tier ' + x.tier + '</span></td>' +
          '<td>' + esc(shortDates(x.dates) || '—') + '</td></tr>';
      }).join('') + '</tbody></table>'
    : '';

  var thuBlock = thu.length
    ? '<h3>Thursday privilege</h3>' +
      '<p>' + THU_PARA + ' <b>This is counted in Thursdays, not in lates.</b></p>' +
      '<table class="etbl"><thead><tr><th>Student</th><th>Class</th><th class="n">Thursdays</th>' +
      '<th class="c">Outcome</th><th>Dates</th></tr></thead><tbody>' +
      thu.map(function(x){
        return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.cls) + '</td>' +
               '<td class="n">' + x.term + '</td>' +
               '<td class="c"><span class="chip none">Privilege removed</span></td>' +
               '<td>' + esc(shortDates(x.dates) || '—') + '</td></tr>';
      }).join('') + '</tbody></table>'
    : '';

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="appbar"><a data-go="lc">&larr; ' + esc(areaOf(S.area).title) + '</a></div>' +
    '<h1>Today\'s email</h1>' +
    '<div class="who">' + rows.length + ' late student' + (rows.length===1?'':'s') +
      (thu.length ? ', ' + thu.length + ' Thursday privilege' : '') + ', ' +
      r.list.length + ' recipient' + (r.list.length===1?'':'s') + '.</div>' +
    warn +
    '<div class="mailto"><div><b>To</b> ' + esc(r.list.map(function(p){
        return (p.honorific? p.honorific+' ':'') + p.name; }).join(', ') || '—') + '</div>' +
      '<div><b>Subject</b> ' + esc(subject) + '</div>' +
      '<div class="addr">' + esc(addr || 'no addresses') + '</div></div>' +
    '<div class="stack rowwise">' +
      '<button id="copyaddr" class="ghost sm">Copy the addresses</button>' +
      '<button id="copybody" class="ghost sm">Copy the message</button>' +
      '<button id="outlook">Open Outlook and copy the message</button>' +
    '</div>' +
    '<div class="mailbox"><p>Dear Form Teachers,</p>' +
      table + thuBlock + (rows.length ? legendHtml(S.area) : '') + '</div>' +
    '<div class="note q"><b>Copying records nothing.</b> The follow-up is only written down when ' +
      'you confirm below that the email has actually gone.</div>' +
    '<div class="stack rowwise">' +
      '<button id="record"' + (S.busy?' disabled':'') + '>' +
        (S.busy ? 'Recording&hellip;' : 'Yes, I have sent it &mdash; record all ' + all.length) + '</button>' +
      '<button class="plain" data-go="lc">Not yet</button>' +
    '</div>' +
    (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') +
  '</div></div>';
}

/* ── the write ────────────────────────────────────────────────────────── */
function record(){
  var rows = picked();
  if (!rows.length) return;
  S.busy = true; S.err=''; render();

  /* actionTaken is always sent, and it is the tier's own wording — so the
     record says what was asked of the form teacher, not merely that somebody
     was emailed. One batch, one sentence, because one email covers them all. */
  var action = 'Daily latecoming email to form teachers — ' + areaOf(S.area).title;

  api('hubStamp', {
    token: TOKEN,
    entryIds: rows.map(function(x){ return x.entryId; }),
    by: S.user,
    actionTaken: action
  }).then(function(res){
    S.busy = false;
    if (!res || !res.ok){ S.err = (res && res.error) || 'Nothing was recorded.'; render(); return; }
    /* OPTIMISTIC. The snapshot will not know about this until the next hourly
       rebuild, so the screen carries the change itself and says so. */
    rows.forEach(function(x){ S.stamped[x.entryId] = { by:S.user }; });
    S.sel = {};
    S.result = { stamped: Number(res.stamped)||0, already: Number(res.alreadyDone)||0, total: rows.length };
    go('sent');
  }).catch(function(){
    S.busy = false; S.err = 'Could not reach the server. Nothing was recorded — try again.'; render();
  });
}

/* The two other writes this screen owns. Both record A DECISION SOMEBODY TOOK,
   never an edit to what happened. */
function doAsk(){
  var a = S.ask, r = $('reason') ? $('reason').value.trim() : '';
  if (a.kind !== 'unhold' && !r){
    S.err = 'A reason is required. Without one the record is indistinguishable from a mistake ' +
            'when somebody reads it back in a year.';
    render(); return;
  }
  S.busy = true; S.err = ''; render();

  var call, body = { token: TOKEN, by: S.user };
  if (a.kind === 'overturn'){ call='hubOverturn'; body.entryId = a.entryId; body.reason = r; }
  else { call = (a.kind==='hold') ? 'hubHold' : 'hubUnhold';
         body.studentId = S.student.id; body.domain = S.student.domain;
         if (r) body.reason = r; }

  api(call, body).then(function(res){
    S.busy = false;
    if (!res || !res.ok){ S.err = (res && res.error) || 'Nothing was recorded.'; render(); return; }
    if (a.kind === 'overturn') S.local[a.entryId] = 'Overturned';
    else S.holdLocal[S.student.id + '|' + S.student.domain] = (a.kind==='hold') ? 'Held' : 'Open';
    S.ask = null; render();
  }).catch(function(){
    S.busy = false; S.err = 'Could not reach the server. Nothing was recorded — try again.'; render();
  });
}

function sentHtml(){
  var r = S.result || { stamped:0, already:0, total:0 };
  var head = r.stamped + ' recorded.';
  var extra = '';
  if (r.already){
    /* NOT an error. Somebody else got there first, which is a real thing that
       happens when two people work the same list, and the screen should say
       which rather than swallowing it. */
    extra = '<div class="note warn"><b>' + r.already + ' of them ' + (r.already===1?'was':'were') +
      ' already followed up</b> before you sent this &mdash; somebody else had stamped ' +
      (r.already===1?'it':'them') + '. Nothing was overwritten, and ' +
      (r.already===1?'that student is':'those students are') + ' still in your email.</div>';
  }
  return '<div class="screen centre"><div class="wrap">' +
    '<div class="date">' + esc(todayLong()) + '</div>' +
    '<h1 class="big">' + esc(head) + '</h1>' +
    '<div class="lede">Written on the offence that reached the tier &mdash; ' +
      'the date, your name, and what the tier asked for. ' +
      'The counts on the previous screen are still from the last snapshot; ' +
      'they catch up at the next hourly rebuild.</div>' + extra +
    '<div class="stack">' +
      '<button data-go="lc">Back to ' + esc(areaOf(S.area).title) + '</button>' +
      '<button class="ghost" data-go="menu">All areas</button>' +
    '</div>' +
  '</div></div>';
}

/* ── clipboard and Outlook ────────────────────────────────────────────── */
function copy(text, btn){
  var done = function(){ if (btn){ var t=btn.textContent; btn.textContent='Copied';
      setTimeout(function(){ btn.textContent=t; }, 1400); } };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

/* ONE BUTTON, TWO THINGS. Outlook opens with the recipients and the subject
   filled in; the body goes on the clipboard, because a mailto: long enough to
   carry a table is not reliable anywhere. Click, Ctrl+V, send. */
function openOutlook(){
  var r = recipients();
  var subject = 'Latecoming follow-up — ' + areaOf(S.area).title + ' — ' + todayLong();
  copy(emailBody(), $('outlook'));
  var to = r.list.map(function(p){ return p.email; }).join(';');
  var url = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject);
  window.__hubMailto = url;
  /* An anchor rather than location.href: a mailto: assignment can leave the
     page in a half-navigated state in some builds, and an anchor click is
     what every mail-handler expects. */
  var a = document.createElement('a');
  a.href = url; a.style.display = 'none';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ── wiring ───────────────────────────────────────────────────────────── */
function wire(){
  var v = $('view');

  if ($('go')) $('go').addEventListener('click', signIn);
  if ($('pw')) $('pw').addEventListener('keydown', function(e){ if (e.key==='Enter') signIn(); });
  if ($('nm')) { if (S.name) { if ($('pw')) $('pw').focus(); } else $('nm').focus(); }
  if ($('out')) $('out').addEventListener('click', signOut);

  if ($('mail')) $('mail').addEventListener('click', function(){
    go('email');
    if (!S.teachers) loadTeachers();
  });
  if ($('all')) $('all').addEventListener('click', function(){
    worklist(S.area).forEach(function(x){ if (!isStamped(x)) S.sel[x.entryId]=true; }); render();
  });
  if ($('none')) $('none').addEventListener('click', function(){ S.sel={}; render(); });
  if ($('record')) $('record').addEventListener('click', record);
  if ($('hold')) $('hold').addEventListener('click', function(){
    S.ask = { kind: heldNow(S.student) ? 'unhold' : 'hold' }; S.err=''; render();
  });
  if ($('doask')) $('doask').addEventListener('click', doAsk);
  if ($('cancelask')) $('cancelask').addEventListener('click', function(){ S.ask=null; S.err=''; render(); });
  if ($('reason')) $('reason').focus();
  if ($('copyaddr')) $('copyaddr').addEventListener('click', function(){
    copy(recipients().list.map(function(p){ return p.email; }).join('; '), this); });
  if ($('copybody')) $('copybody').addEventListener('click', function(){ copy(emailBody(), this); });
  if ($('retryteach')) $('retryteach').addEventListener('click', loadTeachers);
  if ($('showdiag')) $('showdiag').addEventListener('click', function(){ S.diag = true; render(); });
  if ($('hidediag')) $('hidediag').addEventListener('click', function(){ S.diag = false; render(); });
  if ($('outlook')) $('outlook').addEventListener('click', openOutlook);

  v.onclick = function(e){
    var t = e.target;
    var nav = t.closest && t.closest('[data-go]');
    if (nav){ go(nav.getAttribute('data-go')); return; }

    var tab = t.closest && t.closest('[data-tab]');
    if (tab){ S.tab = tab.getAttribute('data-tab'); render(); return; }

    var tool = t.closest && t.closest('[data-url]');
    if (tool){
      var u = tool.getAttribute('data-url');
      if (u) window.open(u, '_blank', 'noopener');
      return;
    }

    var opn = t.closest && t.closest('[data-open]');
    if (opn){ e.stopPropagation(); openStudent(opn.getAttribute('data-open')); return; }

    var exc = t.closest && t.closest('[data-excuse]');
    if (exc){ S.ask = { kind:'overturn', entryId: exc.getAttribute('data-excuse') }; S.err=''; render(); return; }

    var pick = t.closest && t.closest('[data-pick]');
    if (pick){
      var id = pick.getAttribute('data-pick');
      /* IN PLACE — the row she just clicked must not make the page move. */
      if (S.sel[id]) delete S.sel[id]; else S.sel[id] = true;
      pick.classList.toggle('sel', !!S.sel[id]);
      var b = pick.querySelector('.badge');
      var n = Array.prototype.indexOf.call(pick.parentNode.children, pick) + 1;
      if (b) b.innerHTML = S.sel[id] ? '&#10003;' : String(n);
      var mail = $('mail');
      if (mail){
        var c = picked().length;
        mail.disabled = !c;
        mail.innerHTML = 'Write today\'s email &mdash; ' + c + ' student' + (c===1?'':'s');
      }
      return;
    }

    var area = t.closest && t.closest('[data-area]');
    if (area){
      var key = area.getAttribute('data-area');
      var a = areaOf(key);
      if (a && a.built) openArea(key); else go('soon');
      return;
    }
  };
}

/* Teacher addresses arrive only when an email is being written, and are held

   build degraded a failed read into an empty map, which the screen then
   reported as "no teachers listed for 26S04" — blaming the class for the
   server's problem, and giving nobody anything to act on. */
function loadTeachers(){
  S.tLoading = true; S.tErr = ''; render();
  return api('hubTeachers', { token: TOKEN }).then(function(res){
    S.tLoading = false;
    if (res && res.ok){
      S.teachers = { byClass: res.byClass || {}, unresolvedByClass: res.unresolvedByClass || {},
                     /* Round 4. Absent on an older deployment — everything below
                        degrades to the counts the Hub can work out for itself. */
                     counts: res.counts || null, source: res.source || null,
                     notes: res.notes || [] };
      S.tErr = '';
    } else {
      S.teachers = null;
      S.tErr = (res && res.error) || 'The class teachers could not be read.';
    }
    render();
  }).catch(function(){
    S.tLoading = false; S.teachers = null;
    S.tErr = 'Could not reach the server to read the class teachers.';
    render();
  });
}
