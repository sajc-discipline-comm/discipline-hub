function lcRow(x, i){
  var n = i + 1;
  if (isStamped(x)){
    var st = S.stamped[x.entryId];
    return '<div class="row done flat"><div class="badge">' + n + '</div>' +
      '<div class="body"><div class="p">' + esc(x.name) + '</div>' +
      '<div class="meta">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) + '</div>' +
      '<div class="s">CT emailed today by ' + esc(st.by) +
        ' &mdash; drops off this list at the next rebuild</div></div>' +
      statHtml(x) + '<div class="tierslot"><span class="tag ok">Done</span></div>' +
      goHtml(x) + '</div>';
  }
  var cls = sevClass(x.tier);
  var thu = (x.domain === 'Thursday privilege');
  return '<div class="row ' + cls + (S.sel[x.entryId]?' sel':'') + '" data-pick="' + esc(x.entryId) + '">' +
    '<div class="badge">' + (S.sel[x.entryId] ? '&#10003;' : n) + '</div>' +
    '<div class="body"><div class="p">' + esc(x.name) + '</div>' +
    '<div class="meta">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) +
      (thu ? ' <span class="tag thu">Thursday privilege</span>' : '') + '</div>' +
    '<div class="s">' + lineFor(x) + '</div></div>' +
    statHtml(x) +
    '<div class="tierslot"><span class="tag ' + (thu ? 'quiet' : cls) + '">' +
      /* A one-rung ladder has no tiers to compare, so a "Tier 1" beside a
         count of 3 Thursdays reads as a contradiction. Name the thing. */
      (thu ? 'Privilege removal' : 'Tier ' + x.tier) + '</span>' +
      '<div class="d">' + esc(x.action) + '</div></div>' +
    goHtml(x) + '</div>';
}

/* THE WAY INTO THE STUDENT. A word sitting inside every row was noise on a
   list you read forty times a morning, so it is a chevron at the edge that
   grows its label on hover.

   It is NOT hover-only. The chevron is always there and always clickable —
   a route that only exists once you happen to point at it does not exist on
   a touchscreen, and this is the only way to reach the student page. Hover
   reveals the WORD, not the target. */
function goHtml(x){
  return '<div class="rowgo opn" data-open="' + esc(x.entryId) + '" title="Open ' + esc(x.name) + '">' +
    '<span class="lbl">Open</span><span class="chev">&rarr;</span></div>';
}

/* One sentence per row, in the vocabulary of its own ladder. "7th latecoming
   offence" is right for lates and wrong for everything else — an absence is
   not an offence you commit a seventh time, it is a count that has reached a
   threshold. */
function lineFor(x){
  if (x.domain === 'Thursday privilege')
    return esc(x.term) + ' separate Thursdays &mdash; latest <b>' + esc(longish(x.last)) + '</b>';
  if (x.domain === 'Latecoming')
    return ordinal(x.term) + ' latecoming offence on <b>' + esc(longish(x.last)) + '</b>';
  return esc(x.term) + ' &times; <b>' + esc(x.domain) + '</b> this term &mdash; latest ' +
         esc(longish(x.last));
}

function heldRow(x){
  return '<div class="row flat"><div class="badge">&#9208;</div>' +
    '<div class="body"><div class="p">' + esc(x.name) + '</div>' +
    '<div class="meta">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) + '</div>' +
    '<div class="s">On hold since ' + esc(x.heldOn) + ' by ' + esc(x.heldBy) +
      (x.heldWhy ? ' &mdash; ' + esc(x.heldWhy) : '') +
      '</div></div>' +
    statHtml(x) + '<div class="tierslot"><span class="tag quiet">On hold</span></div>' +
    goHtml(x) + '</div>';
}

function statHtml(x){
  return '<div class="stats">' +
    '<div class="stat"><div class="k">This term</div><div class="v">' + x.term + '</div></div>' +
    '<div class="stat"><div class="k">This year</div><div class="v">' + x.year + '</div></div></div>';
}

/* The ladder, as it reads today, straight from 🪜 Ladders. */
function laddersFor(domain){
  return ((S.snap && S.snap.ladders) || []).filter(function(l){
    return String(l.ladder || l.domain || '').trim() === domain;
  }).sort(function(a,b){ return (Number(a.tier)||0) - (Number(b.tier)||0); });
}
/* THE LEGEND IS PER LADDER, and an area can hold two. Printing latecoming's
   tiers under a table of absences was the bug this replaces — it said, in an
   email to form teachers, that tier 5 means something it does not. */
function legendFor(domain){
  var L = laddersFor(domain);
  if (!L.length) return '';
  return '<div class="legend"><div class="lt">' + esc(domain) +
      ' &mdash; what each tier means, as 🪜 Ladders reads today</div>' +
    L.map(function(l){
      var t = Number(l.tier)||0;
      return '<div class="li"><b class="' + sevClass(t) + '">Tier ' + t + '</b>' +
        '<span>' + esc(l.action || '') + '</span></div>';
    }).join('') + '</div>';
}
function legendHtml(key){
  return domainsIn(key).filter(function(d){ return d !== 'Thursday privilege'; })
    .map(legendFor).join('');
}

/* ── one student ──────────────────────────────────────────────────────── */
/* Opened from any row in a worklist. It exists because the list can only ever
   say WHAT the count is, and the question somebody actually has at the point
   of following up is WHY — which dates, was one of them already excused, and
   is there a reason not to count one of them at all. */
function openStudent(entryId){
  var x = null;
  allRows().forEach(function(r){ if (r.entryId === entryId) x = r; });
  if (!x) return;
  /* THE ROW YOU CLICKED IS NOT THE STUDENT. A student can sit on more than one
     ladder at once, and each ladder counts a DIFFERENT THING — 9 lates this
     term and 3 distinct Thursdays are the same person, correctly, and taking
     the headline figure from whichever row happened to be clicked made the
     student page contradict the list it was opened from. */
  S.student = x; S.history = null; S.hErr = ''; S.ask = null;
  /* Set BEFORE the screen is drawn. Otherwise the first paint has no history
     and no reason given for not having one, and a slow read looks like a
     broken page rather than a page that is working. */
  S.hLoading = true;
  go('student');
  /* ── ONE AT A TIME, NOT BOTH AT ONCE ─────────────────────────────────
     These two used to fire together. Measured on 4 August: requests to this
     deployment succeed 100% of the time when nothing else is talking to it,
     and start failing as soon as anything is — 93% with two devices, 80% with
     two devices both running pairs. Concurrency is the fault, not the device
     and not the network.
     So the grooming read waits for the history read. It costs a second on a
     screen nobody is racing through, and it removes the last place in the Hub
     where two requests are deliberately in flight at once. */
  loadHistory(x.id).then(function(){
    loadGroomingStudent({ id: x.id, name: x.name, cls: x.cls });
  });
}

/* Every snapshot row for this student, worst ladder first. */
function laddersOfStudent(){
  if (!S.student) return [];
  return allRows().filter(function(r){ return r.id === S.student.id; })
    .sort(function(a,b){ return (b.tier - a.tier) || String(a.domain).localeCompare(String(b.domain)); });
}

/* The grooming read for one student. Resolves rather than rejects and leaves
   null behind on failure — a grooming spreadsheet that will not open should
   cost you one section of this page and nothing else on it. */
function loadGroomingStudent(x){
  S.gLoading = true; S.gstu = null;
  return api('hubGroomingStudent', { token: TOKEN, studentId: x.id, name: x.name, cls: x.cls })
    .then(function(r){
      S.gLoading = false;
      S.gstu = (r && (r.ok || r.connected !== undefined)) ? r : null;
      /* Only redraw if the person is still on this student. A slow read that
         lands after they have gone back to the list must not repaint. */
      if (TOKEN && S.view === 'student') render();
    })
    .catch(function(){
      S.gLoading = false; S.gstu = null;
      if (TOKEN && S.view === 'student') render();
    });
}

/* RETURNS ITS PROMISE, so the grooming read can wait for it — see openStudent.
   It did not, and the first version of that chain called .then() on undefined
   and threw. Caught by the test harness rather than by Kim, which is the whole
   argument for having one. */
function loadHistory(id){
  S.hLoading = true;
  return api('hubHistory', { token: TOKEN, studentId: id }).then(function(res){
    S.hLoading = false;
    if (!res || !res.ok){ S.hErr = (res && res.error) || 'The history could not be read.'; render(); return; }
    S.history = res; render();
  }).catch(function(){
    S.hLoading = false; S.hErr = 'Could not reach the server.'; render();
  });
}

/* Which statuses count towards a ladder, read from ⚙️ Statuses via
   hubSnapshot rather than assumed here. A(MC) is recorded and does not count;
   so is an Awards or Official early release. Putting them in one undifferentiated
   list of "offences" was wrong twice over — it implied the school held them
   against the student, and it made the totals impossible to trace. */
function statusMeta(code){
  var list = (S.snap && S.snap.statuses) || [];
  for (var i=0;i<list.length;i++){
    var c = String(list[i].code || list[i].status || '').trim();
    if (c && c === String(code||'').trim()) return list[i];
  }
  return null;
}
function statusCounts(code){
  var m = statusMeta(code);
  return m ? !!m.counts : true;      // unknown status: assume it counts, and say so
}
function statusLabel(code){
  var m = statusMeta(code);
  return (m && m.label) ? m.label : String(code||'');
}

function stateOf(r){ return S.local[r.entryId] || String(r.state || ''); }
/* isLive(r) lived here until 4 August 2026. Nothing called it — every caller
   inlined /counted/i.test(stateOf(r)) instead — so it was a second definition
   of the same rule, sitting where somebody would reasonably expect to find the
   only one. */

function heldNow(x){
  var k = x.id + '|' + x.domain;
  if (S.holdLocal[k]) return S.holdLocal[k] === 'Held';
  return isHeld(x);
}

/* EVERYTHING RECORDED IN THE ACADEMIC YEAR, GROUPED BY STATUS.
   One flat list mixed lates with medical certificates and made the totals
   untraceable: the header said 9 and the list below looked like 3. Each status
   now carries its own subtotal, broken down by term, so every figure on this
   screen can be followed to the rows it came from.

   A row whose date will not parse is kept and sorted last rather than dropped —
   hiding a real offence because a cell is malformed is the worse failure. */
var STATUS_ORDER = ['LATE', 'A(WOR)', 'A(VRP)', 'A(VRO)', 'A(PR)', 'A(MC)', 'ED'];
function statusRank(code){
  var i = STATUS_ORDER.indexOf(String(code||'').trim());
  return i < 0 ? STATUS_ORDER.length : i;
}

function groupedHistory(){
  var rows = (S.history && S.history.rows) || [];
  var by = {}, order = [];
  rows.forEach(function(r){
    var k = String(r.status || '—').trim();
    if (!by[k]){ by[k] = []; order.push(k); }
    by[k].push(r);
  });
  order.sort(function(a,b){ return statusRank(a) - statusRank(b) || a.localeCompare(b); });
  return order.map(function(k){
    var list = by[k];
    var terms = {}, year = 0, setAside = 0;
    list.forEach(function(r){
      var live = /counted/i.test(stateOf(r));
      if (!live){ setAside++; return; }
      var n = Number(r.counts) || 0;
      year += n;
      var t = (r.term === '' || r.term === null || r.term === undefined) ? '?' : String(r.term);
      terms[t] = (terms[t] || 0) + n;
    });
    return { code:k, rows:list, terms:terms, year:year, setAside:setAside, counts:statusCounts(k) };
  });
}

/* ── THE YEAR, AS A CHART ──────────────────────────────────────────────────
   COLOUR IS ASSIGNED BY CATEGORY IN A FIXED ORDER, NEVER CYCLED, so a student
   with only lates and green slips wears the same blue and the same violet as a
   student with all seven. The hues are muted to one chroma and one lightness —
   which is what makes seven colours read as one family rather than seven
   signals, and which also lifted every one of them clear of 3:1 against this
   paper, where the brighter set had four below it.

   THE ORDER IS NOT COSMETIC. It was searched: at this chroma it is the only
   ordering that clears the colour-blind gates, and the worst pair sits in the
   floor band, which is permitted only with a second identity channel. There
   are three — the legend names every category, the stacked segments are parted
   by surface gaps rather than touching, and every figure is repeated with its
   label below. Do not reorder these, and do not add an eighth. */
var STATUS_HUE = {
  'LATE':   '#5088d0',
  'A(WOR)': '#c46948',
  'A(VRP)': '#249d6f',
  'A(VRO)': '#b17a15',
  'A(PR)':  '#c16387',
  'A(MC)':  '#569951',
  'ED':     '#7d7ace'
};
/* A code that is not in the map is a status somebody added to ⚙️ Statuses that
   this page has never been told about. It draws grey rather than borrowing a
   colour that already means something else. */
function hueFor(code){ return STATUS_HUE[String(code||'').trim()] || '#8d8a83'; }

/* The chart's twelve columns. Short forms deliberately — these are axis
   labels, and there is no room for 'September'. The long-form list is
   MONTH_LONG, near the top of this script; the two must not share a name. */
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthOf(d){ var m = /^\d{1,2}\s+([A-Za-z]{3})/.exec(String(d||'')); return m ? m[1] : ''; }

function yearChartHtml(){
  var rows = (S.history && S.history.rows) || [];
  var cats = [], seen = {};
  rows.forEach(function(r){
    if (!/counted/i.test(stateOf(r))) return;
    var k = String(r.status || '').trim();
    if (k && !seen[k]){ seen[k] = 1; cats.push(k); }
  });
  cats.sort(function(a,b){ return statusRank(a) - statusRank(b) || a.localeCompare(b); });
  if (!cats.length) return '<div class="blank">Nothing recorded this academic year.</div>';

  var by = {}, tot = {}, max = 0;
  MONTHS.forEach(function(m){ by[m] = {}; tot[m] = 0; });
  rows.forEach(function(r){
    if (!/counted/i.test(stateOf(r))) return;
    var m = monthOf(r.date); if (!by[m]) return;      // unparseable date: not plotted, still listed below
    var k = String(r.status || '').trim();
    by[m][k] = (by[m][k] || 0) + 1;
    tot[m]++;
    if (tot[m] > max) max = tot[m];
  });

  var PX = 172;
  var cols = MONTHS.map(function(m){
    if (!tot[m]){
      return '<div class="yrcol" title="' + m + ' &mdash; nothing recorded">' +
        '<span class="yrn zero">0</span><div class="yrnil"></div></div>';
    }
    var here = cats.filter(function(c){ return by[m][c]; });
    var segs = here.map(function(c, i){
      var h = Math.max(Math.round((by[m][c] / max) * PX), 5);
      return '<div class="yrseg' + (i === 0 ? ' top' : '') + (i < here.length - 1 ? ' gap' : '') +
        '" style="height:' + h + 'px;background:' + hueFor(c) + '" title="' +
        esc(m + ' — ' + by[m][c] + ' ' + statusLabel(c)) + '"></div>';
    }).join('');
    return '<div class="yrcol"><span class="yrn">' + tot[m] + '</span>' +
      '<div class="yrstack">' + segs + '</div></div>';
  }).join('');

  var axis = MONTHS.map(function(m){
    return '<div class="yrm' + (tot[m] ? ' on' : '') + '">' + m + '</div>'; }).join('');
  var legend = '<div class="leg">' + cats.map(function(c){
    return '<span><i style="background:' + hueFor(c) + '"></i>' + esc(statusLabel(c)) + '</span>';
  }).join('') + '</div>';

  return '<div class="yr">' + legend + '<div class="yrplot">' + cols + '</div>' +
    '<div class="yraxis">' + axis + '</div></div>';
}

/* ── THE ONE SENTENCE ON THIS PAGE THAT DRAWS A CONCLUSION ─────────────────
   It says which of two conversations this is, and the colour carries that
   rather than decorating it.

   A CONCENTRATION IN THE TERM WE ARE IN means something started — a new bus
   route, something at home, a friendship group. That is a heads-up: amber.

   A CONCENTRATION IN AN EARLIER TERM, with the current one quieter, means the
   opposite: whatever it was has passed, and the year total is carrying
   history. Amber there would point a conversation at a student who sorted
   themselves out in March, which is the more damaging of the two errors.

   NEITHER IS GREEN. This page does not congratulate anybody. It is silent
   unless one term genuinely holds half the year or more. */
function concentrationHtml(){
  var rows = (S.history && S.history.rows) || [];
  var byTerm = {}, total = 0;
  rows.forEach(function(r){
    if (!/counted/i.test(stateOf(r))) return;
    if (!statusCounts(r.status)) return;
    var t = (r.term === '' || r.term === null || r.term === undefined) ? '' : String(r.term);
    if (!t) return;
    var n = Number(r.counts) || 0;
    byTerm[t] = (byTerm[t] || 0) + n;
    total += n;
  });
  var terms = Object.keys(byTerm).sort();
  if (!total || !terms.length) return '';
  var latest = terms[terms.length - 1];
  var topT = '', topN = 0;
  terms.forEach(function(t){ if (byTerm[t] > topN){ topN = byTerm[t]; topT = t; } });
  if (topN / total < 0.5) return '';

  return topT === latest
    ? '<div class="note warn"><b>' + topN + ' of the ' + total + ' fall in Term ' + esc(topT) +
      ', the term we are in.</b> This is something recent rather than a year-long pattern, ' +
      'which is usually a different conversation to have.</div>'
    : '<div class="note"><b>' + topN + ' of the ' + total + ' fall in Term ' + esc(topT) +
      ', and it has been quieter since.</b> The year total is carrying something that has ' +
      'largely passed &mdash; worth knowing before reading the figures above as a description ' +
      'of how things are now.</div>';
}

/* Term 1 · 5 | Term 2 · 2. The dot separates the label from its number without
   adding a third weight; the rule stops "5 Term 2" reading as a phrase. */
function chipsHtml(g){
  if (!g.counts) return '<span class="tchip">(NA)</span>';
  var out = Object.keys(g.terms).sort().map(function(t){
    return '<span class="tchip">' + (t === '?' ? 'No term' : 'Term ' + esc(t)) +
      '<i>&middot;</i><b>' + g.terms[t] + '</b></span>';
  }).join('');
  if (g.setAside) out += '<span class="tchip">Set aside<i>&middot;</i><b>' + g.setAside + '</b></span>';
  return out || '<span class="tchip">(NA)</span>';
}

function categoriesHtml(gs){
  var max = 0;
  gs.forEach(function(g){ var v = g.counts ? g.year : g.rows.length; if (v > max) max = v; });
  return '<div class="viz">' + gs.map(function(g){
    var v = g.counts ? g.year : g.rows.length;
    var w = max ? Math.max((v / max) * 100, 1.5) : 1.5;
    return '<div class="tyrow" title="' + esc(statusLabel(g.code) + ' — ' + v + ' this year') + '">' +
      '<div class="tytop">' +
        '<span class="tyname"><i style="background:' + hueFor(g.code) + '"></i>' +
          esc(statusLabel(g.code)) + '</span>' +
        '<span class="tyn">' + v + '<span>this year</span></span></div>' +
      '<div class="tytrack"><div class="tyfill" style="width:' + w + '%;background:' +
        hueFor(g.code) + '"></div></div>' +
      '<div class="tyterms">' + chipsHtml(g) + '</div></div>';
  }).join('') + '</div>';
}

/* ── GROOMING, READ FROM THE OTHER SPREADSHEET ─────────────────────────── */
function groomStudentHtml(){
  if (S.gLoading){
    return '<div class="loading"><div class="spin"></div>' +
      '<div><b>Reading the Grooming Tracker&hellip;</b>' +
      '<span>It is a different spreadsheet, so it takes a moment.</span></div></div>';
  }
  var d = S.gstu;
  if (!d) return '<div class="note warn">The Grooming Tracker could not be read. Nothing else ' +
    'on this page is affected by that.</div>';
  if (!d.connected) return '<div class="note">' + esc(d.error || 'Not connected yet.') + '</div>';
  if (!d.year) return '<div class="blank">No grooming or attire offences this year.</div>';

  var maxM = 0;
  MONTHS.forEach(function(m){ var n = d.byMonth[m] || 0; if (n > maxM) maxM = n; });
  var strip = MONTHS.map(function(m){
    var n = d.byMonth[m] || 0;
    var h = n ? Math.max(Math.round((n / maxM) * 88), 5) : 3;
    return '<div class="gmc" title="' + m + ' &mdash; ' + n + '">' +
      '<span class="gmn' + (n ? '' : ' zero') + '">' + n + '</span>' +
      '<div class="gmb' + (n ? '' : ' nil') + '" style="height:' + h + 'px"></div></div>';
  }).join('');
  var axis = MONTHS.map(function(m){
    return '<div class="yrm' + ((d.byMonth[m] || 0) ? ' on' : '') + '">' + m + '</div>'; }).join('');

  var maxC = (d.byCat[0] || {}).n || 1;
  var bars = d.byCat.map(function(c){
    return '<div class="tyrow"><div class="tytop">' +
      '<span class="tyname">' + esc(c.name) + '</span>' +
      '<span class="tyn">' + c.n + '<span>this year</span></span></div>' +
      '<div class="tytrack"><div class="tyfill" style="width:' +
        Math.max((c.n / maxC) * 100, 1.5) + '%;background:#27326a"></div></div>' +
      (c.open ? '<div class="tyterms"><span class="tchip">Not yet fixed<i>&middot;</i><b>' +
        c.open + '</b></span></div>' : '') + '</div>';
  }).join('');

  var detail = d.rows.map(function(r){
    var tag = r.status === 'Resolved' ? '<span class="tag ok">fixed</span>'
      : r.lastOutcome === 'Did Not Report' ? '<span class="tag t5">did not report</span>'
      : '<span class="tag t3">still open</span>';
    return '<div class="tlrow"><div class="tld">' + esc(r.date) + '</div>' +
      '<div class="tlb"><b>' + esc(r.catName) + '</b> ' + tag +
        (r.remarks ? '<div class="rem">' + esc(r.remarks) + '</div>' : '') + '</div>' +
      '<div class="tla"></div></div>';
  }).join('');

  return '<div class="gsec"><div class="gfig">' +
      '<div><b>' + d.term + '</b><span>this term</span></div>' +
      '<div><b>' + d.year + '</b><span>this year</span></div>' +
      '<div><b>' + d.open + '</b><span>not yet fixed</span></div>' +
      (d.noShow ? '<div><b>' + d.noShow + '</b><span>did not report</span></div>' : '') +
    '</div>' +
    '<div class="gm">' + strip + '</div><div class="yraxis">' + axis + '</div>' +
    '<div class="viz" style="margin-top:22px">' + bars + '</div>' +
    '<div class="fold" id="fg">' +
      '<button class="foldh" type="button" data-fold="fg">' +
        '<span class="fchev">&rsaquo;</span>' +
        '<span class="fdot" style="background:#27326a"></span>' +
        '<span class="fname">Every grooming record<em>' + d.rows.length + ' record' +
          (d.rows.length === 1 ? '' : 's') + '</em></span>' +
        '<span class="fsum">' + (d.open ? '<span class="tchip">Not yet fixed<i>&middot;</i><b>' +
          d.open + '</b></span>' : '') + '</span>' +
      '</button><div class="foldb">' + detail + '</div></div></div>';
}

/* ── THE FULL RECORD, FOLDED ───────────────────────────────────────────────
   Every row is still here and still one click from the surface. Shut by
   default: a page that opens with sixty rows is a page nobody reads to the
   bottom, and the bottom is the oldest records — which is what a pattern is
   made of. */
function foldsHtml(gs){
  return gs.map(function(g, i){
    var id = 'fold' + i;
    return '<div class="fold" id="' + id + '">' +
      '<button class="foldh" type="button" data-fold="' + id + '">' +
        '<span class="fchev">&rsaquo;</span>' +
        '<span class="fdot" style="background:' + hueFor(g.code) + '"></span>' +
        '<span class="fname">' + esc(statusLabel(g.code)) +
          '<em>' + g.rows.length + ' record' + (g.rows.length === 1 ? '' : 's') + '</em></span>' +
        '<span class="fsum">' + chipsHtml(g) + '</span></button>' +
      '<div class="foldb">' + g.rows.map(rowLineHtml).join('') + '</div></div>';
  }).join('');
}

function historyLoadingHtml(){
  return '<div class="loading"><div class="spin"></div>' +
    '<div><b>Reading the whole academic year&hellip;</b>' +
    '<span>Every offence, every term, including the ones that stopped counting.</span></div></div>' +
    '<div class="skel"><i></i><i></i><i></i></div>';
}


function rowLineHtml(r){
  var st = stateOf(r);
  var live = /counted/i.test(st);
  var bad  = !/^\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/.test(String(r.date||''));
  var counts = statusCounts(r.status);

  var tags = '';
  if (Number(r.counts) === 2) tags += '<span class="tag t4">counts twice</span> ';
  if (!live) tags += '<span class="tag quiet">' + esc(st || 'not counted') + '</span> ';
  if (r.followedUp) tags += '<span class="tag ok">followed up</span> ';
  if (bad) tags += '<span class="tag t5">date unreadable</span> ';

  var why = '';
  if (!live && (r.stateChangedBy || r.stateReason)){
    why = '<div class="tlwhy">' + esc(r.stateChangedBy || '') +
          (r.stateReason ? ' &mdash; ' + esc(r.stateReason) : '') + '</div>';
  } else if (r.followedUp){
    why = '<div class="tlwhy">' + esc(r.followedUp) +
          (r.followedUpBy ? ' by ' + esc(r.followedUpBy) : '') +
          (r.actionTaken ? ' &mdash; ' + esc(r.actionTaken) : '') + '</div>';
  }

  /* THE REMARKS COLUMN IS THE WHOLE POINT OF THIS SCREEN. Cockpit's remarks
     are where "Bus was late" and "Parent called, unwell" actually live — the
     evidence somebody needs in front of them to decide whether to excuse an
     offence. Carrying the row without carrying its remark would mean deciding
     blind, and it is the reason the old sheet had reasons jammed into a
     column headed "Remarks CT emailed on". */
  var rem = String(r.remarks || '').trim();

  return '<div class="tlrow' + (live ? '' : ' off') + '">' +
    '<div class="tld">' + esc(r.date || '—') + '<span>' + esc(r.time || '') + '</span></div>' +
    '<div class="tlb">' +
      /* THE REASON, IN WORDS. hubHistory sends the code — UNWELL, OFFICIAL —
         because a code is what the Log stores and the label is a cell in
         🏷️ Reasons that may be reworded at any time. It is turned into the
         label here, from the list hubEarly already sent, so this screen agrees
         with the pill the officer tapped at the counter. This is the line that
         answers "how much has this student left for x reason", which is now
         the whole reason the early dismissal list has a chevron on it. */
      (r.reason ? '<b>' + esc(reasonLabel(r.reason)) + '</b> ' : '') +
      (r.source ? '<small>' + esc(r.source) + '</small> ' : '') +
      tags +
      (rem ? '<div class="rem">' + esc(rem) + '</div>' : '') +
      why + '</div>' +
    '<div class="tla">' + (live && counts
      ? '<button class="plain" data-excuse="' + esc(r.entryId) + '">Excuse this one</button>'
      : '') + '</div></div>';
}

/* The ladder, with this student's tier bracketed. */
function ladderTableHtml(x){
  var L = laddersFor(x.domain);
  if (!L.length) return '';
  return '<div class="grouplabel">' + esc(x.domain) + ' &mdash; as 🪜 Ladders reads today</div>' +
    '<table class="bracket ladder"><tbody>' + L.map(function(l){
      var t = Number(l.tier)||0;
      var here = (t === x.tier);
      return '<tr class="' + (here?'here ':'') + sevClass(t) + '">' +
        '<td style="width:96px;white-space:nowrap"><span class="tag ' + sevClass(t) + '">Tier ' + t + '</span></td>' +
        '<td style="width:56px" class="n">' + esc(l.atCount !== undefined ? l.atCount : '') + '</td>' +
        '<td>' + esc(l.action || '') + '</td></tr>';
    }).join('') + '</tbody></table>';
}

function askHtml(){
  if (!S.ask) return '';
  var a = S.ask;
  if (a.kind === 'overturn'){
    /* The row being excused, restated with its remark, so the decision is made
       with the evidence on screen rather than from memory of a list. */
    var row = null;
    ((S.history && S.history.rows) || []).forEach(function(r){ if (r.entryId === a.entryId) row = r; });
    var ctx = row
      ? '<div class="askrow"><b>' + esc(row.date || '') + '</b> ' + esc(row.time || '') +
        ' &middot; ' + esc(statusLabel(row.status)) +
        (Number(row.counts) === 2 ? ' &middot; counts twice' : '') +
        (String(row.remarks || '').trim()
          ? '<div class="rem">' + esc(row.remarks) + '</div>'
          : '<div class="rem none">No remark was recorded against this one.</div>') + '</div>'
      : '';
    return '<div class="note q">' + ctx + '<b>Excuse this offence?</b> ' +
      'It stays in the Log exactly as it was recorded &mdash; the state becomes ' +
      '<b>Overturned</b>, the count drops by one at the next rebuild, and your name and ' +
      'reason go beside it. <b>This is not the same as Waived</b>: waived is what the Cockpit ' +
      'reconciliation observed, overturned is what a person decided. ' +
      'A follow-up already stamped stays exactly where it is.' +
      '<div class="field"><label>Why &mdash; required</label>' +
        '<textarea id="reason" rows="2" placeholder="e.g. Bus breakdown along Upper Serangoon, confirmed by the CT."></textarea></div>' +
      '<div class="stack rowwise"><button id="doask"' + (S.busy?' disabled':'') + '>' +
        (S.busy?'Recording&hellip;':'Excuse it') + '</button>' +
        '<button class="plain" id="cancelask">Cancel</button></div>' +
      (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') + '</div>';
  }
  if (a.kind === 'hold'){
    return '<div class="note q"><b>Hold follow-up for ' + esc(S.student.domain) + '?</b> ' +
      'They come off this worklist until you release it. ' +
      '<b>Offences keep accruing while a hold is on</b> &mdash; only the following up stops, ' +
      'so what they come back to is the true figure. It holds this ladder only; ' +
      'anything else they owe carries on.' +
      '<div class="field"><label>Why &mdash; required</label>' +
        '<textarea id="reason" rows="2" placeholder="e.g. Family bereavement. DM aware, revisit after the September break."></textarea></div>' +
      '<div class="stack rowwise"><button id="doask"' + (S.busy?' disabled':'') + '>' +
        (S.busy?'Recording&hellip;':'Put the follow-up on hold') + '</button>' +
        '<button class="plain" id="cancelask">Cancel</button></div>' +
      (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') + '</div>';
  }
  return '<div class="note q"><b>Release the hold on ' + esc(S.student.domain) + '?</b> ' +
    'They return to the worklist at whatever tier they have reached in the meantime. ' +
    'The hold row is kept, closed, with your name on it.' +
    '<div class="stack rowwise"><button id="doask"' + (S.busy?' disabled':'') + '>' +

      '<button class="plain" id="cancelask">Cancel</button></div>' +
    (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') + '</div>';
}

        'They count different things, so the numbers are meant to disagree &mdash; ' +

    (S.ask ? askHtml() : (x.domain
      ? '<div class="stack rowwise">' +

/* ── early dismissals ─────────────────────────────────────────────────── */
/* REPLACED the early dismissal follow-up area on 3 August 2026. The follow-up
   — the automatic email chasing a form teacher for an MC — was shelved by the
   DM before it was ever switched on, and the whole subsystem is archived in
   Notion rather than deleted. What the committee actually asked for is what is
   here: a count. Who is leaving early, how often, and why.

   THIS SCREEN WRITES NOTHING AT ALL. It is the first area of the Hub with no
   write path whatsoever — no stamp, no overturn, no hold. That is not an
   omission. There is no ladder for early dismissal and there is deliberately
   not going to be one; the committee reads the number and decides what to do
   with a person, which is a conversation and not a button.

   THE THRESHOLD IS A DISPLAY RULE, NOT A CONSEQUENCE. Crossing it puts a
   student at the top of this list. It does not issue anything, and nothing on
   this screen should ever be worded as though it does. */

function earlyStudents(){ return (S.early && S.early.students) || []; }

/* Over the line on the tab currently showing. THE COMPARISON IS THE SERVER'S
   NUMBERS AGAINST THE SERVER'S THRESHOLD — the page supplies neither, so this
   screen and the General Office phone cannot come to different conclusions
   about the same student. A threshold of 0 or blank disables that tier rather
   than flagging the whole school, which is what a naive >= would do. */
function earlyFlagged(){
  if (!S.early) return [];
  var at = S.early.concernAt || {};
  var byTerm = Number(at.term) || 0, byYear = Number(at.year) || 0;
  return earlyStudents().filter(function(x){
    return (byTerm > 0 && x.term >= byTerm) || (byYear > 0 && x.year >= byYear);
  });
}

/* A reason code back to its label. hubEarly sends the list; hubHistory sends
   only the code, so this is also what the student page uses to turn UNWELL
   into "Unwell". Falls back to the code rather than to nothing — an unlabelled
   code is ugly and readable, a blank is neither. */
function reasonLabel(code){
  var meta = (S.early && S.early.reasonMeta) || [];
  for (var i = 0; i < meta.length; i++) if (meta[i].code === code) return meta[i].label;
  return String(code || '');
}

/* ONE NUMBER, FROM 3 AUGUST 2026, AND THIS IS THE NOTE EXPLAINING WHY THERE
   USED TO BE TWO.

   The row used to print "3 that count" beside "5 in all", with the per-reason
   breakdown spelled out underneath. Kim: "the 'count' actually doesn't matter
   coz it's damn rare for it to overlap… if we just count everything and put
   the number there, and then we allow u to go into the student page, u can
   then see from there just how much the student has left for x reason."

   She is right, and the fix was not on this page. Two figures on one line is
   the shape you reach for when the list is being asked to do two jobs — be
   scannable, and be complete. It cannot do both. So the list is now scannable
   and the student page is complete, which is what the chevron on every row is
   for.

   THE NUMBER SHOWN IS THE NUMBER THE THRESHOLD USES. That is not a detail. A
   row reading 6 that does not flag at a threshold of 5 is a screen nobody can
   trust, and it was the unavoidable consequence of showing the total while
   flagging on a subset. The counted set was redrawn instead — see SEED_REASONS
   in SheetTools.gs — so that the two are the same number: everything except
   the departures the school itself caused. */
function earlyRowHtml(x, span, at){
  var n    = span === 'term' ? x.term : x.year;
  var over = at > 0 && n >= at;

  var meta = [x.cls || 'class unknown'];
  if (x.lastDate) meta.push('last left early ' + x.lastDate);
  /* SAID ONLY WHEN IT IS TRUE. Most students have no school-directed
     departures at all, and a permanent "0 school events" on every row is the
     second figure coming back in through the door it was just shown out of. */
  var directed = (span === 'term' ? x.termAll - x.term : x.yearAll - x.year);
  if (directed > 0) meta.push(directed + ' more for awards or school events, not counted');

  return '<div class="row flat' + (over ? ' t3' : '') + '">' +
      '<div class="body">' +
        '<div class="p">' + esc(x.name) + '</div>' +
        '<div class="meta">' + meta.map(esc).join(' &middot; ') + '</div>' +
      '</div>' +
      '<div class="stats">' +
        '<div class="stat"><span class="v">' + n + '</span><span class="k">' +
          (span === 'term' ? 'this term' : 'this year') + '</span></div>' +
      '</div>' +
      '<div class="dside">' +
        (over ? '<span class="tag t3">Over ' + at + '</span>' : '') +
      '</div>' +
      /* THE SAME CHEVRON AS THE LATECOMING LIST, and deliberately the same:
         one gesture that means "open this student" everywhere in the Hub.
         data-eopen, not data-open, because data-open carries a SNAPSHOT ENTRY
         ID and these students have no snapshot row at all — early dismissal
         has no ladder, so it reaches no snapshot. Reusing the attribute would
         have looked right and silently done nothing. */
      (x.studentId
        ? '<div class="rowgo opn" data-eopen="' + esc(x.studentId) +
            '" title="Open ' + esc(x.name) + '">' +
            '<span class="lbl">Open</span><span class="chev">&rarr;</span></div>'
        : '<div class="rowgo" title="No student ID, so there is no record to open">' +
            '<span class="chev" style="opacity:.25">&rarr;</span></div>') +
    '</div>';
}

function earlyHtml(){
  if (S.pending.early) return readingHtml('the green slip record');
  if (!S.early){
    return '<div class="screen centre"><div class="wrap">' +

      '<div class="lede">This area reads &#128203; Log live, so there is no older answer to ' +
        'fall back on &mdash; unlike every other area, which can still show you the last ' +

      '<div class="stack"><button id="eretry">Try again</button>' +
      '<button class="plain" data-go="menu">Back to all areas</button></div>' +
    '</div></div>';
  }

  var d    = S.early;

  var at   = Number((d.concernAt || {})[span]) || 0;

  var list = earlyStudents().slice().sort(function(a, b){
    return (span === 'term' ? (b.term - a.term) : (b.year - a.year)) ||
           (b.yearAll - a.yearAll) ||
           String(a.cls).localeCompare(String(b.cls)) ||
           String(a.name).localeCompare(String(b.name));
  });
  var over  = list.filter(function(x){ return at > 0 && (span==='term'?x.term:x.year) >= at; });
  var under = list.filter(function(x){ return !(at > 0 && (span==='term'?x.term:x.year) >= at); });

  /* THE BACK LINK IS AT THE TOP, in the same appbar the student page uses.
     A control you need before you have read the screen does not belong after
     it — and this list can run to a hundred rows, which made the old footer
     button a scroll rather than a click. */
  var h = '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +

    /* No builtHtml() here, deliberately. This answer is live and has no age. */
    '<div class="date">' + esc(todayLong()) +

      'and decides nothing &mdash; there is no ladder for early dismissal. Open a student to ' +
      'see what each of their departures was for.</div>';

  /* TODAY FIRST, FROM 3 AUGUST 2026. It was at the bottom on the reasoning
     that the running record is the committee's job and today's traffic is the
     General Office's. That was wrong about who reads this: somebody opening it
     mid-morning wants to know what has just happened, and the running record
     is unchanged since yesterday. The thing that moves goes at the top. */
  var today = d.today || [];
  h += '<div class="grouplabel">Left early today</div>' +
    (today.length
      ? '<div class="rows">' + today.map(function(t){
          return '<div class="row flat"><div class="body">' +
            '<div class="p">' + esc(t.name) + '</div>' +
            '<div class="meta">' + [t.cls, t.time, t.reasonLabel].map(esc).join(' &middot; ') +
            '</div>' +
          '</div><div class="dside">' +
            (t.counts ? '' : '<span class="tag quiet">Not counted</span>') +
          '</div>' +
          (t.studentId
            ? '<div class="rowgo opn" data-eopen="' + esc(t.studentId) +
                '" title="Open ' + esc(t.name) + '">' +
                '<span class="lbl">Open</span><span class="chev">&rarr;</span></div>'
            : '') +
          '</div>';
        }).join('') + '</div>'
      : '<div class="blank">Nobody has left early today.</div>');

  h += '<div class="tabs">' +
    '<a class="' + (span==='term'?'on':'') + '" data-etab="term">This term</a>' +
    '<a class="' + (span==='year'?'on':'') + '" data-etab="year">This year</a>' +
  '</div>';

  h += at > 0
    ? '<div class="note ok"><b>The threshold is ' + at + ' ' + (span==='term'?'in a term':'in a year') +
      '.</b> The number on each row is every early dismissal except the ones the school itself ' +
      'caused &mdash; an awards ceremony or an official school event. Everything else counts, ' +
      'including a medical appointment. Change the threshold in &#9881;&#65039; Config, against ' +
      '<i>Early dismissal concern at</i>; change what counts in the <i>Counts</i> column of ' +
      '&#127991;&#65039; Reasons. Crossing it puts a student on this list and colours a line on ' +
      'the General Office phone. It does nothing else.</div>'
    : '<div class="note warn"><b>No threshold is set for this view.</b> Put a number in ' +
      '&#9881;&#65039; Config against <i>Early dismissal concern at</i> and this list will ' +
      'separate out the students worth a conversation.</div>';

  h += '<div class="grouplabel">Over the threshold &mdash; most first</div>' +
    (over.length ? '<div class="rows">' + over.map(function(x){ return earlyRowHtml(x, span, at); }).join('') + '</div>'
      : '<div class="blank">Nobody has reached ' + (at || 'the threshold') + ' ' +
