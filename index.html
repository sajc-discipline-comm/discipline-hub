  h += '<div class="grouplabel">Everyone else who has left early, most first</div>' +
    (under.length ? '<div class="rows">' + under.map(function(x){ return earlyRowHtml(x, span, at); }).join('') + '</div>'
      : '<div class="blank">Nobody else has left early ' + (span==='term'?'this term':'this year') + '.</div>');

  h += '<div class="foot"><span>This screen writes nothing. It cannot change whether a slip ' +
    'counts &mdash; that is the <i>Counts</i> column in &#127991;&#65039; Reasons &mdash; and it ' +
    'cannot remove a slip. To take one out of a student&rsquo;s total, open them and excuse ' +
    'it.</span></div>';

  return h + '</div></div>';
}

/* ── opening a student who is on no ladder ─────────────────────────────────
   openStudent() finds its student in allRows(), which is the SNAPSHOT — and
   early dismissal never reaches the snapshot, because ED carries no ladder.
   So the chevron on the early dismissal list needs its own way in, building
   the student from the record it already has rather than looking one up.

   THE SYNTHETIC STUDENT HAS NO DOMAIN AND NO TIER, and the student page has
   been taught to cope rather than being handed a fake ladder to keep it happy.
   A tier invented here would appear on screen as a real one. */
function openStudentFromEarly(studentId){
  var rec = null;
  earlyStudents().forEach(function(r){ if (r.studentId === studentId) rec = r; });
  /* Today's list carries students who may have no running record yet — their
     first ever slip. Fall back to it so their first departure is still openable. */
  if (!rec){
    ((S.early && S.early.today) || []).forEach(function(r){
      if (r.studentId === studentId) rec = { studentId: r.studentId, name: r.name,
                                             cls: r.cls, cohort: r.cohort || '' };
    });
  }
  if (!rec) return;

  S.student = { id: rec.studentId, name: rec.name, cls: rec.cls,
                cohort: rec.cohort || '', domain: '', tier: 0, entryId: '' };
  S.history = null; S.hErr = ''; S.ask = null;
  S.from = 'early';
  S.hLoading = true;
  go('student');
  /* ── ONE AT A TIME, NOT BOTH AT ONCE ─────────────────────────────────
     These two used to fire together. Measured on 4 August: requests to this
     deployment succeed 100% of the time when nothing else is talking to it,
     and start failing as soon as anything is — 93% with two devices, 80% with
     two devices both running pairs. Concurrency is the fault, not the device
     and not the network.
     So the grooming read waits for the history read. It costs a second on a
     screen nobody is racing through, and it removes the last place in the Hub
     where two requests are deliberately in flight at once. */
  loadHistory(rec.studentId).then(function(){
    loadGroomingStudent({ id: rec.studentId, name: rec.name, cls: rec.cls });
  });
}


/* ── grooming and attire ──────────────────────────────────────────────── */
/* ADDED 3 AUGUST 2026, reversing the earlier position that the Hub did not
   need a grooming view. Kim: "i know we mentioned previously we don't need it,
   but i have thought otherwise since."

   IT READS THE OTHER SPREADSHEET THROUGH THIS PROJECT'S API, so there is one
   password and one front door. See apiHubGrooming_ for why.

   IT IS READ-ONLY, AND MORE STRICTLY THAN THE REST OF THE HUB. The grooming
   phone app is the only thing that writes to that sheet, and its recheck loop
   is the only thing that closes an offence. Nothing here may ever gain a
   button that changes a grooming row; if that is wanted it belongs in the
   grooming app, behind the grooming password.

   THREE CUTS, BECAUSE THEY ANSWER THREE DIFFERENT QUESTIONS. Repeat offenders
   is who to talk to. By class is who to ask a form teacher about. By category
   is what to say at assembly. */

/* ── the bar, and why it is not a pie ──────────────────────────────────────
   Kim asked for "a pie chart sorta thing to make the data/percentage more
   obvious". The percentages are the ask and they are here; the pie is not, and
   the reason is the data rather than a preference.

   A pie reads at a glance only up to about six slices, and only when the
   slices are not close in size. Grooming has EIGHT categories with long names —
   "Multiple Earrings/Other Accessories" — and a realistic term will have three
   or four of them within a few percent of each other. That is precisely the
   shape a pie renders unreadable: the eye compares angles badly, the labels
   will not fit inside the wedges, and the two categories somebody actually
   wants to compare are usually on opposite sides of the circle.

   A RANKED BAR ANSWERS THE SAME QUESTION BETTER. The order IS the ranking, the
   lengths are directly comparable because they share one baseline, the long
   names sit on their own line with room to be read, and the percentage is
   printed rather than inferred from an angle. Everything a pie was going to
   say is said here, and the close calls are readable.

   ONE COLOUR, DELIBERATELY. There is one series, so colour carries no meaning
   and a legend would restate the row labels. Eight hues would fail on
   colour-blindness before it failed on taste — past roughly seven, adjacent
   classes stop being tellable apart. The navy is the Hub's own accent; it was
   checked against the page's surface for contrast rather than picked by eye.

   THE TABLE STAYS, UNDER THE CHART. Every figure on the chart is in it, so
   nothing here is reachable only by looking at a picture. */
function vizRows(items, opts){
  var max = 0;
  items.forEach(function(it){ if (it.value > max) max = it.value; });
  var total = 0;
  items.forEach(function(it){ total += it.value; });
  if (!items.length || !max) return '<div class="blank">Nothing to chart yet.</div>';

  return '<div class="viz">' + items.map(function(it){
    var pct = total ? Math.round((it.value / total) * 1000) / 10 : 0;
    var w   = Math.max((it.value / max) * 100, 1.2);   // never a bar of literally nothing
    return '<div class="vrow" title="' + esc(it.name + ' — ' + it.value + ' ' +
             (opts.unit || '') + (total ? ' (' + pct + '% of the total)' : '')) + '">' +
        '<div class="vtop">' +
          '<span class="vname">' + esc(it.name) + '</span>' +
          '<span class="vval">' + esc(it.valueLabel !== undefined ? it.valueLabel : it.value) +
            (opts.showPct ? '<span class="vpct">' + pct + '%</span>' : '') + '</span>' +
        '</div>' +
        '<div class="vtrack"><div class="vfill" style="width:' + w + '%"></div></div>' +
        /* sub is NOT escaped, and it is the only field here that is not. It is
           built from numbers and separators by the two callers below and never
           carries a value from the sheet — the fields that do, name and the
           tooltip, are both escaped. If a caller is ever added that puts sheet
           text in here, escape it there. */
        (it.sub ? '<div class="vsub">' + it.sub + '</div>' : '') +
      '</div>';
  }).join('') + '</div>';
}

/* The four numbers somebody wants before they want any breakdown at all. A
   handful of headline figures is a row of tiles, not a chart — there is
   nothing to compare, so there is nothing to plot. */
function groomKpiHtml(d){
  var heads = {};
  (d.students || []).forEach(function(s){ heads[s.name + '|' + s.cls] = 1; });
  var term = 0, year = 0;
  (d.categories || []).forEach(function(c){ term += c.term; year += c.year; });
  return '<div class="kpi">' +
    '<div><b>' + term + '</b><span>this term</span></div>' +
    '<div><b>' + year + '</b><span>this year</span></div>' +
    '<div><b>' + Object.keys(heads).length + '</b><span>students involved</span></div>' +
    '<div><b>' + (d.openTotal || 0) + '</b><span>not yet fixed</span></div>' +
  '</div>';
}

function groomHtml(){
  if (!S.groomTried && !S.pending.groom){ ensureGrooming(); return readingHtml('the grooming tracker'); }
  if (S.pending.groom) return readingHtml('the grooming tracker');
  if (!S.groom){
    return '<div class="screen centre"><div class="wrap">' +
      '<h1 class="big">The grooming tracker could not be read.</h1>' +
      '<div class="lede">This area reads the Grooming Tracker&rsquo;s own spreadsheet live, so ' +
        'there is no older answer to fall back on. Nothing else on the Hub is affected, and ' +
        'nothing has been changed by this.</div>' +
      '<div class="stack"><button id="gretry">Try again</button>' +
      '<button class="plain" data-go="menu">Back to all areas</button></div>' +
    '</div></div>';
  }

  var d = S.groom;

  /* NOT CONNECTED IS NOT AN ERROR, and it must not read like one. An empty
     screen and an unconfigured one are the same picture and opposite facts. */
  if (!d.connected || !d.ok){
    return '<div class="screen centre"><div class="wrap">' +
      '<h1 class="big">' + (d.connected ? 'That did not open.' : 'Not connected yet.') + '</h1>' +
      '<div class="lede">' + esc(d.error || '') + '</div>' +
      '<div class="lede">Open the SAJC Grooming Tracker, copy the long code out of its address ' +
        'bar &mdash; the part between <i>/d/</i> and <i>/edit</i> &mdash; and paste it into ' +
        '&#9881;&#65039; Config in the Attendance Tracker, against <i>Grooming Tracker ID</i>. ' +
        'Nothing needs redeploying.</div>' +
      '<div class="stack"><button id="gretry">Try again</button>' +
      '<button class="plain" data-go="menu">Back to all areas</button></div>' +
    '</div></div>';
  }

  var tab = S.gtab || 'students';
  var h = '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="date">' + esc(todayLong()) +
      ' <span class="built">as at ' + esc(d.serverTime || '') + '</span></div>' +
    '<h1>Grooming and attire</h1>' +
    '<div class="who">Read straight from the Grooming Tracker. This screen changes nothing in ' +
      'it &mdash; an offence is closed by the recheck on the phone, and nowhere else.</div>';

  h += '<div class="tabs">' +
    '<a class="' + (tab==='students'?'on':'') + '" data-gtab="students">Repeat offenders</a>' +
    '<a class="' + (tab==='classes'?'on':'')  + '" data-gtab="classes">By class</a>' +
    '<a class="' + (tab==='categories'?'on':'') + '" data-gtab="categories">By category</a>' +
  '</div>';

  h += groomKpiHtml(d);

  if (!d.rows){
    h += '<div class="blank">No grooming offences recorded for ' + esc(d.academicYear) + '.</div>';
    return h + groomFootHtml() + '</div></div>';
  }

  if (tab === 'students')        h += groomStudentsHtml(d);
  else if (tab === 'classes')    h += groomClassesHtml(d);
  else                           h += groomCategoriesHtml(d);

  return h + groomFootHtml() + '</div></div>';
}

function groomFootHtml(){
  return '<div class="foot"><span>Read-only. Offences are recorded and closed on the grooming ' +
    'phone app; this screen only counts them.</span><span class="sp"></span>' +
    '<button class="plain" data-go="menu">Back to all areas</button></div>';
}

function groomStudentsHtml(d){
  var at = Number(d.concernAt) || 0;
  var over  = (d.students||[]).filter(function(x){ return x.overTerm; });
  var under = (d.students||[]).filter(function(x){ return !x.overTerm; });

  var h = at > 0
    ? '<div class="note ok"><b>The threshold is ' + at + ' in a term.</b> Change it in ' +
      '&#9881;&#65039; Config against <i>Grooming concern at (per term)</i>. It decides who ' +
      'appears at the top of this list and nothing else.</div>'
    : '';

  function row(x){
    var meta = [x.cls || 'class unknown'];
    if (x.lastDate) meta.push('last picked up ' + x.lastDate);
    if (x.noShow) meta.push(x.noShow + ' did-not-report');
    var why = (x.byCat||[]).map(function(c){ return c.n + ' ' + c.name.toLowerCase(); }).join(' &middot; ');
    return '<div class="row flat' + (x.overTerm ? ' t3' : '') + '">' +
        '<div class="body">' +
          '<div class="p">' + esc(x.name) + '</div>' +
          '<div class="meta">' + meta.map(esc).join(' &middot; ') + '</div>' +
          '<div class="s">' + (why || 'no categories recorded') + '</div>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><span class="v">' + x.term + '</span><span class="k">this term</span></div>' +
          '<div class="stat"><span class="v">' + x.year + '</span><span class="k">this year</span></div>' +
          '<div class="stat"><span class="v">' + x.open + '</span><span class="k">not fixed</span></div>' +
        '</div>' +
      '</div>';
  }

  h += '<div class="grouplabel">Over the threshold this term</div>' +
    (over.length ? '<div class="rows">' + over.map(row).join('') + '</div>'
      : '<div class="blank">Nobody has reached ' + (at || 'the threshold') + ' this term.</div>');
  h += '<div class="grouplabel">Everyone else, most first</div>' +
    (under.length ? '<div class="rows">' + under.map(row).join('') + '</div>'
      : '<div class="blank">Nobody else has been picked up.</div>');
  return h;
}

function groomClassesHtml(d){
  /* BOTH FIGURES, AND THE PER-HEAD ONE IS WHY. A big class will always have
     more offences than a small one, so a raw total quietly ranks classes by
     size. Per student is the number that means what somebody will read it as
     meaning, and both are here so nobody has to take that on trust. */
  var h = '<div class="note warn"><b>Read this one carefully.</b> A bigger class collects more ' +
    'offences than a smaller one whatever its form teacher does, so the total on its own ranks ' +
    'classes by size. The per-student figure beside it is the comparable one.</div>';

  /* THE CHART PLOTS PER STUDENT, NOT THE TOTAL, and the warning above is why.
     A chart of raw totals would make the honest caveat in that box argue with
     the picture directly beneath it — and the picture would win, because it is
     a picture. So the comparable figure is the one given a length, and the raw
     total sits underneath it as a numeral where it can be read but not
     accidentally compared.

     TOP FIFTEEN. Sixty bars is not a ranking, it is a wall; the table below
     carries every class, and the cut is stated rather than silent. */
  var top = (d.classes || []).slice().sort(function(a,b){
    return (b.perStudent - a.perStudent) || (b.year - a.year) ||
           String(a.cls).localeCompare(String(b.cls));
  }).slice(0, 15);

  h += '<div class="grouplabel">Offences per student &mdash; highest fifteen classes</div>' +
    vizRows(top.map(function(c){
      return { name: c.cls, value: c.perStudent, valueLabel: c.perStudent.toFixed(2),
               unit: 'offences per student',
               sub: c.year + ' this year across ' + c.students + ' student' +
                    (c.students===1?'':'s') + ' &middot; ' + c.term + ' this term &middot; ' +
                    c.open + ' not yet fixed' };
    }), { showPct: false, unit: 'per student' }) +
    ((d.classes || []).length > 15
      ? '<div class="lede">' + ((d.classes||[]).length - 15) + ' more class' +
        ((d.classes||[]).length - 15 === 1 ? '' : 'es') + ' below the fifteenth are in the ' +
        'table below, which carries every class.</div>'
      : '');

  h += '<div class="grouplabel">Every class, as a table</div>' +
    '<table class="etbl"><thead><tr><th>Class</th><th class="c">This term</th>' +
    '<th class="c">This year</th><th class="c">Students</th><th class="c">Per student</th>' +
    '<th class="c">Not fixed</th></tr></thead><tbody>';
  (d.classes||[]).forEach(function(c){
    h += '<tr><td>' + esc(c.cls) + '</td>' +
      '<td class="n">' + c.term + '</td><td class="n">' + c.year + '</td>' +
      '<td class="n">' + c.students + '</td><td class="n">' + c.perStudent.toFixed(2) + '</td>' +
      '<td class="n">' + c.open + '</td></tr>';
  });
  return h + '</tbody></table>';
}

function groomCategoriesHtml(d){
  var cats = d.categories || [];

  var h = '<div class="grouplabel">Share of every offence this year</div>' +
    '<div class="lede">Ranked, longest first, with each category&rsquo;s share of the year&rsquo;s ' +
      'total. The bars are directly comparable because they all start from the same edge.</div>' +
    vizRows(cats.map(function(c){
      return { name: c.name, value: c.year, unit: 'offences',
               sub: c.term + ' this term &middot; ' + c.students + ' student' +
                    (c.students===1?'':'s') + ' &middot; ' + c.open + ' not yet fixed' };
    }), { showPct: true, unit: 'offences' });

  h += '<div class="grouplabel">The same figures, as a table</div>' +
    '<div class="lede">What is actually being picked up. The students column is how many ' +
    'different students, not how many offences &mdash; one student pulled up eight times for ' +
    'the same thing is a different problem from eight students pulled up once.</div>' +
    '<table class="etbl"><thead><tr><th>Category</th><th class="c">This term</th>' +
    '<th class="c">This year</th><th class="c">Students</th><th class="c">Not fixed</th>' +
    '</tr></thead><tbody>';
  (d.categories||[]).forEach(function(c){
    h += '<tr><td>' + esc(c.name) + '</td>' +
      '<td class="n">' + c.term + '</td><td class="n">' + c.year + '</td>' +
      '<td class="n">' + c.students + '</td><td class="n">' + c.open + '</td></tr>';
  });
  return h + '</tbody></table>';
}


/* ── the daily email ──────────────────────────────────────────────────── */
function picked(){
  return worklist(S.area).filter(function(x){ return S.sel[x.entryId] && !isStamped(x); });
}

/* THE EMAIL IS TWO DIFFERENT SENTENCES, so it is two different blocks.
   A Thursday privilege row counts DISTINCT THURSDAYS, not lates, and its
   action belongs to the DM rather than the form teacher. Putting it in the
   table of lates produced a second row for the same student saying "3" when
   the row above said "5" — in a message going to sixty form teachers. */
/* pickedLates() sat here until 6 August 2026 — the exact mirror of pickedThu()
   below, and never called by anything. Its twin is used, which is what made it
   look load-bearing: a reader finding one naturally assumes both are wired up
   and goes looking for where the non-Thursday branch is handled. Nowhere: the
   callers that want everything use picked() directly. */
function pickedThu(){   return picked().filter(function(x){ return x.domain === 'Thursday privilege'; }); }

/* ONE BLOCK PER LADDER, in the order the area holds them. The email was
   special-cased for latecoming plus a Thursday footnote; an attendance area
   has two ladders with different tiers and different sentences, and merging
   them into one table would repeat the mistake the Thursday block was split
   out to fix. */
function emailGroups(){
  var rows = picked(), by = {}, order = [];
  rows.forEach(function(x){
    if (!by[x.domain]){ by[x.domain] = []; order.push(x.domain); }
    by[x.domain].push(x);
  });
  order.sort(function(a,b){
    if (a === 'Thursday privilege') return 1;
    if (b === 'Thursday privilege') return -1;
    return a.localeCompare(b);
  });
  return order.map(function(d){
    var list = by[d];
    var lo = Math.min.apply(null, list.map(function(x){ return x.term; }));
    var hi = Math.max.apply(null, list.map(function(x){ return x.term; }));
    return { domain:d, rows:list, lo:lo, hi:hi, thu:(d === 'Thursday privilege') };
  });
}

/* The sentence above each table. Occasions for a count, not "offences" —
   an absence with a parent's letter is not an offence and the email should
   not call it one. */
function introFor(g){
  if (g.thu) return THU_PARA;
  var range = (g.lo === g.hi) ? ('on ' + g.lo + ' occasions') : ('on ' + g.lo + ' to ' + g.hi + ' occasions');
  if (g.domain === 'Latecoming')
    return 'The following students have been late ' + range + ' this term. Please follow up accordingly.';
  return 'The following students have been recorded as ' + domainLabel(g.domain) + ' &mdash; ' +
         g.domain + ' &mdash; ' + range + ' this term. Please follow up accordingly.';
}

function recipients(){
  var out = [], seen = {}, absent = [], noIds = [], unresolved = [], noClass = [];
  if (!S.teachers) return { list:[], absent:[], noIds:[], unresolved:[], noClass:[], ready:false };
  picked().forEach(function(x){
    var k = String(x.cls||'').trim().toUpperCase();      // C returns UPPERCASE keys
    /* A student with no class is not a class with no teachers. Reporting it as
       "no teachers listed for ''" was how a blank cell in the Log turned into
       an accusation about the Master. */
    if (!k){ if (noClass.indexOf(x.name)<0) noClass.push(x.name); return; }
    var t = S.teachers.byClass ? S.teachers.byClass[k] : undefined;
    /* THREE DIFFERENT FAULTS, THREE DIFFERENT SENTENCES. C is careful to
       return the key with an empty array when a class exists but has nobody,
       precisely so these can be told apart — collapsing them back into one
       "no teachers listed" threw that away and sent somebody looking in the
       wrong tab. */
    if (t === undefined){ if (absent.indexOf(k)<0) absent.push(k); return; }   // not in Class Allocations
    if (!t.length){
      var u = S.teachers.unresolvedByClass && S.teachers.unresolvedByClass[k];
      if (u && u.length){ if (unresolved.indexOf(k)<0) unresolved.push(k); }   // IDs there, none Active
      else if (noIds.indexOf(k)<0) noIds.push(k);                              // the class is there, the IDs are not
      return;
    }
    t.forEach(function(p){
      var e = String(p.email||'').trim().toLowerCase();
      if (!e || seen[e]) return;
      seen[e] = 1; out.push(p);
    });
  });
  return { list:out, absent:absent, noIds:noIds, unresolved:unresolved, noClass:noClass, ready:true };
}

/* WHAT THE MASTER ACTUALLY SENT BACK, on demand. "No teachers listed for
   26S04" says a fact without saying which side of the join is wrong: the
   class the Hub asked for, or the classes the Master holds. This shows both
   lists side by side so the mismatch is visible rather than deduced. */
function diagHtml(){
  if (!S.diag) return '<div class="stack rowwise" style="margin-top:10px">' +
    '<button class="plain" id="showdiag">Why? Show what the Master sent back</button></div>';

  var need = {}, blank = [];
  picked().forEach(function(x){
    var k = String(x.cls||'').trim().toUpperCase();
    if (k) need[k] = 1; else blank.push(x.name);
  });
  var needList = Object.keys(need).sort();
  var by = (S.teachers && S.teachers.byClass) || {};
  var have = Object.keys(by).sort();
  var withT = have.filter(function(c){ return by[c] && by[c].length; });
  var emptyT = have.filter(function(c){ return !by[c] || !by[c].length; });

  function state(c){
    if (by[c] === undefined) return 'bad';
    return (by[c] && by[c].length) ? 'ok' : 'warn';
  }

  /* WHICH CLASSES HAVE TEACHERS AND WHICH DO NOT is the single most useful
     line here: if every class with teachers is one intake year and every
     class without is the other, the fault is one tab, not fifteen rows. */
  /* Round 4's counts, when the deployment has them. Three numbers that say
     which of three conversations to have — far better than anything the Hub
     can infer from an empty map. */
  var c = S.teachers && S.teachers.counts;
  var src = S.teachers && S.teachers.source;
  var notes = (S.teachers && S.teachers.notes) || [];

  var why;
  if (c && !c.teachersActive){
    why = 'The Teachers tab was read and yielded <b>no Active rows at all</b> ' +
          '(' + c.classes + ' classes found). The <b>Status</b> column must read exactly ' +
          '<b>Active</b> — that is the whole filter.';
  } else if (c && c.teachersActive && !c.withTeachers){
    why = 'The teacher list is fine &mdash; <b>' + c.teachersActive + ' Active teachers</b> &mdash; ' +
          'and <b>' + c.classes + ' classes</b> were found, but <b>not one of them has a teacher</b>. ' +
          'That is one fault, not ' + c.classes + '. It is the <b>CT 1 / CT 2 / CTA 1 / CTA 2</b> ' +
          'columns of Class Allocations.';
  } else if (c && !c.classes){
    why = 'Class Allocations was found but is <b>empty</b> &mdash; no rows yielding a class code.';
  } else if (!have.length){
    /* Confirmed against readClassTeachers_ on 2 August: it filters on NOTHING.
       No year, no cohort, no status on the class row. It opens a tab named
       exactly 'Class Allocations', reads the class code from column B, and
       returns what it finds. An empty map therefore means it never found the
       tab — and a tab it cannot find is skipped in silence. */
    why = 'The reply carried <b>no classes at all</b>, and the Master itself opened fine. ' +
          'The tracker looks for a tab named <b>exactly “Class Allocations”</b> and reads the ' +
          'class code from <b>column B</b>. If the tab is named anything else &mdash; an emoji ' +
          'prefix, a trailing space, “Class Allocation” singular &mdash; it is skipped without ' +
          'an error. <b>Check the tab name letter for letter</b>, and that “Teachers” is spelled ' +
          'exactly that too.';
  } else if (!withT.length){
    why = 'The Master returned <b>' + have.length + ' classes and not one of them has a teacher</b>. ' +
          'That is not fifteen bad rows &mdash; it is one thing wrong once. Check the <b>CT 1 / CT 2 / ' +
          'CTA 1 / CTA 2</b> column headings in Class Allocations, and that the cells hold <b>Teacher IDs</b> ' +
          '(T-0042) rather than names.';
  } else if (needList.filter(function(c){ return by[c] === undefined; }).length){
    why = 'The Master holds ' + have.length + ' classes but not these ones. Check that the class code in ' +
          'Class Allocations matches the code on the Log row exactly &mdash; a trailing space or a ' +
          'different prefix is enough.';
  } else if (needList.filter(function(c){ return state(c) === 'warn'; }).length){
    why = '<b>' + withT.length + ' of the Master\'s ' + have.length + ' classes do have teachers</b>, ' +
          'so the tab and the columns are being read correctly &mdash; these particular classes have ' +
          'empty CT cells. If the ones that work are all one intake year and the ones that do not are ' +
          'the other, only one intake has been filled in.';
  } else {
    why = 'Every class in this email has teachers. If addresses are still missing, those Teacher IDs ' +
          'have no <b>Active</b> row in the Teachers tab.';
  }

  return '<div class="diag">' +
    '<div class="drow"><b>Classes in today\'s email</b><div>' +
      needList.map(function(c){
        return '<span class="dchip ' + state(c) + '">' + esc(c) + '</span>';
      }).join('') + (blank.length ? '<span class="dchip bad">no class recorded ×' + blank.length + '</span>' : '') +
    '</div></div>' +
    '<div class="drow"><b>The Master returned</b><div>' +
      (have.length
        ? '<div class="dline"><span class="dchip ok">' + withT.length + '</span> with teachers' +
          (withT.length ? ' &mdash; ' + esc(withT.slice(0,10).join(', ')) +
             (withT.length>10 ? ' +' + (withT.length-10) + ' more' : '') : '') + '</div>' +
          '<div class="dline"><span class="dchip warn">' + emptyT.length + '</span> with none' +
          (emptyT.length ? ' &mdash; ' + esc(emptyT.slice(0,10).join(', ')) +
             (emptyT.length>10 ? ' +' + (emptyT.length-10) + ' more' : '') : '') + '</div>'
        : '<i>no classes at all</i>') +
    '</div></div>' +
    (c ? '<div class="drow"><b>What the server counted</b><div>' +
      '<span class="dchip ' + (c.classes ? 'ok' : 'bad') + '">' + c.classes + '</span> classes &nbsp; ' +
      '<span class="dchip ' + (c.withTeachers ? 'ok' : 'warn') + '">' + c.withTeachers + '</span> with a teacher &nbsp; ' +
      '<span class="dchip ' + (c.teachersActive ? 'ok' : 'bad') + '">' + c.teachersActive + '</span> Active teachers' +
      (src ? '<div class="dline">Read from <b>' + esc(src.classAllocations || '?') + '</b> and <b>' +
             esc(src.teachers || '?') + '</b></div>' : '') +
    '</div></div>' : '') +
    (notes.length ? '<div class="drow"><b>The server also noted</b><div>' +
      notes.map(function(n){ return '<div class="dline">' + esc(n) + '</div>'; }).join('') +
    '</div></div>' : '') +
    '<div class="drow"><b>What that means</b><div class="dwhy">' + why + '</div></div>' +
    '<div class="stack rowwise" style="margin-top:10px">' +
      '<button class="plain" id="hidediag">Hide</button></div>' +
  '</div>';
}

function subjectLine(){
  var ds = emailGroups().filter(function(g){ return !g.thu; }).map(function(g){ return g.domain; });
  var what = ds.length ? ds.join(' and ') : 'Thursday privilege';
  return what + ' follow-up — ' + areaOf(S.area).title + ' — ' + todayLong();
}

function plain(html){ return String(html).replace(/<[^>]+>/g,'').replace(/&mdash;/g,'—')
  .replace(/&middot;/g,'·').replace(/&amp;/g,'&').replace(/&times;/g,'×'); }

function emailBody(){
  var lines = ['Dear Form Teachers,', ''];
  emailGroups().forEach(function(g){
    if (g.thu) lines.push('THURSDAY PRIVILEGE');
    else lines.push(g.domain.toUpperCase() + ' — ' + domainLabel(g.domain).toUpperCase());
    lines.push(plain(introFor(g)) + (g.thu ? ' This is counted in Thursdays, not in lates.' : ''));
    lines.push('');
    g.rows.forEach(function(x){
      if (g.thu){
        lines.push(x.name + '  |  ' + x.cls + '  |  ' + x.term + ' separate Thursdays' +
                   '  |  Thursday privilege removed');
        lines.push('    Thursdays: ' + (shortDates(x.dates) || '—'));
      } else {
        lines.push(x.name + '  |  ' + x.cls + '  |  ' + x.term + ' this term (' + x.year + ' this year)' +
                   '  |  Tier ' + x.tier);
        lines.push('    Dates: ' + (shortDates(x.dates) || '—'));
        lines.push('    ' + x.action);
      }
      lines.push('');
    });
  });
  lines.push('Thank you,');
  lines.push(S.user);
  lines.push('Discipline Committee');
  return lines.join('\n');
}

function emailHtml(){
  var all = picked();
  var r = recipients();
  var subject = subjectLine();

  var warn = '';
  if (S.tLoading){
    warn = '<div class="loading"><div class="spin"></div><div>' +
      '<b>Reading the class teachers&hellip;</b>' +
      '<span>From the Master Database, so the email can be addressed.</span></div></div>';
  }
  else if (S.tErr){
    /* The server's own sentence, then what to do about it. Never a silent
       fall-back to an empty list. */
    warn = '<div class="note err"><b>The class teachers could not be read.</b> ' +
      esc(S.tErr) + '<div class="stack rowwise" style="margin-top:12px">' +
      '<button class="ghost sm" id="retryteach">Try again</button>' +
      '<span class="hintx">You can still copy the message and address it by hand.</span>' +
      '</div></div>';
  }
  else if (!r.ready){ warn = ''; }
  else {
    if (r.noClass.length)
      warn += '<div class="note err"><b>' + esc(r.noClass.join(', ')) +
              (r.noClass.length===1 ? ' has' : ' have') + ' no class on the Log row</b>, so there is ' +
              /* Singular "them" either way, deliberately — the Log row has no
                 gender and inventing one would be worse than a plural-looking
                 pronoun. This was a ternary choosing between 'them' and
                 'them' until 4 August 2026. */
              'nobody to address about them. ' +
              'That is a gap in the record rather than a gap in the Master.</div>';
    if (r.absent.length)
      warn += '<div class="note warn"><b>' + esc(r.absent.join(', ')) +
              (r.absent.length===1 ? ' is' : ' are') + ' not in the Master Database\'s ' +
              'Class Allocations at all.</b> Either the class is missing from that tab, or its ' +
              'code there does not match the code on the Log row &mdash; a trailing space is enough.' +
              diagHtml() + '</div>';
    if (r.noIds.length)
      warn += '<div class="note warn"><b>' + esc(r.noIds.join(', ')) +
              (r.noIds.length===1 ? ' is' : ' are') + ' in Class Allocations, but with ' +
              '<u>no Teacher IDs</u> against ' + (r.noIds.length===1?'it':'them') + '.</b> ' +
              'The Master opened and returned the ' + (r.noIds.length===1?'class':'classes') +
              ' &mdash; columns <b>F to I</b> of Class Allocations are empty on those rows. ' +
              'Run <b>📋 Attendance → 🔍 Check for problems</b>, which counts the class teachers ' +
              'it can see.' + diagHtml() + '</div>';
    if (r.unresolved.length)
      warn += '<div class="note err"><b>' + esc(r.unresolved.join(', ')) +
              ' has teachers assigned who are not Active in the Master.</b> ' +
              'That is a data error somebody should fix &mdash; it is not a class without form teachers.</div>';
  }

  var addr = r.list.map(function(p){ return p.email; }).join('; ');

  /* ONE TABLE SHAPE FOR EVERY BLOCK. Student, Class, a right-aligned count,
     a chip, then the dates — so a message carrying two ladders reads as one
     message rather than two things stapled together. */
  var groups = emailGroups();
  var body = groups.map(function(g, i){
    var head = (groups.length > 1 || g.thu)
      ? '<h3' + (i ? '' : ' class="first"') + '>' + esc(g.thu ? 'Thursday privilege' : g.domain) + '</h3>'
      : '';
    var intro = '<p>' + introFor(g) + (g.thu ? ' <b>This is counted in Thursdays, not in lates.</b>' : '') + '</p>';

    var head2 = g.thu
      ? '<th class="n">Thursdays</th><th class="c">Outcome</th>'
      : '<th class="n">This term</th><th class="n">This year</th><th class="c">Tier</th>';

    var tbl = '<table class="etbl' + (g.thu ? ' thu' : '') + '"><thead><tr>' +
      '<th>Student</th><th>Class</th>' + head2 + '<th>Dates</th></tr></thead><tbody>' +
      g.rows.map(function(x){
        var mid = g.thu
          ? '<td class="n">' + x.term + '</td>' +
            '<td class="c"><span class="chip none">Privilege removed</span></td>'
          : '<td class="n">' + x.term + '</td><td class="n">' + x.year + '</td>' +
            '<td class="c"><span class="chip ' + sevClass(x.tier) + '">Tier ' + x.tier + '</span></td>';
        return '<tr class="' + (g.thu ? '' : sevClass(x.tier)) + '">' +
          '<td>' + esc(x.name) + '</td><td>' + esc(x.cls) + '</td>' + mid +
          '<td>' + esc(shortDates(x.dates) || '—') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      (g.thu ? '' : legendFor(g.domain));

    return head + intro + tbl;
  }).join('');

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="appbar"><a data-go="lc">&larr; ' + esc(areaOf(S.area).title) + '</a></div>' +
    '<h1>Today\'s email</h1>' +
    '<div class="who">' + groups.map(function(g){
        return g.rows.length + ' ' + (g.thu ? 'Thursday privilege' : g.domain);
      }).join(', ') + ' &middot; ' +
      r.list.length + ' recipient' + (r.list.length===1?'':'s') + '.</div>' +
    warn +
    '<div class="mailto"><div><b>To</b> ' + esc(r.list.map(function(p){
        return (p.honorific? p.honorific+' ':'') + p.name; }).join(', ') || '—') + '</div>' +
      '<div><b>Subject</b> ' + esc(subject) + '</div>' +
      '<div class="addr">' + esc(addr || 'no addresses') + '</div></div>' +
    '<div class="stack rowwise">' +
      '<button id="copyaddr" class="ghost sm">Copy the addresses</button>' +
      '<button id="copybody" class="ghost sm">Copy the message</button>' +
      '<button id="outlook">Open Outlook and copy the message</button>' +
    '</div>' +
    '<div class="mailbox"><p>Dear Form Teachers,</p>' + body + '</div>' +
    '<div class="note q"><b>Copying records nothing.</b> The follow-up is only written down when ' +
      'you confirm below that the email has actually gone.</div>' +
    '<div class="stack rowwise">' +
      '<button id="record"' + (S.busy?' disabled':'') + '>' +
        (S.busy ? 'Recording&hellip;' : 'Yes, I have sent it &mdash; record all ' + all.length) + '</button>' +
      '<button class="plain" data-go="lc">Not yet</button>' +
    '</div>' +
    (S.err ? '<div class="note err" id="err">' + esc(S.err) + '</div>' : '') +
  '</div></div>';
}

/* ── the write ────────────────────────────────────────────────────────── */
function record(){
  var rows = picked();
  if (!rows.length) return;
  S.busy = true; S.err=''; render();

  /* actionTaken is always sent, and it is the tier's own wording — so the
     record says what was asked of the form teacher, not merely that somebody
     was emailed. One batch, one sentence, because one email covers them all. */
  var action = 'Daily follow-up email to form teachers — ' + areaOf(S.area).title;

  api('hubStamp', {
    token: TOKEN,
    entryIds: rows.map(function(x){ return x.entryId; }),
    by: S.user,
    actionTaken: action
  }).then(function(res){
    S.busy = false;
    if (!res || !res.ok){ S.err = (res && res.error) || 'Nothing was recorded.'; render(); return; }
    /* OPTIMISTIC. The snapshot will not know about this until it next
       rebuilds, so the screen carries the change itself and says so. */
    rows.forEach(function(x){ S.stamped[x.entryId] = { by:S.user }; });
    S.sel = {};
    S.result = { stamped: Number(res.stamped)||0, already: Number(res.alreadyDone)||0, total: rows.length };
    go('sent');
  }).catch(function(){
    S.busy = false; S.err = 'Could not reach the server. Nothing was recorded — try again.'; render();
  });
}

/* The two other writes this screen owns. Both record A DECISION SOMEBODY TOOK,
   never an edit to what happened. */
function doAsk(){
  var a = S.ask, r = $('reason') ? $('reason').value.trim() : '';
  if (a.kind !== 'unhold' && !r){
    S.err = 'A reason is required. Without one the record is indistinguishable from a mistake ' +
            'when somebody reads it back in a year.';
    render(); return;
  }
  S.busy = true; S.err = ''; render();

  var call, body = { token: TOKEN, by: S.user };
  if (a.kind === 'overturn'){ call='hubOverturn'; body.entryId = a.entryId; body.reason = r; }
  else { call = (a.kind==='hold') ? 'hubHold' : 'hubUnhold';
         body.studentId = S.student.id; body.domain = S.student.domain;
         if (r) body.reason = r; }

  api(call, body).then(function(res){
    S.busy = false;
    if (!res || !res.ok){ S.err = (res && res.error) || 'Nothing was recorded.'; render(); return; }
    if (a.kind === 'overturn') S.local[a.entryId] = 'Overturned';
    else S.holdLocal[S.student.id + '|' + S.student.domain] = (a.kind==='hold') ? 'Held' : 'Open';
    S.ask = null; render();
  }).catch(function(){
    S.busy = false; S.err = 'Could not reach the server. Nothing was recorded — try again.'; render();
  });
}

function sentHtml(){
  var r = S.result || { stamped:0, already:0, total:0 };
  var head = r.stamped + ' recorded.';
  var extra = '';
  if (r.already){
    /* NOT an error. Somebody else got there first, which is a real thing that
       happens when two people work the same list, and the screen should say
       which rather than swallowing it. */
    extra = '<div class="note warn"><b>' + r.already + ' of them ' + (r.already===1?'was':'were') +
      ' already followed up</b> before you sent this &mdash; somebody else had stamped ' +
      (r.already===1?'it':'them') + '. Nothing was overwritten, and ' +
      (r.already===1?'that student is':'those students are') + ' still in your email.</div>';
  }
  return '<div class="screen centre"><div class="wrap">' +
    '<div class="date">' + esc(todayLong()) + '</div>' +
    '<h1 class="big">' + esc(head) + '</h1>' +
    '<div class="lede">Written on the offence that reached the tier &mdash; ' +
      'the date, your name, and what the tier asked for. ' +
      'The counts on the previous screen are still from the last snapshot; ' +
      'they catch up at the next snapshot rebuild.</div>' + extra +
    '<div class="stack">' +
      '<button data-go="lc">Back to ' + esc(areaOf(S.area).title) + '</button>' +
      '<button class="ghost" data-go="menu">All areas</button>' +
    '</div>' +
  '</div></div>';
}

/* A read still in flight, on a screen somebody has already opened. It reuses
   the existing loading vocabulary rather than inventing a third one. */
function readingHtml(what){
  return '<div class="screen centre"><div class="wrap">' +
    '<div class="loading"><div class="spin"></div>' +
      '<div><b>Reading ' + esc(what) + '&hellip;</b>' +
      '<span>This one is read live rather than from the snapshot, so it takes a moment.</span>' +
    '</div></div>' +
    '<div class="stack"><button class="plain" data-go="menu">Back to all areas</button></div>' +
  '</div></div>';
}

function soonHtml(){
  return '<div class="screen centre"><div class="wrap">' +
    '<h1 class="big">Not built yet.</h1>' +
    '<div class="lede">The counts on the menu are real &mdash; they come from the same snapshot as ' +
      'everything else, so you can see whether this area is moving. The screen itself is a later ' +
      'slice. Latecoming follow-up shipped first because it is the one replacing something ' +
      'somebody is doing by hand every week.</div>' +
    '<div class="stack"><button data-go="menu">Back to all areas</button></div>' +
  '</div></div>';
}

/* ── clipboard and Outlook ────────────────────────────────────────────── */
function copy(text, btn){
  var done = function(){ if (btn){ var t=btn.textContent; btn.textContent='Copied';
      setTimeout(function(){ btn.textContent=t; }, 1400); } };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

/* ONE BUTTON, TWO THINGS. Outlook opens with the recipients and the subject
   filled in; the body goes on the clipboard, because a mailto: long enough to
   carry a table is not reliable anywhere. Click, Ctrl+V, send. */
function openOutlook(){
  var r = recipients();
  var subject = subjectLine();
  copy(emailBody(), $('outlook'));
  var to = r.list.map(function(p){ return p.email; }).join(';');
  var url = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject);
  window.__hubMailto = url;
  /* An anchor rather than location.href: a mailto: assignment can leave the
     page in a half-navigated state in some builds, and an anchor click is
     what every mail-handler expects. */
  var a = document.createElement('a');
  a.href = url; a.style.display = 'none';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ── wiring ───────────────────────────────────────────────────────────── */
function wire(){
  var v = $('view');

  if ($('go')) $('go').addEventListener('click', signIn);
  if ($('pw')) $('pw').addEventListener('keydown', function(e){ if (e.key==='Enter') signIn(); });
  /* THE STATE LIVES ON THE ELEMENTS, NOT IN S. A reveal that survived a
     re-render would mean a password left visible on a staffroom screen after
     a failed attempt redrew the page — so it deliberately resets to hidden
     every time this screen is drawn. */
  /* Draw Google's button whenever the sign-in screen exists. It has to happen
     in wire() rather than once at startup, because render() replaces the div
     it draws into every time the screen is redrawn. */
  if ($('gbtn')) paintGoogle();

  if ($('peek')) $('peek').addEventListener('click', function(){
    var f = $('pw'); if (!f) return;
    var showing = f.type === 'text';
    f.type = showing ? 'password' : 'text';
    this.classList.toggle('showing', !showing);
    this.setAttribute('aria-label', showing ? 'Show the password' : 'Hide the password');
    this.setAttribute('title', showing ? 'Show the password' : 'Hide the password');
    f.focus();
  });
  if ($('nm')) { if (S.name) { if ($('pw')) $('pw').focus(); } else $('nm').focus(); }
  if ($('out')) $('out').addEventListener('click', signOut);

  if ($('mail')) $('mail').addEventListener('click', function(){
    go('email');
    if (!S.teachers) loadTeachers();
  });
  if ($('all')) $('all').addEventListener('click', function(){
    worklist(S.area).forEach(function(x){ if (!isStamped(x)) S.sel[x.entryId]=true; }); render();
  });
  if ($('none')) $('none').addEventListener('click', function(){ S.sel={}; render(); });
  if ($('record')) $('record').addEventListener('click', record);
  if ($('hold')) $('hold').addEventListener('click', function(){
    S.ask = { kind: heldNow(S.student) ? 'unhold' : 'hold' }; S.err=''; render();
  });
  if ($('doask')) $('doask').addEventListener('click', doAsk);
  if ($('eretry')) $('eretry').addEventListener('click', function(){
    S.pending.early = true; render();
    loadEarly().then(function(){ S.pending.early = false; render(true); });
  });
  if ($('gretry')) $('gretry').addEventListener('click', function(){
    S.pending.groom = true; render();
    loadGrooming().then(function(){ S.pending.groom = false; render(true); });
  });
  if ($('cancelask')) $('cancelask').addEventListener('click', function(){ S.ask=null; S.err=''; render(); });
  if ($('reason')) $('reason').focus();
  if ($('copyaddr')) $('copyaddr').addEventListener('click', function(){
    copy(recipients().list.map(function(p){ return p.email; }).join('; '), this); });
  if ($('copybody')) $('copybody').addEventListener('click', function(){ copy(emailBody(), this); });
  if ($('retryteach')) $('retryteach').addEventListener('click', loadTeachers);
  if ($('showdiag')) $('showdiag').addEventListener('click', function(){ S.diag = true; render(); });
  if ($('hidediag')) $('hidediag').addEventListener('click', function(){ S.diag = false; render(); });
  if ($('outlook')) $('outlook').addEventListener('click', openOutlook);

  v.onclick = function(e){
    var t = e.target;
    var nav = t.closest && t.closest('[data-go]');
    if (nav){ go(nav.getAttribute('data-go')); return; }

    var tab = t.closest && t.closest('[data-tab]');
    if (tab){ S.tab = tab.getAttribute('data-tab'); render(); return; }

    var tool = t.closest && t.closest('[data-url]');
    if (tool){
      var u = tool.getAttribute('data-url');
      if (u) window.open(u, '_blank', 'noopener');
      return;
    }

    /* BEFORE [data-open], and it has to be. A .rowgo carrying data-eopen has
       no data-open on it, so the order is not strictly load-bearing today —
       but the two mean different things (a student ID versus a snapshot entry
       ID) and putting the more specific one first is what stops a future row
       that carries both from silently taking the wrong path. */
    var eopn = t.closest && t.closest('[data-eopen]');
    if (eopn){ e.stopPropagation(); openStudentFromEarly(eopn.getAttribute('data-eopen')); return; }

    /* THE WHOLE ROW IS THE BUTTON, which is what makes the target the width
       of the page rather than the width of the arrow. Toggled on the element
       rather than in S on purpose: a fold that survived a re-render would
       spring open again every time a figure refreshed underneath it. */
    var fld = t.closest && t.closest('[data-fold]');
    if (fld){
      var box = $(fld.getAttribute('data-fold'));
      if (box) box.classList.toggle('open');
      return;
    }

    var opn = t.closest && t.closest('[data-open]');
    if (opn){ e.stopPropagation(); openStudent(opn.getAttribute('data-open')); return; }

    var exc = t.closest && t.closest('[data-excuse]');
    if (exc){ S.ask = { kind:'overturn', entryId: exc.getAttribute('data-excuse') }; S.err=''; render(); return; }

    var pick = t.closest && t.closest('[data-pick]');
    if (pick){
      var id = pick.getAttribute('data-pick');
      /* IN PLACE — the row she just clicked must not make the page move. */
      if (S.sel[id]) delete S.sel[id]; else S.sel[id] = true;
      pick.classList.toggle('sel', !!S.sel[id]);
      var b = pick.querySelector('.badge');
      var n = Array.prototype.indexOf.call(pick.parentNode.children, pick) + 1;
      if (b) b.innerHTML = S.sel[id] ? '&#10003;' : String(n);
      var mail = $('mail');
      if (mail){
        var c = picked().length;
        mail.disabled = !c;
        mail.innerHTML = 'Write today\'s email &mdash; ' + c + ' student' + (c===1?'':'s');
      }
      return;
    }

    var etab = t.closest && t.closest('[data-etab]');
    if (etab){ S.etab = etab.getAttribute('data-etab'); render(); return; }

    var gtab = t.closest && t.closest('[data-gtab]');
    if (gtab){ S.gtab = gtab.getAttribute('data-gtab'); render(); return; }

    var area = t.closest && t.closest('[data-area]');
    if (area){
      var key = area.getAttribute('data-area');
      if (key === '__early'){ go('early'); return; }
      if (key === '__groom'){ ensureGrooming(); go('groom'); return; }
      var a = areaOf(key);
      if (a && a.built) openArea(key); else go('soon');
      return;
    }
  };
}

/* Teacher addresses arrive only when an email is being written, and are held
   in memory for the session. Never localStorage — the same rule as the token.

   A FAILURE HERE MUST NOT LOOK LIKE A SCHOOL WITH NO FORM TEACHERS. The first
   build degraded a failed read into an empty map, which the screen then
   reported as "no teachers listed for 26S04" — blaming the class for the
   server's problem, and giving nobody anything to act on. */
function loadTeachers(){
  S.tLoading = true; S.tErr = ''; render();
  return api('hubTeachers', { token: TOKEN }).then(function(res){
    S.tLoading = false;
    if (res && res.ok){
      S.teachers = { byClass: res.byClass || {}, unresolvedByClass: res.unresolvedByClass || {},
                     /* Round 4. Absent on an older deployment — everything below
                        degrades to the counts the Hub can work out for itself. */
                     counts: res.counts || null, source: res.source || null,
                     notes: res.notes || [] };
      S.tErr = '';
    } else {
      S.teachers = null;
      S.tErr = (res && res.error) || 'The class teachers could not be read.';
    }
    render();
  }).catch(function(){
    S.tLoading = false; S.teachers = null;
    S.tErr = 'Could not reach the server to read the class teachers.';
    render();
  });
}

/* Exposed for the automated checks only. */
window.__hub = S;
window.__hubRender = render;
window.__hubWorklist = worklist;
window.__hubRecipients = recipients;
window.__hubEmailBody = emailBody;
window.__hubPickedThu = pickedThu;
window.__hubOpenStudent = openStudent;

render(true);

})();
</script>
