/* ── the daily email ──────────────────────────────────────────────────── */
/* ══ DETENTION ═════════════════════════════════════════════════════════════
   Built 12 August 2026. FRONTEND ONLY — hubSchedule, hubAttendance and
   hubDetention were all written in WebApi.gs on 1 August, LockService-guarded
   and already in ROLE_ACTIONS.dc, and this file had never called any of them.
   Nothing in Apps Script changed for this, so nothing needs redeploying.

   THE ONE THING TO UNDERSTAND BEFORE EDITING ANY OF IT: a session is not a
   record. It is every row sharing a Session date. That string IS the join key,
   which is why exactly one function below formats one, and why adding to an
   existing session sends back the stored string rather than a re-made one.
   Two spellings of the same Wednesday are two rooms, and nothing anywhere
   would notice. */

var ATT_OK = 'Attended';
var MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* THE ONLY PLACE A SESSION DATE IS FORMATTED. Matches stampFor_ in
   SheetTools.gs — 'dd MMM yyyy (EEE)', DAY ZERO-PADDED — which is what Issued
   on and every other date the system writes already uses. The padding is not
   cosmetic: '9 Aug 2026 (Sun)' and '09 Aug 2026 (Sun)' are different strings
   and therefore different rooms. */
function dstamp(d){
  return ('0' + d.getDate()).slice(-2) + ' ' + MON3[d.getMonth()] + ' ' +
         d.getFullYear() + ' (' + DOW3[d.getDay()] + ')';
}
/* '09 Aug 2026 (Sun)' back to a Date, at midnight. Null if it is not that
   shape — which is possible, because the Detention tab is plain text and the
   old workbook's dates will arrive through the import in whatever spellings it
   used. A row whose date cannot be read is shown, never silently dropped. */
function dparse(s){
  var m = /^\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/.exec(String(s||''));
  if (!m) return null;
  var mi = MON3.map(function(x){ return x.toLowerCase(); }).indexOf(m[2].toLowerCase());
  if (mi < 0) return null;
  return new Date(Number(m[3]), mi, Number(m[1]));
}
function midnight(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

/* ONE SPELLING PER DAY, ENFORCED RATHER THAN HOPED FOR.
   Added 12 August 2026. dstamp already matched stampFor_ byte for byte, but
   nothing forced anything else through it, and two things bypass it:

     · Rescheduled to is FREE TEXT. Typing '26 Aug' created a phantom session
       by that name, sitting in Coming up for ever, permanently disjoint from
       the real 26 August room.
     · THE IMPORT. The old workbook writes unpadded days, so '2 Sep 2026 (Wed)'
       and '02 Sep 2026 (Wed)' became two rooms for one afternoon — rendered
       with the identical label, so nobody could tell which was which.

   canonDate returns the canonical spelling of anything it can read, and '' for
   anything it cannot. It accepts what the old book actually contains: unpadded
   days, dd/mm/yyyy, yyyy-mm-dd, and a missing day-name. */
function canonDate(s){
  var t = String(s||'').trim();
  if (!t) return '';
  var m = /^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/.exec(t);
  if (m){
    var mi = MON3.map(function(x){ return x.toLowerCase(); })
                 .indexOf(m[2].slice(0,3).toLowerCase());
    if (mi >= 0) return dstamp(new Date(Number(m[3]), mi, Number(m[1])));
  }
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(t);
  if (m){ var y = Number(m[3]); if (y < 100) y += 2000;
          return dstamp(new Date(y, Number(m[2]) - 1, Number(m[1]))); }
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
  if (m) return dstamp(new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  return '';
}
/* WHERE A SITTING ACTUALLY FALLS. A row moved to a later Wednesday is owed on
   the NEW date, not the old one — overdue() read only the stored date, so a
   sitting that somebody had marked and properly rescheduled into the future
   was still reported overdue, turned the menu red, and was listed under a
   sentence its own row contradicted two inches away. */
function effDate(d){ return canonDate(d.moved) || canonDate(d.date) || ''; }

/* The next N Wednesdays, today included if today IS one. Wednesday because
   that is what the record says every session has been; it is a SUGGESTION and
   the free date field beside it is the answer to a week that moves. */
function nextWeds(n){
  var out = [], d = midnight();
  while (d.getDay() !== 3) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  for (var i = 0; i < n; i++){
    out.push(new Date(d.getFullYear(), d.getMonth(), d.getDate() + i * 7));
  }
  return out;
}

function detOk(){ return !!(S.det && S.det.ok !== false && S.det.columns); }

/* Every row of 🪑 Detention as an object. Reads BY HEADER NAME, like every
   other read in this file, so a column inserted in the middle of DET_COLS
   cannot silently shift the meaning of a screen. */
function detRows(){
  if (!detOk() || !S.det.rows) return [];
  var c = colIndex(S.det.columns);
  return S.det.rows.map(function(r, i){
    return {
      i:i,
      did:      String(cell(r,c,'Detention ID')||''),
      sid:      String(cell(r,c,'Student ID')||''),
      name:     String(cell(r,c,'Name')||''),
      cls:      String(cell(r,c,'Class')||''),
      area:     String(cell(r,c,'Area')||''),
      srcEntry: String(cell(r,c,'Source Entry ID')||''),
      ladder:   String(cell(r,c,'Ladder')||''),
      tier:     Number(cell(r,c,'Tier'))||0,
      n:        Number(cell(r,c,'Session n'))||0,
      of:       Number(cell(r,c,'Session of'))||0,
      date:     String(cell(r,c,'Session date')||''),
      slot:     String(cell(r,c,'Slot')||''),
      by:       String(cell(r,c,'Issued by')||''),
      on:       String(cell(r,c,'Issued on')||''),
      att:      String(cell(r,c,'Attendance')||''),
      moved:    String(cell(r,c,'Rescheduled to')||''),
      table:    String(cell(r,c,'Table')||''),
      remarks:  String(cell(r,c,'Remarks')||''),
      term:     String(cell(r,c,'Term')||'')
    };
  });
}

/* STILL OWED, DERIVED — never stored, which is the decision of 1 August and
   the reason carry-over survives a term boundary and a year boundary without
   anybody maintaining it. A row is owed until somebody marks it Attended.
   A past date that is not Attended is owed AND overdue; that is the number
   worth putting on a screen. */
function isOwed(d){ return d.att !== ATT_OK; }

/* A LINE FROM THE OLD BOOK, WHICH CANNOT BE OVERDUE.
   Added 12 August 2026, an hour after the first import put 231 of them in the
   tab and the screen announced 89 sittings still owed. Kim: "the still owed
   being 89 is crazy to me."

   She was right and the arithmetic agreed exactly — 99 imported rows are not
   marked Attended, less about ten the book recorded as excused. Every one is a
   Wednesday in March or May that was dealt with in March or May: rescheduled,
   chased, excused, or quietly dropped. Whatever happened, it happened, and the
   book is the only record of it. Treating "nobody typed Attended" as "still
   owed" is right for a sitting THIS system issued and wrong for a sitting it
   merely inherited.

   THE TEST IS THE MISSING LINK, NOT THE ID PREFIX. Every row booked through the
   Hub carries a Source Entry ID; every imported row deliberately does not. So
   "no link" means "not ours", which is the actual property that matters —
   whereas IMP- is a naming convention that a future import could change. */
function isHistoric(d){ return !d.srcEntry; }
/* Judged on the EFFECTIVE date — see effDate. A row whose date cannot be read
   at all is never "past": an unreadable date is not evidence of anything, and
   guessing at it is how an imported line becomes a chase. */
function isPast(d){ var t = dparse(effDate(d)); return !!t && t < midnight(); }
function overdue(){
  return detRows().filter(function(d){ return isOwed(d) && isPast(d) && !isHistoric(d); });
}
/* Shown, never chased. Counted on its own so that importing history cannot
   silently inflate the one number the Wednesday actually runs on. */
function historic(){ return detRows().filter(isHistoric); }
/* Rows the import left with a date nothing can read. Surfaced on their own,
   never counted as upcoming and never counted as overdue. */
function undated(){ return detRows().filter(function(d){ return !effDate(d); }); }

/* WHICH MENU AREA A DETENTION ROW BELONGS TO, and this is not the identity
   mapping it looks like. The snapshot's Area is cohort + DOMAIN — 'JC1 A(VRP)',
   'JC1 Thursday privilege' — while the menu's four keys are cohort + KIND:
   'JC1 Attendance'. They coincide for latecoming and for nothing else, so a
   filter written as `d.area === key` finds every latecoming row and no
   absence row at all, quietly, on the one screen where a missing row means
   "nothing is owed". Mirrors the match functions in AREAS, deliberately: if
   those change, this has to change with them. */
function areaKeyOf(area){
  var s = String(area || '');
  var m = /^(JC[12])\s+(.*)$/.exec(s);
  if (!m) return '';
  if (/^A\(/.test(m[2])) return m[1] + ' Attendance';
  if (m[2] === 'Latecoming' || m[2] === 'Thursday privilege') return m[1] + ' Latecoming';
  return '';
}
/* A ROW WHOSE COHORT COULD NOT BE DERIVED. pushSnapshotRow_ writes
   Area = (cohort ? cohort + ' ' : '') + domain, so a class code cohortOf_
   cannot read produces a BARE domain — 'A(WOR)' rather than 'JC1 A(WOR)'.
   That is the Headstart case in the weeks before their JC1 year starts, and
   it is exactly the population the 6 August naming decision was made for.
   Such a row belongs to no menu area, which is honest; what is not honest is
   letting it fall silently out of every screen. It is named here so the
   all-areas view can say so. */
function homeless(x){ return !areaKeyOf(x.area); }

/* EVERY DATE THIS STUDENT IS ALREADY ON, in any area. hubSchedule refuses a
   second row for one student on one date, and it is right to — two people
   following up different domains would otherwise book somebody into the same
   afternoon twice and find out when the student turned up expecting to leave
   after one. The refusal is the guard; this is so nobody meets it. */
function takenDates(sid){
  var t = {};
  detRows().forEach(function(d){
    if (d.sid !== sid) return;
    /* BOTH DATES, and the second one is the fix. takenDates read only the
       stored Session date, so a student moved from 19 August to 2 September
       could be booked onto 2 September again — and apiHubSchedule_'s own clash
       check had the identical hole, reading only column 10, so the refusal
       that this list exists to pre-empt did not fire either. Both are fixed;
       this one so nobody meets the error, that one so nobody gets past it. */
    var a = canonDate(d.date);   if (a) t[a] = 1;
    var b = canonDate(d.moved);  if (b && d.att !== ATT_OK) t[b] = 1;
  });
  return t;
}

/* A SESSION IS EVERY ROW SHARING A DATE — plus anybody rescheduled INTO it.
   The second half matters and is easy to miss: hubAttendance writes
   Rescheduled to onto the SAME row and leaves Session date alone, so a moved
   student is still filed under the afternoon they missed. They belong in both
   rooms, saying different things in each: expected-and-absent in the old one,
   arriving-by-reschedule in the new. */
function roomFor(date){
  var want = canonDate(date) || String(date||'').trim();
  return detRows().filter(function(d){
    var here  = (canonDate(d.date)  || String(d.date||'').trim())  === want;
    var moved = (canonDate(d.moved) || String(d.moved||'').trim()) === want;
    return here || (moved && d.att !== ATT_OK);
  });
}
function movedInto(d, date){
  var want = canonDate(date) || String(date||'').trim();
  return (canonDate(d.date) || String(d.date||'').trim()) !== want &&
         (canonDate(d.moved) || String(d.moved||'').trim()) === want;
}

/* Every session date that exists, soonest first, with what is in it. */
/* GROUPED ON THE CANONICAL SPELLING, and carrying the RAW string that was
   actually stored. Both halves matter: grouping on the canonical form is what
   stops two spellings of one Wednesday becoming two rooms, and keeping the raw
   one is what lets a booking ADD TO an existing session by sending back the
   exact string already in the sheet rather than inventing a third spelling. */
function sessions(){
  var seen = {};
  var add = function(raw){
    var k = canonDate(raw);
    if (!k) return;                       // unreadable — see undated()
    if (!seen[k]) seen[k] = { canon:k, raw:String(raw).trim() };
  };
  detRows().forEach(function(d){
    add(d.date);
    if (d.moved && d.att !== ATT_OK) add(d.moved);
  });
  return Object.keys(seen).map(function(k){
    var room = roomFor(k), t = dparse(k);
    /* SLOT IS NOT PART OF THE KEY — the session date is the join key, by
       design, and that is what makes a Wednesday a shared room. But the
       retired 1.30–3.30pm slot ran CONCURRENTLY with 3.30–5.30pm in 2025 and
       early 2026, so a historical date can hold two genuinely different
       sittings. Grouping them is right; hiding that is not, so the slots
       present are carried and the card names them when there is more than one. */
    var slots = {};
    room.forEach(function(d){ if (d.slot) slots[d.slot] = (slots[d.slot]||0) + 1; });
    return { date:k, raw:seen[k].raw, when:t, room:room, slots:slots,
             owed:room.filter(isOwed).length,
             done:room.filter(function(d){ return !isOwed(d); }).length,
             marked:room.filter(function(d){ return !!d.att; }).length };
  }).sort(function(a,b){ return a.when - b.when; });
}
function upcoming(){ var t = midnight(); return sessions().filter(function(s){ return s.when >= t; }); }
function pastSessions(){ var t = midnight(); return sessions().filter(function(s){ return s.when < t; }); }
/* DISTINCT SITTINGS BOOKED AHEAD, not room appearances. A rescheduled student
   is deliberately in two rooms — correct for the room view, and a double count
   the moment you sum room sizes, which is what the menu's headline figure did. */
function bookedAhead(){
  var t = midnight();
  return detRows().filter(function(d){
    var w = dparse(effDate(d));
    return !!w && w >= t;
  }).length;
}

/* WHO STILL NEEDS BOOKING, ACROSS EVERY AREA. One entry per student per area,
   because the ladder that produced the debt is what the notice has to name. */
function owedBookings(filterKey){
  var out = [];
  (filterKey ? rowsFor(filterKey) : allRows()).forEach(function(x){
    /* A HOLD PAUSES FOLLOW-UP, AND BOOKING IS FOLLOW-UP. Offences keep
       accruing while a hold is on; only the following up stops, and issuing a
       detention notice is following up. A held domain is still visible on its
       area's worklist carrying who held it and why — it is paused, not hidden. */
    if (isHeld(x)) return;
    /* BLANK IS NOT ZERO. null means the 🪜 Ladders cell is empty — nobody has
       decided what this tier owes — which is a thing to surface, not a thing
       to treat as "owes nothing". 0 is a decision and is respected. */
    /* THE SERVER'S FIGURE, NOT THE TIER'S. x.owed already has the ladder's
       Sessions basis applied — the tier's total for latecoming, the sum over
       every instance for truancy. x.sessions is kept for display, because
       "tier 6 owes 2" is still the sentence a person wants to read. */
    if (x.owed === null){
      out.push({ x:x, owed:null, booked:0, left:0, unknown:false, undecided:true });
      return;
    }
    if (!x.owed) return;
    var b = bookedFor(x.id, x.area, x.termNo);
    var left = (b === null) ? x.owed : Math.max(0, x.owed - b);
    if (!left) return;
    out.push({ x:x, owed:x.owed, booked:(b===null?0:b), left:left,
               unknown:(b===null), undecided:false });
  });
  return out.sort(function(a,b){
    if (a.undecided !== b.undecided) return a.undecided ? -1 : 1;
    if (b.x.tier !== a.x.tier) return b.x.tier - a.x.tier;
    if (b.left !== a.left) return b.left - a.left;
    return String(a.x.name).localeCompare(String(b.x.name));
  });
}

/* What else this student owes, outside the area being booked. Not a total to
   act on — a sentence to read before adding a fifth Wednesday to somebody's
   month. The ladders do not compound; only the sittings do. */
function elsewhereFor(sid, area){
  return owedBookings(null).filter(function(o){
    return o.x.id === sid && o.x.area !== area && !o.undecided && o.left;
  });
}

/* ── the Detention tab inside an area ─────────────────────────────────── */
function lcDetHtml(key){
  if (!detOk()){
    return '<div class="note err"><b>🪑 Detention could not be read.</b> ' +
      esc((S.det && S.det.error) || 'The tab did not come back with the rest of the sign-in.') +
      ' Nothing here is safe to act on until it does &mdash; a booking list built from an ' +
      'unreadable record would show every session as still to book.' +
      '<div class="stack"><button class="ghost sm" id="detretry">Try reading it again</button></div></div>';
  }
  var all = owedBookings(key);
  var owe = all.filter(function(o){ return !o.undecided; });
  var unset = all.filter(function(o){ return o.undecided; });
  var mine = detRows().filter(function(d){ return areaKeyOf(d.area) === key; });
  var late = mine.filter(function(d){ return isOwed(d) && isPast(d); });

  var head = '<div class="kpi">' +
    '<div><b>' + owe.reduce(function(n,o){ return n + o.left; }, 0) + '</b><span>sessions to book</span></div>' +
    '<div><b>' + owe.length + '</b><span>students waiting</span></div>' +
    '<div><b>' + mine.filter(isOwed).length + '</b><span>booked, not yet served</span></div>' +
    '<div><b>' + late.length + '</b><span>overdue</span></div>' +
  '</div>';

  var body;
  if (!owe.length){
    body = '<div class="blank">Nothing in ' + esc(key) + ' is waiting to be booked. ' +
      'A tier only owes sessions where 🪜 Ladders gives it a number &mdash; latecoming tiers 1 to 4 ' +
      'and the Thursday privilege are 0, deliberately, because "further actions" and a removed ' +
      'privilege are not detention.</div>';
  } else {
    body = '<div class="rows">' + owe.map(function(o, i){
      var cls = sevClass(o.x.tier);
      return '<div class="row ' + cls + '" data-book="' + esc(rowKey(o.x)) + '">' +
        '<div class="badge">' + (i+1) + '</div>' +
        '<div class="body"><div class="p">' + esc(o.x.name) + '</div>' +
        '<div class="meta">' + esc(o.x.cls) + ' &middot; ' + esc(domainLabel(o.x.domain)) + '</div>' +
        '<div class="s">' + lineFor(o.x) +
          (o.booked ? ' &mdash; <b>' + o.booked + ' of ' + o.owed + ' already booked</b>' : '') +
        '</div></div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="k">Owes</div><div class="v">' + o.owed + '</div></div>' +
          '<div class="stat"><div class="k">To book</div><div class="v">' + o.left + '</div></div>' +
        '</div>' +
        '<div class="tierslot"><span class="tag ' + cls + '">Tier ' + o.x.tier + '</span>' +
          '<div class="d">' + esc(actionOf(o.x.action, o.x.owed)) + '</div></div>' +
        '<div class="rowgo opn" title="Book ' + esc(o.x.name) + '">' +
          '<span class="lbl">Book</span><span class="chev">&rarr;</span></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  if (unset.length){
    body += '<div class="grouplabel">No session count set on the ladder</div>' +
      '<div class="note warn"><b>' + unset.length + ' tier' + (unset.length===1?'':'s') +
      ' here ' + (unset.length===1?'has':'have') + ' an empty <i>Detention sessions</i> cell in ' +
      '🪜 Ladders.</b> Blank is not zero. Nobody is offered for booking against it, and nothing ' +
      'here is wrong until somebody types a number &mdash; including a 0, which is a real answer.</div>' +
      '<div class="rows">' + unset.map(function(o){
        return '<div class="row flat"><div class="badge">?</div>' +
          '<div class="body"><div class="p">' + esc(o.x.name) + '</div>' +
          '<div class="meta">' + esc(o.x.cls) + ' &middot; ' + esc(o.x.domain) + ' tier ' + o.x.tier + '</div></div>' +
          '<div class="tierslot"><span class="tag quiet">Not set</span></div></div>';
      }).join('') + '</div>';
  }

  var owedList = '';
  if (late.length){
    owedList = '<div class="grouplabel">Overdue in this area</div><div class="rows">' +
      late.map(function(d){ return detRowHtml(d, ''); }).join('') + '</div>' +
      '<div class="note">A session whose date has passed and which nobody marked <b>Attended</b> ' +
      'is still owed. That is derived from the attendance column rather than stored, so it ' +
      'carries across a term and across the year on its own. ' +
      '<b>Lines imported from the old book are never counted here</b> &mdash; whatever ' +
      'happened to a sitting in March happened in March.</div>';
  }

  return head + body + owedList +
    '<div class="note q"><b>Attendance is taken in Detention Sessions, not here.</b> ' +
    'A Wednesday is a shared room &mdash; several people book into the same afternoon from ' +
    'different areas, and whoever is on duty marks everyone in it. ' +
    '<div class="stack"><button class="ghost sm" data-go="det">Open Detention Sessions</button></div></div>';
}

function detRowHtml(d, date){
  var moved = date && movedInto(d, date);
  var tag = !d.att ? '<span class="tag quiet">Not marked</span>'
          : d.att === ATT_OK ? '<span class="tag ok">Attended</span>'
          : '<span class="tag t4">' + esc(d.att) + '</span>';
  return '<div class="row flat' + (d.att === ATT_OK ? ' done' : '') + '">' +
    '<div class="badge">' + (d.att === ATT_OK ? '&#10003;' : '&#9679;') + '</div>' +
    '<div class="body"><div class="p">' + esc(d.name) + '</div>' +
    '<div class="meta">' + esc(d.cls) + ' &middot; ' + esc(d.area) +
      (d.of ? ' &middot; session ' + d.n + ' of ' + d.of : '') +
      (moved ? ' <span class="tag thu">moved from ' + esc(d.date) + '</span>' : '') + '</div>' +
    '<div class="s">' + esc(d.ladder) + (d.tier ? ' tier ' + esc(d.tier) : '') +
      ' &middot; issued ' + esc(d.on || 'date not recorded') + ' by ' + esc(d.by || 'somebody') +
      (d.moved && !moved ? ' &mdash; <b>moved to ' + esc(d.moved) + '</b>' : '') +
      (d.slot && !/3\.30/.test(d.slot) ? ' &middot; <b>' + esc(d.slot) + '</b> (retired slot)' : '') +
      (d.table ? ' &middot; ' + esc(d.table) : '') + '</div></div>' +
    '<div class="tierslot">' + tag + '</div>' +
  '</div>';
}

/* ── booking one student ──────────────────────────────────────────────── */
function openBooking(key){
  var x = rowByKey(key);
  if (!x || x.owed === null || !x.owed) return;
  var b = bookedFor(x.id, x.area, x.termNo);
  var left = (b === null) ? x.owed : Math.max(0, x.owed - b);
  S.err = '';
  /* SET S.area TOO. Booking is reachable from the Detention Sessions screen as
     well as from inside an area, and both Cancel and the back link on the
     booking screen go to 'lc' — which reads S.area and calls areaOf(key).title
     on the result. Arriving from Detention Sessions with S.area still holding
     whatever was open last session, or nothing at all, is a null dereference
     on a screen somebody reached by pressing Cancel. */
  var key = areaKeyOf(x.area);
  /* WHERE BACK GOES. Booking is reachable from inside an area and from the
     all-areas Detention Sessions screen, and a cohort-less row belongs to no
     area at all — so the back link cannot just say "the area". It remembers. */
  go('sched', { sched:{ x:x, booked:(b===null?0:b), left:left,
                        others: otherSittings(x.id, x.area, x.termNo) },
                pickDates:{}, backTo: (areaOf(key) ? 'lc' : 'det'),
                area: (areaOf(key) ? key : S.area) });
}

function schedHtml(){
  var s = S.sched;
  if (!s) return soonHtml();
  var x = s.x;
  var taken = takenDates(x.id);
  var chosen = Object.keys(S.pickDates).filter(function(k){ return S.pickDates[k]; });
  var others = elsewhereFor(x.id, x.area);

  /* EXISTING SESSIONS FIRST, and that ordering is the design rather than a
     preference. Booking ADDS TO a Wednesday somebody else has already opened;
     it does not create a competing one. Offering blank dates first would make
     four people invent four Wednesdays for the same week. */
  var open = upcoming();
  var existing = open.length
    ? open.map(function(o){
        /* THE STORED SPELLING, NOT A REMADE ONE. Adding to a session sends
           back the exact string already in the sheet, so an imported row
           spelled '2 Sep 2026 (Wed)' keeps its room instead of gaining a
           second one spelled '02 Sep 2026 (Wed)'. */
        var on = !!S.pickDates[o.raw], clash = !!taken[o.date];
        return '<div class="row' + (on?' sel':'') + (clash?' done':'') + '"' +
          (clash ? '' : ' data-date="' + esc(o.raw) + '"') + '>' +
          '<div class="badge">' + (on ? '&#10003;' : '&#9679;') + '</div>' +
          '<div class="body"><div class="p">' + esc(longish(o.date)) + '</div>' +
          '<div class="s">' + o.room.length + ' student' + (o.room.length===1?'':'s') +
            ' already in this session' +
            (clash ? ' &mdash; <b>' + esc(x.name) + ' is already in it</b>' : '') +
            (Object.keys(o.slots).length > 1
              ? ' &mdash; <b>two slots on this date:</b> ' + esc(Object.keys(o.slots).join(' · ')) : '') +
          '</div></div>' +
          '<div class="tierslot">' +
            (clash ? '<span class="tag quiet">Already booked</span>'
                   : '<span class="tag ' + (on?'ok':'quiet') + '">' + (on?'Chosen':'Add to this') + '</span>') +
          '</div></div>';
      }).join('')
    : '';

  /* COMPARED ON THE CANONICAL SPELLING. This used to filter on exact string
     equality against the stored one, so a single imported row spelled with an
     unpadded day left the same Wednesday offered TWICE, indistinguishably —
     longish() renders both with the same label. */
  var weds = nextWeds(8).map(dstamp).filter(function(d){
    for (var i=0;i<open.length;i++) if (open[i].date === d) return false;
    return true;
  });
  var newOnes = weds.map(function(d){
    var on = !!S.pickDates[d], clash = !!taken[d];
    return '<div class="row' + (on?' sel':'') + (clash?' done':'') + '"' +
      (clash ? '' : ' data-date="' + esc(d) + '"') + '>' +
      '<div class="badge">' + (on ? '&#10003;' : '&#9679;') + '</div>' +
      '<div class="body"><div class="p">' + esc(longish(d)) + '</div>' +
      '<div class="s">' + (clash ? esc(x.name) + ' is already in this one' : 'a new session') + '</div></div>' +
      '<div class="tierslot">' +
        (clash ? '<span class="tag quiet">Already booked</span>'
               : '<span class="tag ' + (on?'ok':'quiet') + '">' + (on?'Chosen':'Open this one') + '</span>') +
      '</div></div>';
  }).join('');

  var warn = '';
  if (chosen.length && chosen.length !== s.left){
    /* THE PARTIAL-BOOKING WARNING, and it is a real defect rather than a
       nicety. apiHubSchedule_ numbers what it writes IN THIS CALL — Session n
       is rows.length + 1 and Session of is dates.length — so booking two of a
       student's three sittings writes "1 of 2" and "2 of 2", and the third,
       booked later, becomes "1 of 1". The numbering is only true when the
       whole debt goes in one go. Booking all of it at once is therefore the
       default here, and doing otherwise says so. */
    warn = '<div class="note warn"><b>' + chosen.length + ' of ' + s.left +
      ' &mdash; the session numbering will be wrong.</b> The record numbers each sitting ' +
      'against what is booked in one go, so booking part of a debt now writes ' +
      '&ldquo;' + chosen.length + ' of ' + chosen.length + '&rdquo; and the rest starts again at one. ' +
      'It is cosmetic on the sheet and confusing on a notice. Book all ' + s.left +
      ' together unless you have a reason not to.</div>';
  }

  var earlier = (s.others || []);
  var earlierNote = earlier.length
    ? '<div class="note warn"><b>' + esc(x.name) + ' already has ' + earlier.length +
      ' sitting' + (earlier.length===1?'':'s') + ' recorded in this area from another term.</b> ' +
      earlier.map(function(d){
        return esc(d.date || 'no date') + (d.att ? ' &mdash; ' + esc(d.att) : ' &mdash; not marked') +
               (String(d.term||'').trim() ? ' <i>(term ' + esc(d.term) + ')</i>'
                                          : ' <i>(imported &mdash; no term recorded)</i>');
      }).join(' &middot; ') +
      '. <b>Those are not subtracted from what is owed here</b>, because they belong to a ' +
      'different term or to an imported line that cannot be tied to an offence. Check before ' +
      'booking if you think one of them was for this.</div>'
    : '';

  var elsewhere = others.length
    ? '<div class="note"><b>' + esc(x.name) + ' also owes sessions elsewhere.</b> ' +
      others.map(function(o){ return o.left + ' from ' + esc(o.x.area); }).join(' &middot; ') +
      '. The ladders do not compound &mdash; each one reached its own tier on its own count &mdash; ' +
      'but the sittings do, and that is <b>' +
      (others.reduce(function(n,o){ return n+o.left; }, s.left)) +
      '</b> separate afternoons. One student, one session a day.</div>'
    : '';

  return '<div class="screen' + (S.first?'':' still') + '"><div class="wrap wide">' +
    '<div class="appbar"><a data-go="' + (S.backTo || 'lc') + '">&larr; ' +
      esc(S.backTo === 'det' ? 'Detention Sessions' : x.area) + '</a><span>&middot;</span>' +
      '<span>Signed in as ' + esc(S.user) + '</span></div>' +
    '<div class="date">Booking detention</div>' +
    '<h1>' + esc(x.name) + '</h1>' +
    '<div class="who">' + esc(x.cls) + ' &middot; ' + esc(x.cohort) + ' &middot; ' +
      esc(domainLabel(x.domain)) + ' tier ' + x.tier + '</div>' +
    '<div class="lede">' + esc(actionOf(x.action, x.owed)) + '</div>' +
    '<div class="kpi">' +
      '<div><b>' + s.x.owed + '</b><span>owed this term</span></div>' +
      '<div><b>' + s.booked + '</b><span>already booked</span></div>' +
      '<div><b>' + s.left + '</b><span>to book now</span></div>' +
      '<div><b>' + chosen.length + '</b><span>chosen</span></div>' +
    '</div>' + elsewhere + earlierNote +
    (existing ? '<div class="grouplabel">Sessions already running &mdash; add to one</div>' +
                '<div class="rows">' + existing + '</div>' : '') +
    '<div class="grouplabel">Or open a new Wednesday</div><div class="rows">' + newOnes + '</div>' +
    warn +
    '<div class="stack rowwise">' +
      '<button id="dobook"' + ((chosen.length && !S.busy)?'':' disabled') + '>' +
        (S.busy ? 'Booking&hellip;' : 'Book ' + chosen.length + ' session' + (chosen.length===1?'':'s')) +
      '</button>' +
      '<button class="plain" data-go="' + (S.backTo || 'lc') + '">Cancel</button>' +
    '</div>' +
    (S.err ? '<div class="note err">' + S.err + '</div>' : '') +
    '<div class="note q"><b>The slot comes from ⚙️ Config, not from this screen.</b> ' +
    'One slot runs &mdash; 3.30 to 5.30pm. The 1.30 to 3.30pm slot was retired for 2026; its rows ' +
    'are kept because they are history. Nothing here sends anything to anybody: the notice is ' +
    'paper, and it is handed over by the form teacher.</div>' +
  '</div></div>';
}

function bookSessions(){
  var s = S.sched; if (!s) return;
  var dates = Object.keys(S.pickDates).filter(function(k){ return S.pickDates[k]; });
  if (!dates.length) return;
  S.busy = true; S.err = ''; render();

  /* NO RETRY, and hubSchedule is deliberately absent from RETRY_SAFE. A
     duplicated booking is not a visible error — it is a student sitting a
     Wednesday they did not owe, found by nobody. If the reply goes missing the
     honest answer is the one the whole project uses: it may have worked, go
     and look. */
  api('hubSchedule', {
    token: TOKEN,
    studentId: s.x.id, name: s.x.name, cls: s.x.cls,
    area: s.x.area, ladder: s.x.domain, tier: s.x.tier,
    sourceEntryId: s.x.entryId,
    sessionDates: dates,
    /* THE NUMBERING IS THE TIER'S, NOT THIS CALL'S. apiHubSchedule_ used to
       number what it wrote in one go — Session n = rows.length + 1, Session of
       = dates.length — so booking two of a three-session debt wrote "1 of 2"
       and "2 of 2", and the third, booked later, started again at "1 of 1".
       The server now takes these two and falls back to its old behaviour when
       they are absent, so an older caller is unaffected. */
    sessionOf: s.x.owed,
    startAt: s.booked,
    term: s.x.termNo,
    by: S.user
  }).then(function(res){
    S.busy = false;
    if (!res || !res.ok){
      S.err = esc((res && res.error) || 'Nothing was booked.');
      render(); return;
    }
    S.result = { booked: Number(res.booked)||0, clash: (res.clash||[]).length, name: s.x.name };
    S.pickDates = {};
    /* RE-READ RATHER THAN GUESS. Mirroring the server's row locally would mean
       this screen believed something nobody had confirmed, and the mirror
       would drift the first time apiHubSchedule_ changed a default. */
    refreshDet().then(function(){ go('booked'); });
  }).catch(function(e){
    S.busy = false;
    S.err = reachErr(e, 'book the detention');
    render();
  });
}

function bookedHtml(){
  var r = S.result || { booked:0, clash:0, name:'' };
  var extra = r.clash
    ? '<div class="note warn"><b>' + r.clash + ' date' + (r.clash===1?' was':'s were') +
      ' skipped</b> &mdash; ' + esc(r.name) + ' was already in ' + (r.clash===1?'that session':'those sessions') +
      '. One student, one session a day. Nothing was doubled up.</div>'
    : '';
  return '<div class="screen centre"><div class="wrap">' +
    '<div class="date">' + esc(todayLong()) + '</div>' +
    '<h1 class="big">' + r.booked + ' session' + (r.booked===1?'':'s') + ' booked.</h1>' +
    '<div class="lede">Written into 🪑 Detention against the offence that reached the tier, ' +
      'with your name on it. The paper notice is printed and handed over by the form teacher &mdash; ' +

      '<button class="plain" data-go="menu">All areas</button>' +
    '</div>' +
